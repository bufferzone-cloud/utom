<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>UTOM · Live Class</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        :root {
            --gold: #F5B042;
            --gold-dark: #c47f1a;
            --gold-light: #fff8ed;
            --bg: #f4f5f8;
            --card-bg: #ffffff;
            --text: #1a1d28;
            --text-secondary: #5f6377;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.08);
            --radius-sm: 14px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --transition: 0.2s ease;
            --green: #2ecc71;
            --red: #e63946;
        }
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        .page {
            display: none;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
            width: 100%;
        }
        .page.active {
            display: block;
        }
        .back-btn {
            background: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .big-btn {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 20px auto;
            padding: 40px;
            background: linear-gradient(135deg, var(--gold), #ff6b00);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(245, 176, 66, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .big-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(245, 176, 66, 0.35);
        }
        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 32px;
            box-shadow: var(--shadow-sm);
            max-width: 600px;
            margin: 0 auto;
        }
        .form-card h2 {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1.5px solid #e5e8ed;
            font-size: 15px;
            background: #fafbfc;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 176, 66, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), #ff6b00);
            color: #fff;
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: var(--transition);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(245, 176, 66, 0.25);
        }
        .start-btn {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            margin-top: 24px;
        }
        /* Live Streaming Page */
        .stream-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
        }
        .stream-header {
            background: #1a1d28;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .stream-header .class-info h3 {
            margin: 0;
            font-size: 18px;
        }
        .stream-header .class-info p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }
        .stream-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            min-height: 0;
        }
        .video-box {
            position: relative;
            flex: 1;
            background: #000;
            min-height: 300px;
        }
        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .drawing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
            pointer-events: none;
        }
        .drawing-overlay.active {
            pointer-events: auto;
        }
        #scratchCanvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
            background: transparent;
        }
        /* Video grid for remote participants */
        #videoGrid {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 200px;
            max-height: 100%;
            overflow-y: auto;
        }
        .participant-video {
            width: 160px;
            height: 120px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 10px;
            overflow: hidden;
            background: #111;
        }
        .participant-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: #1a1d28;
            flex-wrap: wrap;
        }
        .control-btn {
            background: #333;
            color: #fff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn.active {
            background: var(--gold);
        }
        .control-btn:hover {
            background: #444;
        }
        .control-btn.end-class {
            background: var(--red);
            width: auto;
            padding: 0 20px;
            border-radius: 30px;
            font-size: 14px;
        }
        .bottom-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            background: var(--bg);
            flex-shrink: 0;
        }
        .question-box,
        .stats-box {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 15px;
            box-shadow: var(--shadow-sm);
        }
        .question-box h4,
        .stats-box h4 {
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
        }
        .question-box .question-form {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .question-box input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1.5px solid #e5e8ed;
        }
        .question-box button {
            background: var(--gold);
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
        }
        .question-list {
            max-height: 150px;
            overflow-y: auto;
        }
        .question-item {
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f5;
            font-size: 13px;
        }
        .stats-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
        }
        .stat-number {
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            text-align: center;
        }
        .stat-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
        }
        .raised-hands-list {
            max-height: 100px;
            overflow-y: auto;
        }
        .raised-hand-item {
            padding: 4px 0;
            font-size: 12px;
        }
        /* History */
        .history-list {
            max-width: 800px;
            margin: 0 auto;
        }
        .history-card {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .history-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .history-card h3 {
            margin: 0;
            font-size: 16px;
        }
        .history-card p {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 4px 0 0;
        }
        .history-detail {
            max-width: 800px;
            margin: 0 auto;
        }
        .history-detail h2 {
            margin-bottom: 10px;
        }
        .history-detail .meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .history-detail .questions-list {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 15px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 15px;
        }
        .history-detail .questions-list h4 {
            margin-bottom: 10px;
        }
        .history-detail .questions-list ul {
            list-style: none;
            padding: 0;
        }
        .history-detail .questions-list li {
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f5;
            font-size: 13px;
        }
        .download-btn {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .download-btn:hover {
            transform: translateY(-2px);
        }
        /* Responsive */
        @media (max-width: 768px) {
            .bottom-panel {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .big-btn {
                width: 90%;
                padding: 30px;
                font-size: 18px;
            }
            #videoGrid {
                max-width: 120px;
            }
            .participant-video {
                width: 100px;
                height: 75px;
            }
            .control-bar {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div id="appLoader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;">
        <div class="loader-spinner" style="width:48px;height:48px;border:5px solid #e5e7eb;border-top:5px solid var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p style="margin-top:20px;font-weight:700;color:var(--text-secondary);">Loading Live Studio...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:5000;display:flex;flex-direction:column;gap:10px;"></div>

    <!-- ========== HOME PAGE ========== -->
    <div id="homePage" class="page active">
        <button class="back-btn" onclick="window.location.href='admin.html'"><i class="fas fa-arrow-left"></i> Back to Admin</button>
        <div style="text-align:center;padding-top:40px;">
            <button class="big-btn" onclick="showSection('createClassPage')">
                <i class="fas fa-video" style="display:block;font-size:48px;margin-bottom:15px;"></i>
                Create Live Class
            </button>
            <button class="big-btn" onclick="showSection('historyPage')" style="background:linear-gradient(135deg,#3498db,#2980b9);">
                <i class="fas fa-history" style="display:block;font-size:48px;margin-bottom:15px;"></i>
                History
            </button>
        </div>
    </div>

    <!-- ========== CREATE CLASS PAGE ========== -->
    <div id="createClassPage" class="page">
        <button class="back-btn" onclick="showSection('homePage')"><i class="fas fa-arrow-left"></i> Back</button>
        <div class="form-card">
            <h2><i class="fas fa-video" style="color:var(--gold);"></i> Create Live Class</h2>
            <div class="form-group">
                <label>Class Name</label>
                <input type="text" id="className" placeholder="e.g. Math 101" />
            </div>
            <div class="form-group">
                <label>Lecture Name</label>
                <input type="text" id="lectureName" placeholder="e.g. Dr. Smith" />
            </div>
            <div class="form-group">
                <label>Select Register</label>
                <select id="registerSelect">
                    <option value="">Select a register</option>
                </select>
            </div>
            <button class="btn-primary start-btn" onclick="startLiveClass()">
                <i class="fas fa-play"></i> Start Class
            </button>
        </div>
    </div>

    <!-- ========== LIVE PAGE ========== -->
    <div id="livePage" class="page">
        <div class="stream-container">
            <div class="stream-header">
                <div class="class-info">
                    <h3 id="liveClassName">Class Name</h3>
                    <p id="liveLectureName">Lecture</p>
                </div>
                <div class="stream-timer" id="streamTimer" style="font-size:20px;font-weight:700;">00:00</div>
            </div>
            <div class="stream-body">
                <div class="video-box">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <canvas id="scratchCanvas" class="drawing-overlay"></canvas>
                    <!-- Video grid for remote participants (overlay) -->
                    <div id="videoGrid"></div>
                </div>
                <div class="control-bar">
                    <button class="control-btn" id="toggleCameraBtn" onclick="toggleCamera()" title="Camera On/Off">
                        <i class="fas fa-video"></i>
                    </button>
                    <button class="control-btn" id="toggleMicBtn" onclick="toggleMic()" title="Mic On/Off">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button class="control-btn" id="toggleScreenBtn" onclick="toggleScreenShare()" title="Share Screen">
                        <i class="fas fa-desktop"></i>
                    </button>
                    <button class="control-btn" id="toggleDrawingBtn" onclick="toggleDrawing()" title="Draw on Screen">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button class="control-btn end-class" onclick="endLiveClass()">
                        <i class="fas fa-stop"></i> End Class
                    </button>
                </div>
                <div class="bottom-panel">
                    <div class="question-box">
                        <h4><i class="fas fa-question-circle"></i> Student Questions</h4>
                        <div class="question-form">
                            <input type="text" id="questionInput" placeholder="Ask a question...">
                            <button onclick="addQuestion()">Send</button>
                        </div>
                        <div class="question-list" id="questionList">
                            <div style="color:var(--text-secondary);font-size:12px;">No questions yet.</div>
                        </div>
                    </div>
                    <div class="stats-box">
                        <h4><i class="fas fa-users"></i> Live Stats</h4>
                        <div class="stats-row">
                            <div>
                                <div class="stat-number" id="joinedCount">0</div>
                                <div class="stat-label">Joined</div>
                            </div>
                            <div>
                                <div class="stat-number" id="raisedHandsCount">0</div>
                                <div class="stat-label">Hands Raised</div>
                            </div>
                        </div>
                        <div class="raised-hands-list" id="raisedHandsList">
                            <div style="color:var(--text-secondary);font-size:12px;">No hands raised yet.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== HISTORY PAGE ========== -->
    <div id="historyPage" class="page">
        <button class="back-btn" onclick="showSection('homePage')"><i class="fas fa-arrow-left"></i> Back</button>
        <div class="history-list" id="historyList">
            <div style="text-align:center;padding:40px;color:var(--text-secondary);">No live classes yet.</div>
        </div>
    </div>

    <!-- ========== HISTORY DETAIL PAGE ========== -->
    <div id="historyDetailPage" class="page">
        <button class="back-btn" onclick="showSection('historyPage')"><i class="fas fa-arrow-left"></i> Back to History</button>
        <div class="history-detail" id="historyDetailContent">
            <!-- Will be filled dynamically -->
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // Firebase Configuration (same as admin)
        const firebaseConfig = {
            apiKey: "AIzaSyDHiQHbATgnQIIB9X-gOM5XdmRbOsUJoBQ",
            authDomain: "utom-c4003.firebaseapp.com",
            databaseURL: "https://utom-c4003-default-rtdb.firebaseio.com",
            projectId: "utom-c4003",
            storageBucket: "utom-c4003.firebasestorage.app",
            messagingSenderId: "878225874050",
            appId: "1:878225874050:web:643626906bfd233eeae89b"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const LIVEKIT_TOKEN_SERVER = "https://utom-livekit-token.jubelmobz19.workers.dev"; // fixed trailing slash

        // Global Variables
        let currentClass = null;
        let classStartTime = null;
        let classTimerInterval = null;
        let isCameraOn = true;
        let isMicOn = true;
        let isScreenSharing = false;
        let isDrawing = false;
        let joinedStudents = {};
        let raisedHands = {};
        let drawingQueue = [];

        // TURN servers
        const iceServers = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "turn:global.relay.metered.ca:80", username: "ff9b5e603d75447bba6ebc9c", credential: "XMFx6MoZrP/NB3wb" },
                { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "ff9b5e603d75447bba6ebc9c", credential: "XMFx6MoZrP/NB3wb" },
                { urls: "turn:global.relay.metered.ca:443", username: "ff9b5e603d75447bba6ebc9c", credential: "XMFx6MoZrP/NB3wb" },
                { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "ff9b5e603d75447bba6ebc9c", credential: "XMFx6MoZrP/NB3wb" }
            ]
        };

        // ========== PAGE NAVIGATION ==========
        function showSection(sectionId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            const target = document.getElementById(sectionId);
            if (target) target.classList.add('active');
        }

        // ========== TOAST ==========
        function showToast(msg, type = 'info') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.cssText = `
                background: #1a1d28; color: #fff; padding: 12px 20px; border-radius: 30px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 10px;
                font-weight: 500; font-size: 12px; max-width: 340px;
            `;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-bell';
            toast.innerHTML = `<i class="fas ${icon}" style="color:var(--gold);"></i> ${msg}`;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ========== AUTH CHECK ==========
        auth.onAuthStateChanged(user => {
            if (!user || !user.email?.startsWith('admin@')) {
                window.location.href = 'admin.html';
                return;
            }
            document.getElementById('appLoader').style.display = 'none';
            loadRegisters();
            loadHistory();
        });

        // ========== LOAD REGISTERS ==========
        function loadRegisters() {
            const regRef = db.ref('registers');
            regRef.once('value', snap => {
                const registers = snap.val() ? Object.entries(snap.val()).map(([id, r]) => ({ id, ...r })) : [];
                const select = document.getElementById('registerSelect');
                select.innerHTML = '<option value="">Select a register</option>' + registers.map(r =>
                    `<option value="${r.id}">${r.name} (${r.lecture})</option>`
                ).join('');
            });
        }

        function resetLiveUI() {
    // Reset question list
    document.getElementById('questionList').innerHTML = '<div style="color:var(--text-secondary);font-size:12px;">No questions yet.</div>';
    
    // Reset hands list
    document.getElementById('raisedHandsList').innerHTML = '<div style="color:var(--text-secondary);font-size:12px;">No hands raised yet.</div>';
    
    // Reset counts
    document.getElementById('joinedCount').textContent = '0';
    document.getElementById('raisedHandsCount').textContent = '0';
    
    // Clear remote video grid
    document.getElementById('videoGrid').innerHTML = '';
    
    // Clear drawing canvas
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.classList.remove('active');
    document.getElementById('toggleDrawingBtn').classList.remove('active');
    
    // Reset flags
    isDrawing = false;
    isScreenSharing = false;
    document.getElementById('toggleScreenBtn').classList.remove('active');
}

        // ========== START LIVE CLASS ==========
        async function startLiveClass() {
            const className = document.getElementById('className').value.trim();
            const lectureName = document.getElementById('lectureName').value.trim();
            const registerId = document.getElementById('registerSelect').value;

            if (!className || !lectureName || !registerId) {
                alert('Please complete all required fields.');
                return;
            }

            try {
                const classRef = db.ref('liveClasses').push();
                const classId = classRef.key;
                const roomName = `class_${classId}`;

                const regSnap = await db.ref('registers/' + registerId).once('value');
                const registerData = regSnap.val();

                const classData = {
                    id: classId,
                    className: className,
                    lectureName: lectureName,
                    registerId: registerId,
                    register: registerData || {},
                    liveKitRoom: roomName,
                    status: 'active',
                    startedAt: firebase.database.ServerValue.TIMESTAMP
                };

                await classRef.set(classData);

                currentClass = classData;
                classStartTime = Date.now();

                const user = firebase.auth().currentUser;
                if (!user) throw new Error('You are not logged in.');

                const response = await fetch(LIVEKIT_TOKEN_SERVER + '/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomName: roomName,
                        identity: user.uid,
                        name: user.displayName || 'Admin'
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Token server error (${response.status}): ${errText}`);
                }

                const tokenData = await response.json();
                if (!tokenData.success) throw new Error(tokenData.error || 'Token server returned no success flag.');
                if (!tokenData.serverUrl) throw new Error('Token server did not provide a serverUrl.');

                const room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true
                });
                window.liveKitRoom = room;

                await room.connect(tokenData.serverUrl, tokenData.token);

                await room.localParticipant.setCameraEnabled(true);
                await room.localParticipant.setMicrophoneEnabled(true);

                const localVideo = document.getElementById('localVideo');
                const videoTrack = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
                if (videoTrack && videoTrack.track) {
                    videoTrack.track.attach(localVideo);
                }

                // Register track events for screen share
                room.on(LivekitClient.RoomEvent.TrackPublished, (publication, participant) => {
                    if (participant.isLocal && publication.source === LivekitClient.Track.Source.ScreenShare) {
                        const videoEl = document.getElementById('localVideo');
                        publication.track.attach(videoEl);
                    }
                });

                room.on(LivekitClient.RoomEvent.TrackUnpublished, (publication, participant) => {
                    if (participant.isLocal && publication.source === LivekitClient.Track.Source.ScreenShare) {
                        // Re-attach camera video when screen share ends
                        const cameraTrack = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
                        if (cameraTrack?.track) {
                            cameraTrack.track.attach(document.getElementById('localVideo'));
                        }
                    }
                });

                showClassroom();

                room.on(LivekitClient.RoomEvent.ParticipantConnected, participant => {
                    addRemoteParticipant(participant);
                });

                room.on(LivekitClient.RoomEvent.ParticipantDisconnected, participant => {
                    removeRemoteParticipant(participant.identity);
                });

                console.log('LiveKit connected to room:', roomName);
            } catch (error) {
                console.error('Unable to start live class:', error);
                alert('Unable to start live class: ' + error.message);
            }
        }

        // ========== SHOW CLASSROOM ==========
        function showClassroom() {
    document.getElementById('liveClassName').textContent = currentClass.className;
    document.getElementById('liveLectureName').textContent = currentClass.lectureName;
    document.getElementById('streamTimer').textContent = '00:00';
    
    // 🔥 Reset UI to clean state for new class
    resetLiveUI();
    
    showSection('livePage');
    startTimer();
    listenToLiveClass(currentClass.id);
    
    document.getElementById('toggleCameraBtn').classList.add('active');
    document.getElementById('toggleMicBtn').classList.add('active');
}

        // ========== TOGGLE CAMERA / MIC ==========
        function toggleCamera() {
            if (!window.liveKitRoom) return;
            const room = window.liveKitRoom;
            room.localParticipant.setCameraEnabled(!isCameraOn).then(() => {
                isCameraOn = !isCameraOn;
                const btn = document.getElementById('toggleCameraBtn');
                btn.classList.toggle('active', isCameraOn);
            }).catch(err => showToast('Camera toggle failed: ' + err.message, 'error'));
        }

        function toggleMic() {
            if (!window.liveKitRoom) return;
            const room = window.liveKitRoom;
            room.localParticipant.setMicrophoneEnabled(!isMicOn).then(() => {
                isMicOn = !isMicOn;
                const btn = document.getElementById('toggleMicBtn');
                btn.classList.toggle('active', isMicOn);
            }).catch(err => showToast('Mic toggle failed: ' + err.message, 'error'));
        }

        // ========== SCREEN SHARE TOGGLE ==========
        async function toggleScreenShare() {
            const room = window.liveKitRoom;
            if (!room) return;

            if (!isScreenSharing) {
                try {
                    await room.localParticipant.setScreenShareEnabled(true);
                    isScreenSharing = true;
                    document.getElementById('toggleScreenBtn').classList.add('active');
                    showToast('Screen sharing started', 'success');
                } catch (err) {
                    showToast('Screen share error: ' + err.message, 'error');
                }
            } else {
                await room.localParticipant.setScreenShareEnabled(false);
                isScreenSharing = false;
                document.getElementById('toggleScreenBtn').classList.remove('active');
                showToast('Screen sharing stopped');
            }
        }

        // ========== REMOTE PARTICIPANT MANAGEMENT ==========
        function addRemoteParticipant(participant) {
            const container = document.getElementById('videoGrid');
            if (!container) return;

            let participantElement = document.getElementById('participant-' + participant.identity);
            if (!participantElement) {
                participantElement = document.createElement('div');
                participantElement.id = 'participant-' + participant.identity;
                participantElement.className = 'participant-video';
                container.appendChild(participantElement);
            }

            participant.trackPublications.forEach(publication => {
                if (publication.track && publication.track.kind === 'video') {
                    const element = publication.track.attach();
                    participantElement.appendChild(element);
                }
            });
        }

        function removeRemoteParticipant(identity) {
            const element = document.getElementById('participant-' + identity);
            if (element) element.remove();
        }

        // ========== DRAWING TOGGLE ==========
        function toggleDrawing() {
            const canvas = document.getElementById('scratchCanvas');
            canvas.classList.toggle('active');
            isDrawing = canvas.classList.contains('active');
            const btn = document.getElementById('toggleDrawingBtn');
            btn.classList.toggle('active', isDrawing);
            if (isDrawing) {
                setupCanvas();
            } else {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                shareDrawingFrame();
            }
        }

        function setupCanvas() {
            const canvas = document.getElementById('scratchCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            let isDrawingNow = false;
            let lastX = 0, lastY = 0;

            canvas.addEventListener('mousedown', (e) => {
                isDrawingNow = true;
                lastX = e.offsetX;
                lastY = e.offsetY;
            });
            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawingNow) return;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
                lastX = e.offsetX;
                lastY = e.offsetY;
                scheduleDrawingFrame();
            });
            canvas.addEventListener('mouseup', () => {
                isDrawingNow = false;
                shareDrawingFrame();
            });
            canvas.addEventListener('mouseleave', () => {
                isDrawingNow = false;
            });

            // Touch support
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                lastX = touch.clientX - rect.left;
                lastY = touch.clientY - rect.top;
                isDrawingNow = true;
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!isDrawingNow) return;
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
                lastX = x;
                lastY = y;
                scheduleDrawingFrame();
            });
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                isDrawingNow = false;
                shareDrawingFrame();
            });
        }

        function scheduleDrawingFrame() {
            clearTimeout(drawingQueue);
            drawingQueue = setTimeout(() => {
                shareDrawingFrame();
            }, 300);
        }

        function shareDrawingFrame() {
            if (!currentClass) return;
            const canvas = document.getElementById('scratchCanvas');
            const dataURL = canvas.toDataURL('image/png');
            db.ref(`liveClasses/${currentClass.id}/drawingFrame`).set(dataURL);
        }

        // ========== QUESTIONS ==========
        function addQuestion() {
            const input = document.getElementById('questionInput');
            const text = input.value.trim();
            if (!text || !currentClass) return;

            const qRef = db.ref(`liveClasses/${currentClass.id}/questions`).push();
            const question = {
                text,
                askedBy: 'Admin',
                askedAt: Date.now()
            };
            qRef.set(question);
            input.value = '';
            appendQuestionToUI(question);
        }

        function appendQuestionToUI(question) {
            const list = document.getElementById('questionList');
            if (list.querySelector('.empty-msg')) list.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'question-item';
            item.innerHTML = `<strong>${escapeHtml(question.askedBy)}:</strong> ${escapeHtml(question.text)}`;
            list.appendChild(item);
        }

        // ========== LISTEN TO LIVE CLASS ==========
        function listenToLiveClass(classId) {
            const classRef = db.ref(`liveClasses/${classId}`);

            classRef.child('questions').on('child_added', (snap) => {
                const q = snap.val();
                if (q.askedBy !== 'Admin') {
                    appendQuestionToUI(q);
                }
            });

            classRef.child('joinedStudents').on('value', (snap) => {
                const joined = snap.val() || {};
                joinedStudents = joined;
                document.getElementById('joinedCount').textContent = Object.keys(joined).length;
            });

            classRef.child('raisedHands').on('value', (snap) => {
                const hands = snap.val() || {};
                raisedHands = hands;
                document.getElementById('raisedHandsCount').textContent = Object.keys(hands).length;
                const list = document.getElementById('raisedHandsList');
                const handEntries = Object.entries(hands);
                if (handEntries.length === 0) {
                    list.innerHTML = '<div style="color:var(--text-secondary);font-size:12px;">No hands raised yet.</div>';
                } else {
                    list.innerHTML = handEntries.map(([uid, data]) =>
                        `<div class="raised-hand-item">✋ ${escapeHtml(data.name || 'Student')}</div>`
                    ).join('');
                }
            });
        }

        // ========== END LIVE CLASS ==========
        async function endLiveClass() {
            if (!currentClass) return;

            const endTime = Date.now();
            const duration = Math.floor((endTime - classStartTime) / 1000);

            let questions = [];
            const qSnap = await db.ref(`liveClasses/${currentClass.id}/questions`).once('value');
            if (qSnap.val()) {
                questions = Object.values(qSnap.val());
            }

            if (window.liveKitRoom) {
                try {
                    await window.liveKitRoom.disconnect();
                } catch (e) {
                    console.warn('LiveKit disconnect error:', e);
                }
                window.liveKitRoom = null;
            }

            await db.ref(`liveClasses/${currentClass.id}`).update({
                status: 'ended',
                endedAt: firebase.database.ServerValue.TIMESTAMP,
                duration: duration
            });

            const historyRef = db.ref('liveClassesHistory').push();
            const historyData = {
                className: currentClass.className,
                lectureName: currentClass.lectureName,
                registerId: currentClass.registerId,
                register: currentClass.register,
                startedAt: currentClass.startedAt,
                endedAt: firebase.database.ServerValue.TIMESTAMP,
                duration: duration,
                questions: questions,
                joinedStudents: joinedStudents
            };
            await historyRef.set(historyData);

            await db.ref(`liveClasses/${currentClass.id}`).remove();

            currentClass = null;
            classStartTime = null;
            if (classTimerInterval) clearInterval(classTimerInterval);
            isDrawing = false;
            isScreenSharing = false;
            document.getElementById('scratchCanvas').classList.remove('active');
            document.getElementById('videoGrid').innerHTML = '';

            loadHistory();
            showSection('historyPage');
            showToast('Class ended and saved to history.', 'success');
        }

        // ========== TIMER ==========
        function startTimer() {
            if (classTimerInterval) clearInterval(classTimerInterval);
            classTimerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - classStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('streamTimer').textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        // ========== HISTORY ==========
        function loadHistory() {
            const histRef = db.ref('liveClassesHistory');
            histRef.once('value', snap => {
                const data = snap.val();
                const list = document.getElementById('historyList');
                if (!data) {
                    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);">No live classes yet.</div>';
                    return;
                }
                const items = Object.entries(data).map(([id, h]) => ({ id, ...h })).sort((a,b) => (b.startedAt || 0) - (a.startedAt || 0));
                list.innerHTML = items.map(item => `
                    <div class="history-card" onclick="showHistoryDetail('${item.id}')">
                        <h3><i class="fas fa-video" style="color:var(--gold);"></i> ${escapeHtml(item.className)}</h3>
                        <p>${escapeHtml(item.lectureName)} · ${formatDate(item.startedAt)} · ${formatDuration(item.duration)}</p>
                    </div>
                `).join('');
            });
        }

        function showHistoryDetail(historyId) {
            const histRef = db.ref(`liveClassesHistory/${historyId}`);
            histRef.once('value', snap => {
                const h = snap.val();
                if (!h) return;
                const content = document.getElementById('historyDetailContent');
                const questions = h.questions || [];
                const questionTexts = questions.map(q => q.text);
                content.innerHTML = `
                    <h2>${escapeHtml(h.className)}</h2>
                    <div class="meta">
                        <p><strong>Lecture:</strong> ${escapeHtml(h.lectureName)}</p>
                        <p><strong>Date:</strong> ${formatDate(h.startedAt)}</p>
                        <p><strong>Duration:</strong> ${formatDuration(h.duration)}</p>
                    </div>
                    <div class="questions-list">
                        <h4>Questions Asked</h4>
                        ${questionTexts.length ? `<ul>${questionTexts.map(q => `<li>${escapeHtml(q)}</li>`).join('')}</ul>` : '<p>No questions.</p>'}
                    </div>
                    <div style="margin-top:15px;">
                        <button class="download-btn" onclick="downloadRegister('${historyId}')"><i class="fas fa-download"></i> Download Register</button>
                    </div>
                `;
                showSection('historyDetailPage');
            });
        }

        function downloadRegister(historyId) {
            const histRef = db.ref(`liveClassesHistory/${historyId}`);
            histRef.once('value', snap => {
                const h = snap.val();
                if (!h) return;

                const register = h.register || {};
                const members = register.memberDetails || [];
                const joined = h.joinedStudents || {};

                const rows = [
                    ['#', 'Name', 'Email', 'Attended']
                ];
                members.forEach((m, idx) => {
                    const attended = joined[m.uid] ? 'Yes' : 'No';
                    rows.push([idx + 1, m.name, m.email, attended]);
                });

                const totalMembers = members.length;
                const totalAttended = Object.keys(joined).length;

                rows.push([]);
                rows.push(['Total Members', totalMembers]);
                rows.push(['Total Attended', totalAttended]);
                rows.push(['Not Attended', totalMembers - totalAttended]);

                const csvContent = rows.map(row => row.join(',')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `LiveClass_${h.className}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            });
        }

        // ========== HELPERS ==========
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            return d.toLocaleString();
        }

        function formatDuration(seconds) {
            if (!seconds) return 'N/A';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins} min ${secs} sec`;
        }
    </script>
</body>
