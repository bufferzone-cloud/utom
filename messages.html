<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<title>UTOM · Messages &amp; Testimonies</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<style>
    /* ===== RESET ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    :root {
        --gold: #F5B042;
        --gold-dark: #c47f1a;
        --gold-light: #fff8ed;
        --orange: #ff6b00;
        --bg: #f2f4f8;
        --card-bg: #ffffff;
        --text: #1a1d28;
        --text-secondary: #5f6377;
        --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.10);
        --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.14);
        --radius-sm: 12px;
        --radius-md: 18px;
        --radius-lg: 24px;
        --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }

    /* ===== LOADER ===== */
    #appLoader {
        position: fixed; inset: 0;
        background: var(--bg);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.5s ease;
    }
    #appLoader.hidden { opacity: 0; pointer-events: none; }
    .loader-spinner {
        width: 48px; height: 48px;
        border: 5px solid #e5e7eb; border-top-color: var(--gold);
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #appLoader p { margin-top: 18px; font-weight: 700; color: var(--text-secondary); font-size: 15px; letter-spacing: 0.5px; }
    #appLoader .sub { font-size: 12px; color: #b0b4c0; margin-top: 4px; font-weight: 500; }

    /* ===== APP ROOT ===== */
    .app-root {
        display: flex; flex-direction: column;
        height: 100vh; width: 100%;
        background: var(--bg); overflow: hidden; position: relative;
    }

    /* ===== HEADER ===== */
    .header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        flex-shrink: 0; height: 64px; z-index: 10;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
        width: 42px; height: 42px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: var(--shadow-sm);
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; color: var(--text);
        cursor: pointer; transition: var(--transition);
        flex-shrink: 0;
    }
    .icon-btn:hover { transform: scale(1.05); box-shadow: var(--shadow-md); border-color: rgba(245, 176, 66, 0.2); }
    .icon-btn:active { transform: scale(0.94); }

    .header-title {
        font-size: 18px; font-weight: 800;
        background: linear-gradient(135deg, #d4952a, #f5b042, #ff6b00);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; letter-spacing: -0.3px;
    }

    /* ===== TABS ===== */
    .tabs-bar {
        display: flex; gap: 8px;
        padding: 12px 14px 6px 14px;
        flex-shrink: 0; background: var(--bg);
    }
    .tab-btn {
        flex: 1;
        padding: 11px 16px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.85);
        border: 1.5px solid rgba(0, 0, 0, 0.05);
        font-weight: 700; font-size: 13px;
        color: var(--text-secondary);
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        position: relative;
    }
    .tab-btn:hover { background: #fff; transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .tab-btn.active {
        background: linear-gradient(135deg, #f5b042, #ff6b00);
        color: #fff; border-color: transparent;
        box-shadow: 0 4px 18px rgba(245, 176, 66, 0.28);
    }
    .tab-btn i { font-size: 14px; }
    .tab-btn .badge {
        display: inline-flex; align-items: center; justify-content: center;
        background: #e63946; color: #fff;
        border-radius: 30px; padding: 1px 8px;
        font-size: 10px; font-weight: 800;
        min-width: 20px; height: 18px; line-height: 1;
    }
    .tab-btn.active .badge { background: rgba(255, 255, 255, 0.35); color: #fff; }

    /* ===== CONTENT ===== */
    .content {
        flex: 1; min-height: 0;
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 8px 14px 20px 14px;
        position: relative;
    }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: rgba(245, 176, 66, 0.35); border-radius: 20px; }
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ===== CONVERSATIONS LIST ===== */
    .conversations-list { display: flex; flex-direction: column; gap: 8px; }
    .conv-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        border: 1px solid rgba(255, 255, 255, 0.5);
        cursor: pointer; transition: var(--transition);
    }
    .conv-item:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
        border-color: rgba(245, 176, 66, 0.2);
    }
    .conv-item:active { transform: scale(0.99); }
    .conv-avatar {
        width: 50px; height: 50px; border-radius: 50%;
        background: linear-gradient(135deg, #d4952a, #f5b042);
        color: #fff; font-weight: 800; font-size: 20px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 14px rgba(245, 176, 66, 0.2);
    }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .conv-time { font-size: 10px; color: #8b8fa3; font-weight: 500; }
    .conv-badge {
        background: #e63946; color: #fff;
        border-radius: 30px; padding: 2px 8px;
        font-size: 10px; font-weight: 800;
        min-width: 20px; text-align: center; line-height: 1.4;
        box-shadow: 0 2px 10px rgba(230, 57, 70, 0.3);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
        text-align: center; padding: 60px 20px;
        color: #8b8fa3; font-size: 13px;
    }
    .empty-state i { font-size: 52px; opacity: 0.28; display: block; margin-bottom: 14px; color: var(--gold); }
    .empty-state h3 { font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; font-size: 15px; }
    .empty-state p { font-size: 12px; }

    /* ===== TESTIMONIES ===== */
    .testimonies-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 720px) {
        .testimonies-list { grid-template-columns: 1fr 1fr; }
    }
    .testimony-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-radius: var(--radius-md);
        padding: 16px 18px;
        box-shadow: var(--shadow-sm);
        border: 1px solid rgba(255, 255, 255, 0.5);
        position: relative;
        transition: var(--transition);
    }
    .testimony-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: rgba(245, 176, 66, 0.2); }
    .testimony-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .testimony-avatar {
        width: 42px; height: 42px; border-radius: 50%;
        background: linear-gradient(135deg, #d4952a, #f5b042);
        color: #fff; font-weight: 800; font-size: 16px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 3px 12px rgba(245, 176, 66, 0.2);
    }
    .testimony-user { flex: 1; min-width: 0; }
    .testimony-name { font-weight: 700; font-size: 14px; color: var(--text); }
    .testimony-email { font-size: 11px; color: #8b8fa3; word-break: break-all; }
    .testimony-stars { display: flex; gap: 3px; margin-bottom: 8px; }
    .testimony-stars i { font-size: 16px; }
    .testimony-stars .filled { color: #f5b042; text-shadow: 0 2px 6px rgba(245, 176, 66, 0.25); }
    .testimony-stars .empty { color: #d5d8e0; }
    .testimony-text {
        font-size: 13px; line-height: 1.6; color: var(--text);
        margin-bottom: 10px;
        word-break: break-word;
        background: rgba(255, 248, 237, 0.6);
        border-left: 3px solid var(--gold);
        padding: 10px 14px;
        border-radius: 8px;
    }
    .testimony-footer {
        display: flex; justify-content: space-between; align-items: center;
        padding-top: 10px;
        border-top: 1px solid rgba(0, 0, 0, 0.05);
        gap: 8px;
        flex-wrap: wrap;
    }
    .testimony-time { font-size: 11px; color: #8b8fa3; }
    .testimony-delete {
        background: #fde8e8; color: #c62828;
        border: none; border-radius: 30px;
        padding: 6px 16px; font-size: 11px; font-weight: 700;
        cursor: pointer; transition: var(--transition);
        display: inline-flex; align-items: center; gap: 5px;
    }
    .testimony-delete:hover { background: #e74c3c; color: #fff; transform: translateY(-2px); box-shadow: 0 4px 14px rgba(231, 76, 60, 0.25); }
    .testimony-delete:active { transform: scale(0.95); }

    /* ===== CHAT OVERLAY (WhatsApp style) ===== */
    .chat-overlay {
        position: fixed; inset: 0;
        background: var(--bg);
        z-index: 2000;
        display: flex; flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94), visibility 0.32s;
        visibility: hidden;
    }
    .chat-overlay.open { transform: translateX(0); visibility: visible; }

    .chat-header {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        flex-shrink: 0; height: 64px; z-index: 10;
    }
    .chat-user-info { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .chat-avatar {
        width: 40px; height: 40px; border-radius: 50%;
        background: linear-gradient(135deg, #d4952a, #f5b042);
        color: #fff; font-weight: 800; font-size: 16px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 3px 12px rgba(245, 176, 66, 0.2);
    }
    .chat-user-name { font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-user-status { font-size: 11px; color: #8b8fa3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-body {
        flex: 1; min-height: 0;
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 16px 14px 20px 14px;
        background-color: #e5ddd5;
        background-image:
            radial-gradient(circle at 20% 30%, rgba(245, 176, 66, 0.06) 0%, transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(255, 107, 0, 0.05) 0%, transparent 40%),
            repeating-linear-gradient(45deg, transparent 0 12px, rgba(255, 255, 255, 0.4) 12px 24px);
        display: flex; flex-direction: column;
        gap: 2px;
    }
    .chat-body::-webkit-scrollbar { width: 5px; }
    .chat-body::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 20px; }

    .chat-empty {
        text-align: center; color: #8b8fa3; font-size: 13px;
        padding: 40px 20px;
        margin: auto;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 16px;
        max-width: 300px;
    }
    .chat-empty i { font-size: 42px; opacity: 0.35; display: block; margin-bottom: 10px; color: var(--gold); }
    .chat-empty p { font-weight: 600; }

    .date-divider {
        align-self: center;
        background: rgba(255, 255, 255, 0.92);
        padding: 5px 16px;
        border-radius: 30px;
        font-size: 11px; font-weight: 600; color: #5f6377;
        margin: 10px 0 6px 0;
        box-shadow: var(--shadow-sm);
        border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .message-row { display: flex; width: 100%; margin-bottom: 3px; }
    .message-row.user { justify-content: flex-start; }
    .message-row.admin { justify-content: flex-end; }

    .bubble {
        max-width: 78%;
        padding: 8px 12px 6px 12px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.45;
        word-wrap: break-word;
        overflow-wrap: break-word;
        position: relative;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        animation: bubblePop 0.18s ease-out;
    }
    @keyframes bubblePop {
        from { opacity: 0; transform: scale(0.96) translateY(4px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .message-row.user .bubble {
        background: #ffffff;
        color: var(--text);
        border-top-left-radius: 4px;
    }
    .message-row.admin .bubble {
        background: linear-gradient(135deg, #f5b042, #ff6b00);
        color: #fff;
        border-top-right-radius: 4px;
        box-shadow: 0 2px 8px rgba(245, 176, 66, 0.25);
    }
    .message-row.admin .bubble .bubble-time { color: rgba(255, 255, 255, 0.85); }

    .bubble-text { font-size: 14px; line-height: 1.45; }

    .bubble-image {
        max-width: 260px;
        max-height: 320px;
        width: auto; height: auto;
        border-radius: 12px;
        display: block;
        margin: 2px 0 4px 0;
        cursor: pointer;
        transition: var(--transition);
        background: #f0f0f5;
    }
    .bubble-image:hover { opacity: 0.94; }

    .bubble-time {
        font-size: 10px; color: #8b8fa3;
        text-align: right;
        margin-top: 2px;
        display: flex; align-items: center; justify-content: flex-end; gap: 4px;
        opacity: 0.85;
    }

    /* ===== CHAT INPUT BAR ===== */
    .chat-input-bar {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(0, 0, 0, 0.05);
        flex-shrink: 0;
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .attach-btn {
        width: 42px; height: 42px; border-radius: 50%;
        background: rgba(245, 246, 248, 0.95);
        border: 1px solid rgba(0, 0, 0, 0.05);
        color: var(--text-secondary);
        font-size: 16px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
        transition: var(--transition);
    }
    .attach-btn:hover { background: rgba(245, 176, 66, 0.15); color: var(--gold-dark); transform: scale(1.05); }
    .attach-btn:active { transform: scale(0.94); }

    .chat-input-bar input {
        flex: 1; min-width: 0;
        padding: 12px 18px;
        border-radius: 40px;
        border: 1.5px solid rgba(229, 232, 237, 0.8);
        background: rgba(250, 251, 252, 0.95);
        font-size: 14px; color: var(--text);
        transition: var(--transition);
        font-family: inherit;
    }
    .chat-input-bar input:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 4px rgba(245, 176, 66, 0.10);
        background: #fff;
    }
    .send-btn {
        width: 44px; height: 44px; border-radius: 50%;
        background: linear-gradient(135deg, #f5b042, #ff6b00);
        border: none; color: #fff; font-size: 16px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
        box-shadow: 0 4px 14px rgba(245, 176, 66, 0.28);
        transition: var(--transition);
    }
    .send-btn:hover { transform: scale(1.06); box-shadow: 0 6px 20px rgba(245, 176, 66, 0.35); }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ===== LIGHTBOX ===== */
    .lightbox {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.88);
        backdrop-filter: blur(10px);
        z-index: 5000;
        display: none; align-items: center; justify-content: center;
        padding: 20px;
        cursor: zoom-out;
    }
    .lightbox.open { display: flex; animation: fadeIn 0.2s ease; }
    .lightbox img {
        max-width: 100%; max-height: 100%;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* ===== TOAST ===== */
    .toast-container {
        position: fixed; top: 76px; right: 16px;
        z-index: 9000;
        display: flex; flex-direction: column; gap: 10px;
        max-width: 340px;
        pointer-events: none;
    }
    .toast {
        background: rgba(26, 29, 40, 0.95);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        color: #fff;
        padding: 12px 22px;
        border-radius: 30px;
        box-shadow: var(--shadow-lg);
        display: flex; align-items: center; gap: 10px;
        animation: slideInToast 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        font-weight: 500; font-size: 12px;
        border-left: 3px solid var(--gold);
        pointer-events: auto;
    }
    .toast i { color: var(--gold); font-size: 15px; }
    @keyframes slideInToast {
        from { opacity: 0; transform: translateX(30px) scale(0.95); }
        to { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* ===== DARK MODE ===== */
    body.dark-mode { background: #0f0f0f; color: #e0e0e0; }
    body.dark-mode .app-root, body.dark-mode .content { background: #0f0f0f !important; }
    body.dark-mode .header, body.dark-mode .chat-header, body.dark-mode .tabs-bar, body.dark-mode .chat-input-bar {
        background: rgba(20, 20, 20, 0.92) !important;
        border-color: #2a2a2a !important;
    }
    body.dark-mode .icon-btn { background: #1e1e1e; color: #e0e0e0; border-color: #2a2a2a; }
    body.dark-mode .tab-btn { background: #1e1e1e; color: #aaaaaa; border-color: #2a2a2a; }
    body.dark-mode .tab-btn.active { color: #fff; background: linear-gradient(135deg, #d4952a, #ff6b00); }
    body.dark-mode .conv-item, body.dark-mode .testimony-card {
        background: rgba(30, 30, 30, 0.9) !important;
        border-color: #2a2a2a !important; color: #e0e0e0 !important;
    }
    body.dark-mode .conv-name, body.dark-mode .testimony-name, body.dark-mode .chat-user-name { color: #f1f1f1 !important; }
    body.dark-mode .testimony-text { background: rgba(40, 30, 15, 0.5); color: #cccccc; }
    body.dark-mode .chat-body { background-color: #111; background-image: radial-gradient(circle at 20% 30%, rgba(245,176,66,0.05) 0%, transparent 40%); }
    body.dark-mode .message-row.user .bubble { background: #1e1e1e; color: #e0e0e0; }
    body.dark-mode .message-row.admin .bubble { background: linear-gradient(135deg, #d4952a, #ff6b00); color: #fff; }
    body.dark-mode .chat-input-bar input { background: #1a1a1a; border-color: #333; color: #e0e0e0; }
    body.dark-mode .chat-input-bar input:focus { border-color: var(--gold); }
    body.dark-mode .attach-btn { background: #1e1e1e; color: #aaaaaa; border-color: #2a2a2a; }
    body.dark-mode .date-divider { background: #1e1e1e; color: #888; }
    body.dark-mode .empty-state h3 { color: #aaaaaa; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 520px) {
        .header { padding: 10px 12px; height: 60px; }
        .header-title { font-size: 16px; }
        .icon-btn { width: 38px; height: 38px; font-size: 14px; }
        .content { padding: 6px 10px 16px 10px; }
        .conv-avatar { width: 46px; height: 46px; font-size: 18px; }
        .bubble { max-width: 85%; font-size: 13px; }
        .bubble-image { max-width: 220px; }
        .tab-btn { font-size: 12px; padding: 10px 12px; }
    }
</style>
</head>
<body>

<!-- ===== LOADER ===== -->
<div id="appLoader">
    <div class="loader-spinner"></div>
    <p>Loading Messages …</p>
    <div class="sub">Fetching conversations &amp; testimonies</div>
</div>

<div class="app-root">
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <button class="icon-btn" id="backBtn" title="Back"><i class="fas fa-arrow-left"></i></button>
            <span class="header-title">Messages &amp; Testimonies</span>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="darkModeBtn" title="Toggle dark mode"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <!-- ===== TABS ===== -->
    <div class="tabs-bar" id="tabsBar">
        <button class="tab-btn active" data-tab="messages">
            <i class="fas fa-comments"></i> Messages
            <span class="badge" id="msgBadge" style="display:none">0</span>
        </button>
        <button class="tab-btn" data-tab="testimonies">
            <i class="fas fa-star"></i> Testimonies
        </button>
    </div>

    <!-- ===== CONTENT ===== -->
    <div class="content">
        <!-- Messages list view -->
        <div id="messagesListView" class="view-section active">
            <div id="conversationsList" class="conversations-list">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h3>Loading…</h3></div>
            </div>
        </div>

        <!-- Testimonies view -->
        <div id="testimoniesView" class="view-section">
            <div id="testimoniesList" class="testimonies-list">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h3>Loading…</h3></div>
            </div>
        </div>
    </div>

    <!-- ===== CHAT OVERLAY ===== -->
    <div class="chat-overlay" id="chatOverlay">
        <header class="chat-header">
            <button class="icon-btn" id="chatBackBtn" title="Close chat"><i class="fas fa-arrow-left"></i></button>
            <div class="chat-user-info">
                <div class="chat-avatar" id="chatAvatar">U</div>
                <div style="min-width:0;">
                    <div class="chat-user-name" id="chatUserName">User</div>
                    <div class="chat-user-status" id="chatUserStatus">—</div>
                </div>
            </div>
        </header>

        <div class="chat-body" id="chatBody">
            <div class="chat-empty"><i class="fas fa-comments"></i><p>Loading chat…</p></div>
        </div>

        <form class="chat-input-bar" id="chatForm" autocomplete="off">
            <button type="button" class="attach-btn" id="attachBtn" title="Send photo"><i class="fas fa-image"></i></button>
            <input type="text" id="chatInput" placeholder="Type a message…" autocomplete="off" />
            <button type="submit" class="send-btn" id="sendBtn" title="Send"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- ============================================================= -->
<!-- ===== MAIN SCRIPT ===== -->
<!-- ============================================================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getDatabase, ref, set, push, update, remove, onValue, get, serverTimestamp } from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDHiQHbATgnQIIB9X-gOM5XdmRbOsUJoBQ",
    authDomain: "utom-c4003.firebaseapp.com",
    databaseURL: "https://utom-c4003-default-rtdb.firebaseio.com",
    projectId: "utom-c4003",
    storageBucket: "utom-c4003.firebasestorage.app",
    messagingSenderId: "878225874050",
    appId: "1:878225874050:web:643626906bfd233eeae89b"
};
const CLOUD_NAME = 'dd3lcymrk';
const UPLOAD_PRESET = 'h3eyhc2o';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentAdmin = null;
let users = [];
let conversations = {};     // userId -> { messages: [], lastMessage, unread }
let testimonies = [];
let currentChatUserId = null;
let currentTab = 'messages';
let lightboxEl = null;

/* ---------- helpers ---------- */
const _ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const _ESC_RE = /[&<>"']/g;
function escapeHtml(text) {
    if (text == null || text === '') return '';
    return String(text).replace(_ESC_RE, c => _ESC[c]);
}

function showToast(msg, type = 'info') {
    const t = document.createElement('div');
    t.className = 'toast';
    const icon = type === 'success' ? 'fa-check-circle' :
                 type === 'error'   ? 'fa-exclamation-circle' :
                                      'fa-bell';
    t.innerHTML = `<i class="fas ${icon}"></i> ${escapeHtml(msg)}`;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        t.style.transition = 'opacity 0.3s';
        setTimeout(() => t.remove(), 320);
    }, 3200);
}

function showConfirm(title, message, okLabel = 'Delete') {
    return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s ease;';
        overlay.innerHTML = `
            <div style="background:#fff;border-radius:20px;padding:26px 22px;max-width:380px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.22);text-align:center;font-family:'Inter',sans-serif;">
                <div style="font-size:44px;color:#e74c3c;margin-bottom:8px;">⚠️</div>
                <h3 style="font-size:18px;font-weight:700;color:#1a1d28;margin-bottom:6px;">${escapeHtml(title)}</h3>
                <p style="font-size:13px;color:#5f6377;margin-bottom:20px;line-height:1.5;">${escapeHtml(message)}</p>
                <div style="display:flex;gap:10px;justify-content:center;">
                    <button id="msgCancelBtn" style="background:transparent;border:2px solid #e5e8ed;padding:10px 24px;border-radius:40px;font-weight:600;color:#5f6377;cursor:pointer;font-size:13px;font-family:inherit;">Cancel</button>
                    <button id="msgOkBtn" style="background:linear-gradient(135deg,#e74c3c,#c0392b);border:none;padding:11px 24px;border-radius:40px;color:#fff;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit;box-shadow:0 4px 16px rgba(231,76,60,0.25);">${escapeHtml(okLabel)}</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        overlay.querySelector('#msgOkBtn').onclick = () => { overlay.remove(); resolve(true); };
        overlay.querySelector('#msgCancelBtn').onclick = () => { overlay.remove(); resolve(false); };
        overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } };
    });
}

function formatTimeShort(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    const diffDays = (now - d) / (1000 * 60 * 60 * 24);
    if (diffDays < 7) {
        return d.toLocaleDateString([], { weekday: 'short' });
    }
    return d.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function formatDateLabel(d) {
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return 'Today';
    const yest = new Date(now); yest.setDate(yest.getDate() - 1);
    if (d.toDateString() === yest.toDateString()) return 'Yesterday';
    return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ---------- auth ---------- */
onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    if (!user.email || !user.email.startsWith('admin@')) {
        alert('Admin only.');
        signOut(auth);
        return;
    }
    currentAdmin = user;
    setupRealtime();
    setupUI();
    document.getElementById('appLoader').classList.add('hidden');
    setTimeout(() => document.getElementById('appLoader').style.display = 'none', 600);
});

/* ---------- realtime listeners ---------- */
function setupRealtime() {
    onValue(ref(db, 'users'), snap => {
        const data = snap.val() || {};
        users = Object.entries(data).map(([uid, d]) => ({ uid, ...d }));
        renderConversations();
        updateMsgBadge();
        if (currentChatUserId) {
            updateChatHeader();
            renderChat();
        }
    });

    onValue(ref(db, 'messages'), snap => {
        const data = snap.val() || {};
        const next = {};
        Object.entries(data).forEach(([userId, msgs]) => {
            const list = Object.entries(msgs).map(([id, m]) => ({ id, ...m }));
            list.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            const last = list[list.length - 1] || null;
            const unread = list.filter(m => m.sender === 'user' && !m.read).length;
            next[userId] = { messages: list, lastMessage: last, unread };
        });
        conversations = next;
        renderConversations();
        updateMsgBadge();
        if (currentChatUserId) renderChat();
    });

    onValue(ref(db, 'testimonies'), snap => {
        const data = snap.val() || {};
        testimonies = Object.entries(data).map(([id, d]) => ({ id, ...d }));
        testimonies.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        renderTestimonies();
    });
}

/* ---------- UI setup ---------- */
function setupUI() {
    // Back button
    document.getElementById('backBtn').addEventListener('click', () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'admin.html';
    });

    // Dark mode toggle
    const darkBtn = document.getElementById('darkModeBtn');
    const savedDark = localStorage.getItem('darkMode') === 'true';
    if (savedDark) {
        document.body.classList.add('dark-mode');
        darkBtn.innerHTML = '<i class="fas fa-sun"></i>';
    }
    darkBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('darkMode', isDark);
        darkBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            if (tab === 'messages') {
                document.getElementById('messagesListView').classList.add('active');
            } else {
                document.getElementById('testimoniesView').classList.add('active');
            }
        });
    });

    // Chat back
    document.getElementById('chatBackBtn').addEventListener('click', closeChat);

    // Chat form
    document.getElementById('chatForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentChatUserId) return;
        input.value = '';
        try {
            await sendMessage({ text });
        } catch (err) {
            showToast('Failed to send: ' + err.message, 'error');
        }
    });

    // Attach (image) button
    document.getElementById('attachBtn').addEventListener('click', () => {
        if (!currentChatUserId) return;
        cloudinary.openUploadWidget({
            cloudName: CLOUD_NAME,
            uploadPreset: UPLOAD_PRESET,
            sources: ['local'],
            resourceType: 'image',
            maxFiles: 1,
            clientAllowedFormats: ['jpg', 'jpeg', 'png', 'gif', 'webp'],
            maxFileSize: 155000000,
            cropping: false,
            showAdvancedOptions: false
        }, (err, res) => {
            if (err) { showToast('Upload error: ' + (err.message || 'unknown'), 'error'); return; }
            if (res.event === 'success') {
                sendMessage({
                    mediaUrl: res.info.secure_url,
                    mediaType: 'image'
                }).catch(e => showToast('Failed to send image: ' + e.message, 'error'));
            }
        });
    });

    // Escape key closes lightbox/chat
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (lightboxEl && lightboxEl.classList.contains('open')) {
                lightboxEl.classList.remove('open');
            } else if (currentChatUserId) {
                closeChat();
            }
        }
    });
}

/* ---------- render conversations ---------- */
function renderConversations() {
    const container = document.getElementById('conversationsList');
    const arr = Object.entries(conversations)
        .map(([userId, data]) => {
            const user = users.find(u => u.uid === userId);
            const name = user
                ? (`${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email || 'User')
                : 'Unknown User';
            return { userId, ...data, user, name };
        })
        .filter(c => c.messages && c.messages.length > 0);

    arr.sort((a, b) => {
        const at = a.lastMessage?.timestamp || 0;
        const bt = b.lastMessage?.timestamp || 0;
        return bt - at;
    });

    if (arr.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-comment-slash"></i>
                <h3>No messages yet</h3>
                <p>When users send you messages, they'll appear here.</p>
            </div>`;
        return;
    }

    container.innerHTML = arr.map(c => {
        const initial = (c.name || 'U').charAt(0).toUpperCase();
        const lm = c.lastMessage;
        let preview = '';
        if (lm) {
            if (lm.mediaType === 'image' && lm.mediaUrl) {
                preview = lm.text ? `📷 ${lm.text}` : '📷 Photo';
            } else {
                preview = lm.text || '…';
            }
            if (lm.sender === 'admin') preview = 'You: ' + preview;
        }
        const time = lm && lm.timestamp ? formatTimeShort(lm.timestamp) : '';
        return `
            <div class="conv-item" data-userid="${c.userId}">
                <div class="conv-avatar">${escapeHtml(initial)}</div>
                <div class="conv-info">
                    <div class="conv-name">${escapeHtml(c.name)}</div>
                    <div class="conv-preview">${escapeHtml(preview)}</div>
                </div>
                <div class="conv-meta">
                    <div class="conv-time">${escapeHtml(time)}</div>
                    ${c.unread > 0 ? `<div class="conv-badge">${c.unread > 99 ? '99+' : c.unread}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');

    container.querySelectorAll('.conv-item').forEach(el => {
        el.addEventListener('click', () => openChat(el.dataset.userid));
    });
}

function updateMsgBadge() {
    const total = Object.values(conversations).reduce((sum, c) => sum + (c.unread || 0), 0);
    const badge = document.getElementById('msgBadge');
    if (total > 0) {
        badge.style.display = 'inline-flex';
        badge.textContent = total > 99 ? '99+' : total;
    } else {
        badge.style.display = 'none';
    }
}

/* ---------- render testimonies ---------- */
function renderTestimonies() {
    const container = document.getElementById('testimoniesList');
    if (testimonies.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
                <i class="fas fa-star"></i>
                <h3>No testimonies yet</h3>
                <p>User testimonies with ratings will appear here.</p>
            </div>`;
        return;
    }

    container.innerHTML = testimonies.map(t => {
        const name = t.userName || t.userEmail || 'Anonymous';
        const initial = (name || 'U').charAt(0).toUpperCase();
        const rating = Math.max(1, Math.min(5, parseInt(t.rating) || 0));
        const stars = [1, 2, 3, 4, 5]
            .map(i => `<i class="fas fa-star ${i <= rating ? 'filled' : 'empty'}"></i>`)
            .join('');
        const time = t.timestamp ? new Date(t.timestamp).toLocaleString() : '';
        const text = (t.text || '').replace(/\n/g, '<br>');
        return `
            <div class="testimony-card" data-id="${t.id}">
                <div class="testimony-header">
                    <div class="testimony-avatar">${escapeHtml(initial)}</div>
                    <div class="testimony-user">
                        <div class="testimony-name">${escapeHtml(name)}</div>
                        <div class="testimony-email">${escapeHtml(t.userEmail || '')}</div>
                    </div>
                </div>
                <div class="testimony-stars">${stars}</div>
                <div class="testimony-text">${text}</div>
                <div class="testimony-footer">
                    <span class="testimony-time">${escapeHtml(time)}</span>
                    <button class="testimony-delete" data-id="${t.id}">
                        <i class="fas fa-trash-alt"></i> Delete
                    </button>
                </div>
            </div>
        `;
    }).join('');

    container.querySelectorAll('.testimony-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const t = testimonies.find(x => x.id === id);
            const who = t ? (t.userName || t.userEmail || 'this user') : 'this user';
            const ok = await showConfirm(
                'Delete Testimony?',
                `Delete the testimony from "${who}"? This action cannot be undone.`
            );
            if (!ok) return;
            try {
                await remove(ref(db, `testimonies/${id}`));
                showToast('Testimony deleted', 'success');
            } catch (err) {
                showToast('Error deleting: ' + err.message, 'error');
            }
        });
    });
}

/* ---------- chat ---------- */
async function openChat(userId) {
    currentChatUserId = userId;
    const overlay = document.getElementById('chatOverlay');
    overlay.classList.add('open');
    updateChatHeader();
    renderChat();
    await markChatRead(userId);
    setTimeout(() => {
        try { document.getElementById('chatInput').focus(); } catch (_) {}
    }, 320);
}

function closeChat() {
    const overlay = document.getElementById('chatOverlay');
    overlay.classList.remove('open');
    currentChatUserId = null;
}

function updateChatHeader() {
    const user = users.find(u => u.uid === currentChatUserId);
    const name = user
        ? (`${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email || 'User')
        : 'Unknown User';
    document.getElementById('chatUserName').textContent = name;
    document.getElementById('chatUserStatus').textContent = user?.email || '—';
    document.getElementById('chatAvatar').textContent = name.charAt(0).toUpperCase();
}

function renderChat() {
    const body = document.getElementById('chatBody');
    if (!currentChatUserId) return;
    const conv = conversations[currentChatUserId];
    const msgs = (conv && conv.messages) ? conv.messages : [];

    if (msgs.length === 0) {
        body.innerHTML = `
            <div class="chat-empty">
                <i class="fas fa-comments"></i>
                <p>No messages yet.<br>Send the first message below 👇</p>
            </div>`;
        return;
    }

    let html = '';
    let lastDate = null;
    msgs.forEach(m => {
        const d = new Date(m.timestamp || Date.now());
        const dateStr = d.toDateString();
        if (dateStr !== lastDate) {
            html += `<div class="date-divider">${escapeHtml(formatDateLabel(d))}</div>`;
            lastDate = dateStr;
        }
        const isAdmin = m.sender === 'admin';
        const rowClass = isAdmin ? 'admin' : 'user';

        let inner = '';
        if (m.mediaUrl && m.mediaType === 'image') {
            inner += `<img class="bubble-image" src="${escapeHtml(m.mediaUrl)}" alt="photo" loading="lazy" onclick="window.__openLightbox && window.__openLightbox('${escapeHtml(m.mediaUrl)}')" onerror="this.style.display='none'">`;
        }
        if (m.text) {
            inner += `<div class="bubble-text">${escapeHtml(m.text).replace(/\n/g, '<br>')}</div>`;
        }
        const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        inner += `<div class="bubble-time">${escapeHtml(time)}</div>`;

        html += `<div class="message-row ${rowClass}"><div class="bubble">${inner}</div></div>`;
    });

    body.innerHTML = html;

    requestAnimationFrame(() => {
        body.scrollTop = body.scrollHeight;
    });
}

async function sendMessage({ text = '', mediaUrl = '', mediaType = '' }) {
    if (!currentChatUserId) return;
    const msgRef = push(ref(db, `messages/${currentChatUserId}`));
    await set(msgRef, {
        sender: 'admin',
        text: text,
        mediaUrl: mediaUrl,
        mediaType: mediaType,
        timestamp: Date.now(),
        read: false
    });
}

async function markChatRead(userId) {
    const conv = conversations[userId];
    if (!conv || !conv.messages) return;
    const updates = {};
    conv.messages.forEach(m => {
        if (m.sender === 'user' && !m.read) {
            updates[`messages/${userId}/${m.id}/read`] = true;
        }
    });
    if (Object.keys(updates).length === 0) return;
    try {
        await update(ref(db), updates);
    } catch (err) {
        console.warn('markChatRead failed:', err);
    }
}

/* ---------- lightbox ---------- */
window.__openLightbox = function (url) {
    if (!lightboxEl) {
        lightboxEl = document.createElement('div');
        lightboxEl.className = 'lightbox';
        lightboxEl.innerHTML = '<img src="" alt="Image">';
        lightboxEl.addEventListener('click', () => lightboxEl.classList.remove('open'));
        document.body.appendChild(lightboxEl);
    }
    lightboxEl.querySelector('img').src = url;
    lightboxEl.classList.add('open');
};

/* ---------- cleanup on unload ---------- */
window.addEventListener('beforeunload', () => {
    // no-op (kept for future)
});

console.log('✅ UTOM Messages & Testimonies loaded.');
</script>
