MODULES.students = {
  icon:'fa-user-graduate',
  render(){
    const f = STATE.filters.students;
    const usersArr = Object.entries(S.users).map(([id,d])=>({id,...d}));
    const banned = Object.entries(S.bannedUsers).filter(([,v])=>v).map(([id])=>id);
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved');

    const byStudent = {};
    usersArr.forEach(u => {
      byStudent[u.id] = {
        id:u.id,
        name: `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
        email: u.email || '', phone: u.phone || '',
        banned: banned.includes(u.id),
        purchases: 0, spend: 0, courses: 0, subfolders: 0, shopItems: 0,
        items: []
      };
    });
    txApproved.forEach(t => {
      const s = byStudent[t.userId];
      if(!s) return;
      s.purchases++; s.spend += num(t.amount);
      const type = (t.itemType||'course').toLowerCase();
      if(type === 'course') s.courses++;
      else if(type === 'subfolder') s.subfolders++;
      else if(type === 'shop') s.shopItems++;
      s.items.push({
        title:t.itemTitle||'—', type,
        amount:num(t.amount), date:t.timestamp
      });
    });

    let rows = Object.values(byStudent);
    if(f.status === 'buyers')     rows = rows.filter(r => r.purchases > 0);
    else if(f.status === 'nonBuyers') rows = rows.filter(r => r.purchases === 0);
    else if(f.status === 'banned') rows = rows.filter(r => r.banned);
    else if(f.status === 'active') rows = rows.filter(r => !r.banned && r.purchases > 0);

    if(f.search){
      const q = f.search.toLowerCase();
      rows = rows.filter(r =>
        r.name.toLowerCase().includes(q) ||
        r.email.toLowerCase().includes(q) ||
        r.phone.toLowerCase().includes(q));
    }

    const sorters = {
      'spend-desc': (a,b)=>b.spend - a.spend,
      'spend-asc': (a,b)=>a.spend - b.spend,
      'purchase-desc': (a,b)=>b.purchases - a.purchases,
      'purchase-asc': (a,b)=>a.purchases - b.purchases,
      'name-asc': (a,b)=>a.name.localeCompare(b.name),
      'name-desc': (a,b)=>b.name.localeCompare(a.name)
    };
    rows.sort(sorters[f.sortBy] || sorters['spend-desc']);

    const totalSpend = rows.reduce((s,r)=>s+r.spend,0);
    const totalPurch = rows.reduce((s,r)=>s+r.purchases,0);
    const buyersCount = rows.filter(r => r.purchases > 0).length;
    const bannedCount = rows.filter(r => r.banned).length;

    const top = [...rows].filter(r=>r.spend>0).slice(0,8);

    const takeaway = totalSpend > 0
      ? `<strong>${rows.length}</strong> students · <strong>${buyersCount}</strong> buyers · total spend <strong>${money(totalSpend)}</strong>.`
      : `<strong>${rows.length}</strong> students registered. No purchases in this period yet.`;

    return `
      ${hero('Students','Every registered student with their purchases, spend and account status.')}

      <div class="summary-line">${takeaway}</div>

      <div class="kpi-strip">
        ${kpi('fa-users', rows.length, 'Students', '#3b82f6')}
        ${kpi('fa-user-check', buyersCount, 'Buyers', '#10b981')}
        ${kpi('fa-shopping-bag', totalPurch, 'Purchases', '#8b5cf6')}
        ${kpi('fa-coins', moneyShort(totalSpend), 'Total Spend', '#d4952a')}
        ${kpi('fa-user-slash', bannedCount, 'Banned', '#ef4444')}
      </div>

      ${section('st-top','fa-trophy','Top Spenders', top.length,
        top.length === 0
          ? `<div class="empty"><i class="fas fa-trophy"></i><p>No purchases yet</p></div>`
          : barList(top, 'spend', {
              money: true,
              sub: (it) => `${it.purchases} purchase${it.purchases!==1?'s':''} · ${esc(it.email)}`
            }),
        true)}

      <div class="section open" data-key="st-list">
        <div class="section-head" onclick="window.__toggleOpen('st-list')">
          <h3><i class="fas fa-list"></i> All Students <span class="count">${rows.length}</span></h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          <div class="filters">
            <select id="stStatus">
              <option value="all" ${f.status==='all'?'selected':''}>All students</option>
              <option value="buyers" ${f.status==='buyers'?'selected':''}>Buyers only</option>
              <option value="nonBuyers" ${f.status==='nonBuyers'?'selected':''}>Non-buyers</option>
              <option value="active" ${f.status==='active'?'selected':''}>Active (buyers)</option>
              <option value="banned" ${f.status==='banned'?'selected':''}>Banned</option>
            </select>
            <select id="stSort">
              <option value="spend-desc" ${f.sortBy==='spend-desc'?'selected':''}>Spend ↓</option>
              <option value="spend-asc" ${f.sortBy==='spend-asc'?'selected':''}>Spend ↑</option>
              <option value="purchase-desc" ${f.sortBy==='purchase-desc'?'selected':''}>Purchases ↓</option>
              <option value="purchase-asc" ${f.sortBy==='purchase-asc'?'selected':''}>Purchases ↑</option>
              <option value="name-asc" ${f.sortBy==='name-asc'?'selected':''}>Name A–Z</option>
            </select>
            <input type="text" id="stSearch" placeholder="Search…" value="${esc(f.search)}" />
          </div>
          ${rows.length === 0
            ? `<div class="empty"><i class="fas fa-inbox"></i><p>No students match your filters</p></div>`
            : `<div class="tbl-wrap"><table class="rpt">
                <thead><tr>
                  <th>#</th><th>Student</th>
                  <th class="right">Purchases</th>
                  <th class="right">Spend</th>
                  <th class="center">Status</th>
                </tr></thead>
                <tbody>${rows.map((r,i)=>`
                  <tr>
                    <td class="rank">${i+1}</td>
                    <td><strong>${esc(r.name)}</strong><br><span class="muted">${esc(r.email)}</span></td>
                    <td class="right">${r.purchases}</td>
                    <td class="right money">${money(r.spend)}</td>
                    <td class="center">${pill(r.banned?'banned':'active')}</td>
                  </tr>`).join('')}</tbody>
              </table></div>`}
        </div></div>
      </div>
    `;
  }
};

/* ---------------------------------------------------------------

MODULES.lecturers = {
  icon:'fa-users',
  render(){
    const f = STATE.filters.lecturers;
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const now = Date.now();

    let rows = lectArr.map(l => {
      let status = l.status || 'pending';
      if(l.banned) status = 'banned';
      else if(l.status === 'approved' && (!l.accessExpiresAt || l.accessExpiresAt > now)) status = 'active';
      else if(l.status === 'approved' && l.accessExpiresAt && l.accessExpiresAt <= now) status = 'expired';
      return {
        id:l.id, name:l.name||'Unnamed', email:l.email||'', phone:l.phone||'',
        nrc:l.nrcNumber||'', college:l.collegeName||'',
        city:l.city||'', town:l.town||'',
        status, banned: !!l.banned,
        accessExpiresAt: l.accessExpiresAt||null,
        approvedAt: l.approvedAt||0, appliedAt: l.appliedAt||0,
        paidAmount: num(l.paidAmount),
        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length,
        subfolders: Object.values(S.subfolders).filter(s=>s.lecturerId===l.id).length,
        videos: Object.values(S.videos).filter(v=>v.lecturerId===l.id).length,
        docs: Object.values(S.docs).filter(d=>d.lecturerId===l.id).length,
        assessments: Object.values(S.assessments).filter(a=>a.lecturerId===l.id).length
      };
    });

    if(f.status !== 'all') rows = rows.filter(r => r.status === f.status);
    if(f.search){
      const q = f.search.toLowerCase();
      rows = rows.filter(r =>
        r.name.toLowerCase().includes(q) ||
        r.email.toLowerCase().includes(q) ||
        r.college.toLowerCase().includes(q) ||
        r.city.toLowerCase().includes(q));
    }

    const sorters = {
      'date-desc': (a,b)=>(b.approvedAt||b.appliedAt)-(a.approvedAt||a.appliedAt),
      'date-asc':  (a,b)=>(a.approvedAt||a.appliedAt)-(b.approvedAt||b.appliedAt),
      'name-asc':  (a,b)=>a.name.localeCompare(b.name),
      'name-desc': (a,b)=>b.name.localeCompare(a.name),
      'courses-desc': (a,b)=>b.courses - a.courses,
      'paid-desc': (a,b)=>b.paidAmount - a.paidAmount
    };
    rows.sort(sorters[f.sortBy] || sorters['date-desc']);

    const statusCounts = {
      active: rows.filter(r=>r.status==='active').length,
      pending: rows.filter(r=>r.status==='pending').length,
      rejected: rows.filter(r=>r.status==='rejected').length,
      expired: rows.filter(r=>r.status==='expired').length,
      banned: rows.filter(r=>r.status==='banned').length
    };
    const totalPaid = rows.reduce((s,r)=>s+r.paidAmount,0);

    const takeaway = rows.length > 0
      ? `<strong>${rows.length}</strong> lecturers · <strong>${statusCounts.active}</strong> active · <strong>${statusCounts.pending}</strong> pending approval · total subscriptions <strong>${money(totalPaid)}</strong>.`
      : `No lecturers match your filters.`;

    return `
      ${hero('Lecturers','Applications, approvals, access status and payment history.')}

      <div class="summary-line">${takeaway}</div>

      <div class="kpi-strip">
        ${kpi('fa-users', rows.length, 'Total', '#8b5cf6')}
        ${kpi('fa-bolt', statusCounts.active, 'Active', '#10b981')}
        ${kpi('fa-hourglass-half', statusCounts.pending, 'Pending', '#f59e0b')}
        ${kpi('fa-clock', statusCounts.expired, 'Expired', '#ef4444')}
        ${kpi('fa-ban', statusCounts.banned, 'Banned', '#ef4444')}
        ${kpi('fa-coins', moneyShort(totalPaid), 'Subscriptions', '#d4952a')}
      </div>

      <div class="section open" data-key="lc-list">
        <div class="section-head" onclick="window.__toggleOpen('lc-list')">
          <h3><i class="fas fa-list"></i> All Lecturers <span class="count">${rows.length}</span></h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          <div class="filters">
            <select id="lcStatus">
              <option value="all" ${f.status==='all'?'selected':''}>All lecturers</option>
              <option value="active" ${f.status==='active'?'selected':''}>Active</option>
              <option value="pending" ${f.status==='pending'?'selected':''}>Pending</option>
              <option value="expired" ${f.status==='expired'?'selected':''}>Expired</option>
              <option value="rejected" ${f.status==='rejected'?'selected':''}>Rejected</option>
              <option value="banned" ${f.status==='banned'?'selected':''}>Banned</option>
            </select>
            <select id="lcSort">
              <option value="date-desc" ${f.sortBy==='date-desc'?'selected':''}>Newest first</option>
              <option value="date-asc" ${f.sortBy==='date-asc'?'selected':''}>Oldest first</option>
              <option value="name-asc" ${f.sortBy==='name-asc'?'selected':''}>Name A–Z</option>
              <option value="courses-desc" ${f.sortBy==='courses-desc'?'selected':''}>Most courses</option>
              <option value="paid-desc" ${f.sortBy==='paid-desc'?'selected':''}>Paid most</option>
            </select>
            <input type="text" id="lcSearch" placeholder="Search…" value="${esc(f.search)}" />
          </div>
          ${rows.length === 0
            ? `<div class="empty"><i class="fas fa-inbox"></i><p>No lecturers match your filters</p></div>`
            : `<div class="tbl-wrap"><table class="rpt">
                <thead><tr>
                  <th>#</th><th>Lecturer</th><th>College</th>
                  <th class="center">Status</th>
                  <th class="right">Content</th>
                  <th class="right">Paid</th>
                </tr></thead>
                <tbody>${rows.map((r,i)=>`
                  <tr>
                    <td class="rank">${i+1}</td>
                    <td><strong>${esc(r.name)}</strong><br><span class="muted">${esc(r.email)}</span></td>
                    <td>${esc(r.college||'—')}<br><span class="muted">${esc([r.city,r.town].filter(Boolean).join(', '))||'—'}</span></td>
                    <td class="center">${pill(r.status)}</td>
                    <td class="right">${r.courses + r.videos + r.docs + r.assessments}</td>
                    <td class="right money">${money(r.paidAmount)}</td>
                  </tr>`).join('')}</tbody>
              </table></div>`}
        </div></div>
      </div>

      ${section('lc-pending','fa-hourglass-half','Pending Applications',
        rows.filter(r => r.status === 'pending').length,
        rows.filter(r => r.status === 'pending').length === 0
          ? `<div class="empty"><i class="fas fa-check-circle"></i><p>No pending applications</p></div>`
          : `<div class="tbl-wrap"><table class="rpt">
              <thead><tr>
                <th>#</th><th>Applicant</th><th>NRC</th>
                <th>College</th><th>Applied</th>
              </tr></thead>
              <tbody>${rows.filter(r => r.status === 'pending').map((r,i)=>`
                <tr>
                  <td class="rank">${i+1}</td>
                  <td><strong>${esc(r.name)}</strong><br><span class="muted">${esc(r.email)} · ${esc(r.phone)}</span></td>
                  <td class="muted">${esc(r.nrc||'—')}</td>
                  <td>${esc(r.college||'—')}</td>
                  <td class="muted">${fmtDate(r.appliedAt)}</td>
                </tr>`).join('')}</tbody>
            </table></div>`,
        false)}
    `;
  }
};

/* =================================================================
   RENDER
================================================================= */
function render(){
  computeRange();
  const names = {
    overview:'Overview', contentSales:'Courses & Subfolders',
    lectureDash:'Lecture Dashboard', express:'Express Shopping',
    assessments:'Assessments', students:'Students', lecturers:'Lecturers'
  };
  document.getElementById('headerTitle').innerHTML =
    `${names[STATE.module]} <small>Reports Studio</small>`;
  document.getElementById('reportRoot').innerHTML = MODULES[STATE.module].render();
  attachEvents();
}

/* =================================================================
   EVENTS
================================================================= */
function attachEvents(){
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = btn.dataset.range;
      if(r === 'custom'){
        STATE.range = 'custom';
        document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('customBox')?.classList.add('show');
        return;
      }
      STATE.range = r;
      showLoading('Loading data…', `Range: ${r}`);
      setTimeout(() => { computeRange(); render(); hideLoading(); }, 250);
    });
  });

  document.getElementById('applyCustomBtn')?.addEventListener('click', () => {
    const f = document.getElementById('fromDate').value;
    const t = document.getElementById('toDate').value;
    if(!f || !t){ toast('Pick both dates','error'); return; }
    const sTs = new Date(f + 'T00:00:00').getTime();
    const eTs = new Date(t + 'T23:59:59').getTime();
    if(eTs < sTs){ toast('End must be after start','error'); return; }
    showLoading('Loading data…', `${f} → ${t}`);
    setTimeout(() => {
      STATE.startTs = sTs; STATE.endTs = eTs;
      render(); hideLoading();
    }, 350);
  });

  document.querySelectorAll('[data-dl]').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.dl;
      if(k === 'pdf'){
        showLoading('Generating PDF…','Preparing document');
        setTimeout(() => downloadPDF().finally(hideLoading), 150);
      } else if(k === 'excel'){
        showLoading('Generating Excel…','Building workbook');
        setTimeout(() => { try{ downloadExcel(); } finally { hideLoading(); } }, 150);
      } else if(k === 'expandAll'){
        document.querySelectorAll('.section').forEach(s => STATE.open[s.dataset.key] = true);
        render(); toast('All expanded','info');
      } else if(k === 'collapseAll'){
        document.querySelectorAll('.section').forEach(s => STATE.open[s.dataset.key] = false);
        render(); toast('All collapsed','info');
      } else if(k === 'refresh'){
        showLoading('Refreshing…','Reloading');
        setTimeout(() => { computeRange(); render(); hideLoading(); }, 200);
      }
    });
  });

  const bind = (id, key) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(el.tagName === 'INPUT'){
      let t;
      el.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          const pos = el.selectionStart;
          STATE.filters[STATE.module][key] = el.value;
          render();
          const n = document.getElementById(id);
          if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
        }, 300);
      });
    } else {
      el.addEventListener('change', () => {
        STATE.filters[STATE.module][key] = el.value;
        render();
      });
    }
  };

  bind('csType','typeFilter'); bind('csSort','sortBy'); bind('csSearch','search');
  bind('ldStatus','status');   bind('ldSort','sortBy'); bind('ldSearch','search');
  bind('exStatus','status');   bind('exSort','sortBy'); bind('exSearch','search');
  bind('asStatus','status');   bind('asSort','sortBy'); bind('asSearch','search');
  bind('stStatus','status');   bind('stSort','sortBy'); bind('stSearch','search');
  bind('lcStatus','status');   bind('lcSort','sortBy'); bind('lcSearch','search');
}

/* =================================================================
   SIDEBAR NAV
================================================================= */
document.getElementById('sbBody').addEventListener('click', e => {
  const n = e.target.closest('.nav[data-module]');
  if(!n) return;
  document.querySelectorAll('.nav[data-module]').forEach(x=>x.classList.remove('active'));
  n.classList.add('active');
  showLoading('Loading module…','Please wait');
  setTimeout(() => {
    STATE.module = n.dataset.module;
    STATE.open = {};
    closeSidebar();
    document.getElementById('content').scrollTop = 0;
    render();
    hideLoading();
  }, 200);
});
function openSidebar(){
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sidebar').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sidebar').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('menuBtn').onclick = openSidebar;
document.getElementById('sbClose').onclick = closeSidebar;
document.getElementById('overlay').onclick = closeSidebar;

/* =================================================================
   PDF EXPORT
================================================================= */
async function downloadPDF(){
  const root = document.getElementById('reportRoot');
  if(!root) return;
  const moduleNames = {
    overview:'Platform Overview', contentSales:'Courses & Subfolders Report',
    lectureDash:'Lecture Dashboard Report', express:'Express Shopping Report',
    assessments:'Assessments Report', students:'Students Report', lecturers:'Lecturers Report'
  };
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:24px 20px;background:#fff;color:#12141d;font-family:Inter,Arial,sans-serif;';
  wrap.innerHTML = `
    <div style="text-align:center;padding:16px 12px 18px;border-bottom:3px solid #F5B042;margin-bottom:18px;">
      <h1 style="font-size:24px;font-weight:900;margin:0;background:linear-gradient(135deg,#d4952a,#f5b042,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">UTOM · ${moduleNames[STATE.module]}</h1>
      <div style="font-size:12px;color:#5f6377;margin-top:6px;">Range: <strong>${esc(rangeLabel())}</strong></div>
      <div style="font-size:11px;color:#8b8fa3;margin-top:2px;">Generated: ${new Date().toLocaleString()}</div>
      <div style="font-size:11px;color:#8b8fa3;margin-top:2px;">By: ${esc(currentAdmin?.email||'admin')}</div>
    </div>
  `;
  const cloned = root.cloneNode(true);
  cloned.querySelectorAll('.section').forEach(c => c.classList.add('open'));
  cloned.querySelectorAll('.section-body').forEach(b => { b.style.maxHeight = 'none'; });
  cloned.querySelectorAll('.hero, .section, .kpi, .stat-tile').forEach(el => {
    el.style.background = '#fff';
    el.style.boxShadow = 'none';
    el.style.border = '1px solid #e5e8ed';
  });
  cloned.querySelectorAll('.range-btns, .custom-box, .action-btns, .filters, .section-head .chev').forEach(el => el.remove());
  wrap.appendChild(cloned);
  document.body.appendChild(wrap);
  try{
    await html2pdf().set({
      margin:[6,6,10,6],
      filename:`UTOM-${STATE.module}-${new Date().toISOString().slice(0,10)}.pdf`,
      image:{ type:'jpeg', quality:0.95 },
      html2canvas:{ scale:2, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak:{ mode:['css','legacy'] }
    }).from(wrap).save();
    toast('PDF downloaded','success');
  }catch(e){
    console.error(e);
    toast('PDF error: ' + e.message,'error');
  }finally{
    document.body.removeChild(wrap);
  }
}

/* =================================================================
   EXCEL EXPORT
================================================================= */
function downloadExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel library missing','error'); return; }
  const wb = XLSX.utils.book_new();
  const addSheet = (name, rows) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const w = [];
    rows.forEach(r => (r||[]).forEach((c,i)=>{
      const len = String(c==null?'':c).length;
      w[i] = Math.max(w[i]||8, Math.min(len+2, 45));
    }));
    ws['!cols'] = w.map(x=>({wch:x}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const infoRows = [
    ['UTOM REPORT'],
    ['Module', STATE.module],
    ['Range', rangeLabel()],
    ['Generated', new Date().toLocaleString()],
    ['By', currentAdmin?.email||'admin'],
    []
  ];

  if(STATE.module === 'overview'){
    const allTx = dedupeTx(buildAllTx()).filter(t => inRange(t.timestamp));
    const approved = allTx.filter(t => t.status==='approved');
    const pending  = allTx.filter(t => t.status==='pending');
    const rejected = allTx.filter(t => t.status==='rejected');
    const sum = a => a.reduce((s,t)=>s+num(t.amount),0);
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    addSheet('Overview', [
      ...infoRows,
      ['LIBRARY TOTALS',''],
      ['Courses', Object.keys(S.courses).length],
      ['Subfolders', Object.keys(S.subfolders).length],
      ['Videos', Object.keys(S.videos).length],
      ['Documents', Object.keys(S.docs).length],
      ['Students', Object.keys(S.users).length],
      ['Lecturers', lectArr.length],
      ['Assessments', Object.keys(S.assessments).length + Object.keys(S.lecturerAssessments).length],
      ['Registers', Object.keys(S.registers).length + Object.keys(S.lecturerRegisters).length],
      [],
      ['TRANSACTIONS','Count','ZMW'],
      ['Approved', approved.length, sum(approved).toFixed(2)],
      ['Pending', pending.length, sum(pending).toFixed(2)],
      ['Rejected', rejected.length, sum(rejected).toFixed(2)],
      ['Total', allTx.length, sum(allTx).toFixed(2)]
    ]);
    addSheet('All Transactions', [
      ['ID','Source','User','Email','Item','Type','Amount','Status','Date'],
      ...allTx.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(t=>[
        t.id, t._src||'', t.userName||'', t.userEmail||'',
        t.itemTitle||'', t.itemType||'', num(t.amount).toFixed(2),
        t.status||'', fmtDate(t.timestamp)
      ])
    ]);
  }
  else if(STATE.module === 'contentSales'){
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved')
      .filter(t => t.itemType === 'course' || t.itemType === 'subfolder');
    const rows = [];
    Object.values(S.courses).forEach(c => {
      rows.push({
        id:c.id, name:c.name||'', type:'course', parent:'',
        price:num(c.price), priceType: num(c.price)>0?'paid':'free',
        videos: Object.values(S.videos).filter(v=>v.courseId===c.id).length,
        docs: Object.values(S.docs).filter(d=>d.courseId===c.id).length,
        sales:0, revenue:0, students:[]
      });
    });
    Object.values(S.subfolders).forEach(sf => {
      const parent = S.courses[sf.courseId];
      rows.push({
        id:sf.id, name:sf.name||'', type:'subfolder', parent:parent?.name||'',
        price:num(sf.price), priceType: num(sf.price)>0?'paid':'free',
        videos: Object.values(S.videos).filter(v=>v.subfolderId===sf.id).length,
        docs: Object.values(S.docs).filter(d=>d.subfolderId===sf.id).length,
        sales:0, revenue:0, students:[]
      });
    });
    const byId = {}; rows.forEach(r => byId[r.id]=r);
    txApproved.forEach(t => {
      const r = byId[t.itemId]; if(!r) return;
      r.sales++; r.revenue += num(t.amount);
      r.students.push({
        name:t.userName||'', email:t.userEmail||'',
        amount:num(t.amount), date:t.timestamp
      });
    });
    addSheet('Overview', [
      ...infoRows,
      ['Courses', rows.filter(r=>r.type==='course').length],
      ['Subfolders', rows.filter(r=>r.type==='subfolder').length],
      ['Total Sales', rows.reduce((s,r)=>s+r.sales,0)],
      ['Total Revenue', rows.reduce((s,r)=>s+r.revenue,0).toFixed(2)]
    ]);
    addSheet('Courses & Subfolders', [
      ['Type','Name','Parent','Price','PriceType','Sales','Revenue','Videos','Docs'],
      ...rows.map(r=>[
        r.type, r.name, r.parent, r.price.toFixed(2), r.priceType,
        r.sales, r.revenue.toFixed(2), r.videos, r.docs
      ])
    ]);
    const stRows = [['Item','Type','Parent','Student','Email','Amount','Date']];
    rows.forEach(r => r.students.forEach(s =>
      stRows.push([r.name, r.type, r.parent, s.name, s.email, s.amount.toFixed(2), fmtDate(s.date)])));
    addSheet('Purchases', stRows);
  }
  else if(STATE.module === 'lectureDash'){
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved')
      .filter(t => t.itemType === 'course' || t.itemType === 'subfolder');
    const ownerIdx = {};
    Object.entries(S.courses).forEach(([id,c])=>{ if(c.lecturerId) ownerIdx[id]=c.lecturerId; });
    Object.entries(S.subfolders).forEach(([id,s])=>{ if(s.lecturerId) ownerIdx[id]=s.lecturerId; });
    const byL = {};
    lectArr.forEach(l => {
      byL[l.id] = {
        id:l.id, name:l.name||'', email:l.email||'',
        status:l.status||'pending', banned:!!l.banned,
        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length,
        videos: Object.values(S.videos).filter(v=>v.lecturerId===l.id).length,
        docs: Object.values(S.docs).filter(d=>d.lecturerId===l.id).length,
        assessments: Object.values(S.assessments).filter(a=>a.lecturerId===l.id).length,
        sales:0, revenue:0, students:new Set(), items:[]
      };
    });
    txApproved.forEach(t => {
      const owner = ownerIdx[t.itemId]; if(!owner || !byL[owner]) return;
      const L = byL[owner];
      L.sales++; L.revenue += num(t.amount);
      if(t.userId) L.students.add(t.userId);
      L.items.push({
        title:t.itemTitle||'', type:t.itemType||'',
        student:t.userName||'', email:t.userEmail||'',
        amount:num(t.amount), date:t.timestamp
      });
    });
    const rows = Object.values(byL).map(r=>({...r, uniqueStudents:r.students.size}))
      .sort((a,b)=>b.revenue-a.revenue);
    addSheet('Overview', [
      ...infoRows,
      ['Lecturers', rows.length],
      ['Total Sales', rows.reduce((s,r)=>s+r.sales,0)],
      ['Total Revenue', rows.reduce((s,r)=>s+r.revenue,0).toFixed(2)]
    ]);
    addSheet('Performance', [
      ['Name','Email','Status','Banned','Courses','Videos','Docs','Assessments','Sales','Students','Revenue'],
      ...rows.map(r=>[
        r.name, r.email, r.status, r.banned?'Yes':'No',
        r.courses, r.videos, r.docs, r.assessments,
        r.sales, r.uniqueStudents, r.revenue.toFixed(2)
      ])
    ]);
    const salesRows = [['Lecturer','Item','Type','Student','Email','Amount','Date']];
    rows.forEach(r => r.items.forEach(it =>
      salesRows.push([r.name, it.title, it.type, it.student, it.email, it.amount.toFixed(2), fmtDate(it.date)])));
    addSheet('Sales Detail', salesRows);
  }
  else if(STATE.module === 'express'){
    const orders = Object.values(S.expressOrders).filter(o => inRange(o.createdAt));
    const payments = Object.values(S.expressPayments).filter(p => inRange(p.createdAt));
    const products = Object.values(S.expressProducts);
    addSheet('Overview', [
      ...infoRows,
      ['Orders', orders.length],
      ['Revenue', orders.filter(o=>o.status==='completed'||o.status==='collected').reduce((s,o)=>s+num(o.total),0).toFixed(2)],
      ['Pending Payments', payments.filter(p=>p.status==='pending').length],
      ['Approved Payments', payments.filter(p=>p.status==='approved').length],
      ['Rejected Payments', payments.filter(p=>p.status==='rejected').length],
      ['Total Products', products.length],
      ['Low Stock', products.filter(p=>num(p.quantity)>0 && num(p.quantity)<=(p.lowStockThreshold||5)).length],
      ['Out of Stock', products.filter(p=>num(p.quantity)<=0).length]
    ]);
    addSheet('Orders', [
      ['Order ID','Customer','Email','Phone','Items','Total','Status','Date'],
      ...orders.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(o=>[
        o.id, o.customerName||'', o.customerEmail||'', o.customerPhone||'',
        (o.items||[]).map(i=>`${i.name} x${i.qty}`).join(' | '),
        num(o.total).toFixed(2), o.status||'', fmtDate(o.createdAt)
      ])
    ]);
    addSheet('Payments', [
      ['Payment ID','Customer','Email','Product','Amount','Status','Date'],
      ...payments.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p=>[
        p.id, p.customerName||'', p.customerEmail||'',
        p.productName||'', num(p.amount).toFixed(2),
        p.status||'', fmtDate(p.createdAt)
      ])
    ]);
    addSheet('Stock', [
      ['Product','Price','Stock','Threshold','Status'],
      ...products.map(p=>{
        const qty = num(p.quantity); const low = num(p.lowStockThreshold)||5;
        let st = 'In Stock';
        if(qty <= 0) st = 'Out of Stock';
        else if(qty <= low) st = 'Low Stock';
        return [p.name||'', num(p.price).toFixed(2), qty, low, st];
      })
    ]);
  }
  else if(STATE.module === 'assessments'){
    const assArr = [...Object.values(S.assessments), ...Object.values(S.lecturerAssessments)];
    const respArr = [...Object.values(S.assessmentResponses), ...Object.values(S.lecturerResponses)]
      .filter(r => inRange(r.submittedAt || r.startedAt || r.endedAt));
    const rows = assArr.map(a => {
      const resps = respArr.filter(r => r.assessmentId === a.id);
      const completed = resps.filter(r => r.status==='completed'||r.status==='ended');
      const passed = completed.filter(r => {
        const total = num(a.totalMarks);
        const p = total > 0 ? (num(r.score)/total)*100 : 0;
        return p >= num(a.passingScore||50);
      });
      return {
        name:a.name||'', type:a.type||'test', status:a.status||'draft',
        duration:a.duration||'', totalMarks:num(a.totalMarks),
        attempts: resps.length, completed: completed.length,
        passed: passed.length, failed: completed.length - passed.length
      };
    }).sort((a,b)=>b.attempts-a.attempts);
    addSheet('Overview', [
      ...infoRows,
      ['Assessments', rows.length],
      ['Total Attempts', rows.reduce((s,r)=>s+r.attempts,0)],
      ['Total Completed', rows.reduce((s,r)=>s+r.completed,0)],
      ['Total Passed', rows.reduce((s,r)=>s+r.passed,0)],
      ['Total Failed', rows.reduce((s,r)=>s+r.failed,0)]
    ]);
    addSheet('Assessments', [
      ['Name','Type','Status','Duration','Marks','Attempts','Completed','Passed','Failed'],
      ...rows.map(r=>[
        r.name, r.type, r.status, r.duration, r.totalMarks,
        r.attempts, r.completed, r.passed, r.failed
      ])
    ]);
    const attemptsRows = [['Assessment','Type','User ID','Score','Total','%','Result','Status','Date']];
    respArr.forEach(r => {
      const a = assArr.find(x=>x.id===r.assessmentId); if(!a) return;
      const total = num(a.totalMarks);
      const percent = total > 0 ? Math.round((num(r.score)/total)*100) : 0;
      const passed = percent >= num(a.passingScore||50);
      attemptsRows.push([
        a.name||'', a.type||'', r.userId||'',
        num(r.score), total, percent+'%',
        passed?'PASS':'FAIL', r.status||'',
        fmtDate(r.submittedAt||r.startedAt||r.endedAt)
      ]);
    });
    addSheet('All Attempts', attemptsRows);
  }
  else if(STATE.module === 'students'){
    const usersArr = Object.entries(S.users).map(([id,d])=>({id,...d}));
    const banned = Object.entries(S.bannedUsers).filter(([,v])=>v).map(([id])=>id);
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved');
    const byStudent = {};
    usersArr.forEach(u => {
      byStudent[u.id] = {
        name: `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
        email: u.email||'', phone: u.phone||'',
        banned: banned.includes(u.id),
        purchases:0, spend:0, courses:0, subfolders:0, shop:0, items:[]
      };
    });
    txApproved.forEach(t => {
      const s = byStudent[t.userId]; if(!s) return;
      s.purchases++; s.spend += num(t.amount);
      const type = (t.itemType||'course').toLowerCase();
      if(type === 'course') s.courses++;
      else if(type === 'subfolder') s.subfolders++;
      else if(type === 'shop') s.shop++;
      s.items.push({
        title:t.itemTitle||'', type, amount:num(t.amount), date:t.timestamp
      });
    });
    const rows = Object.values(byStudent).sort((a,b)=>b.spend-a.spend);
    addSheet('Overview', [
      ...infoRows,
      ['Students', rows.length],
      ['Total Purchases', rows.reduce((s,r)=>s+r.purchases,0)],
      ['Total Spend', rows.reduce((s,r)=>s+r.spend,0).toFixed(2)]
    ]);
    addSheet('Students', [
      ['Name','Email','Phone','Purchases','Courses','Subfolders','Shop','Spend','Banned'],
      ...rows.map(r=>[
        r.name, r.email, r.phone,
        r.purchases, r.courses, r.subfolders, r.shop,
        r.spend.toFixed(2), r.banned?'Yes':'No'
      ])
    ]);
    const purRows = [['Student','Email','Item','Type','Amount','Date']];
    rows.forEach(s => s.items.forEach(it =>
      purRows.push([s.name, s.email, it.title, it.type, it.amount.toFixed(2), fmtDate(it.date)])));
    addSheet('Purchases', purRows);
  }
  else if(STATE.module === 'lecturers'){
    const now = Date.now();
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const rows = lectArr.map(l => {
      let status = l.status||'pending';
      if(l.banned) status = 'banned';
      else if(l.status === 'approved' && (!l.accessExpiresAt || l.accessExpiresAt > now)) status = 'active';
      else if(l.status === 'approved' && l.accessExpiresAt && l.accessExpiresAt <= now) status = 'expired';
      return {
        name:l.name||'', email:l.email||'', phone:l.phone||'',
        nrc:l.nrcNumber||'', college:l.collegeName||'',
        city:l.city||'', town:l.town||'', address:l.address||'',
        status, banned: !!l.banned,
        accessExpiresAt: l.accessExpiresAt||null,
        paidAmount: num(l.paidAmount),
        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length,
        videos: Object.values(S.videos).filter(v=>v.lecturerId===l.id).length,
        docs: Object.values(S.docs).filter(d=>d.lecturerId===l.id).length,
        assessments: Object.values(S.assessments).filter(a=>a.lecturerId===l.id).length
      };
    });
    addSheet('Overview', [
      ...infoRows,
      ['Lecturers', rows.length],
      ['Active', rows.filter(r=>r.status==='active').length],
      ['Pending', rows.filter(r=>r.status==='pending').length],
      ['Expired', rows.filter(r=>r.status==='expired').length],
      ['Banned', rows.filter(r=>r.status==='banned').length],
      ['Total Subscriptions', rows.reduce((s,r)=>s+r.paidAmount,0).toFixed(2)]
    ]);
    addSheet('Lecturers', [
      ['Name','Email','Phone','NRC','College','City','Town','Address','Status','Banned','Expires','Paid','Courses','Videos','Docs','Assessments'],
      ...rows.map(r=>[
        r.name, r.email, r.phone, r.nrc,
        r.college, r.city, r.town, r.address, r.status,
        r.banned?'Yes':'No',
        r.accessExpiresAt ? new Date(r.accessExpiresAt).toLocaleString() : 'Lifetime',
        r.paidAmount.toFixed(2),
        r.courses, r.videos, r.docs, r.assessments
      ])
    ]);
  }

  XLSX.writeFile(wb, `UTOM-${STATE.module}-${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel downloaded','success');
}

console.log('✅ UTOM Reports Studio loaded — balanced edition.');
</script>
