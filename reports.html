<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<title>UTOM · Reports Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#F5B042;--gold-d:#c47f1a;--orange:#ff6b00;
  --bg:#f4f6fa;--text:#12141d;--sub:#5f6377;--muted:#8b8fa3;
  --line:rgba(224,228,236,.9);--card:#ffffff;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;
  --purple:#8b5cf6;--pink:#ec4899;--cyan:#06b6d4;--slate:#64748b;
  --sh-xs:0 1px 3px rgba(16,20,40,.04);
  --sh-sm:0 2px 8px rgba(16,20,40,.05);
  --sh-md:0 8px 24px rgba(16,20,40,.08);
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --t:.2s cubic-bezier(.25,.46,.45,.94);
  --app-h:100dvh;
}
@supports not (height:100dvh){:root{--app-h:100vh}}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,sans-serif}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(245,176,66,.4);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:14px;z-index:9999;transition:opacity .5s}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:4px solid #e5e7eb;border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-weight:700;color:var(--sub);font-size:13px}

.loading-overlay{position:fixed;inset:0;background:rgba(244,246,250,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:5000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.loading-overlay .spinner{width:48px;height:48px}
.loading-overlay p{font-weight:700;color:var(--sub);font-size:13px}
.loading-overlay small{font-size:11px;color:var(--muted)}

.app{display:flex;flex-direction:column;height:var(--app-h);overflow:hidden}

.header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 18px;height:60px;flex-shrink:0;background:#fff;
  border-bottom:1px solid var(--line);z-index:40}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.icon-btn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:1px solid var(--line);
  background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;
  cursor:pointer;transition:var(--t);color:var(--text);text-decoration:none}
.icon-btn:hover{background:#f8fafc;border-color:var(--gold);color:var(--gold-d)}
.header-title{font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.header-title small{font-size:11px;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0}

.overlay{position:fixed;inset:0;background:rgba(15,20,40,.4);backdrop-filter:blur(4px);
  z-index:800;display:none}
.overlay.open{display:block}
.sidebar{position:fixed;top:0;left:-340px;width:300px;max-width:86vw;height:var(--app-h);
  background:#fff;backdrop-filter:blur(20px);z-index:900;
  box-shadow:8px 0 40px rgba(0,0,0,.10);transition:left .3s cubic-bezier(.25,.46,.45,.94);
  display:flex;flex-direction:column;overflow:hidden}
.sidebar.open{left:0}
.sb-head{padding:22px 20px 16px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;flex-shrink:0}
.sb-head .brand{font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#d4952a,#f5b042,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-.5px}
.sb-head .tag{font-size:9px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.sb-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
  background:#f5f6f8;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;color:#555;border:none;transition:var(--t)}
.sb-close:hover{background:#ef4444;color:#fff;transform:rotate(90deg)}
.sb-body{flex:1;overflow-y:auto;padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;
  cursor:pointer;transition:var(--t);color:var(--text);font-weight:600;font-size:13px;
  background:transparent;border:none;width:100%;text-align:left}
.nav:hover{background:#f8fafc}
.nav i{font-size:16px;width:20px;text-align:center;color:var(--slate);transition:color .2s}
.nav.active{background:rgba(245,176,66,.13);color:var(--gold-d)}
.nav.active i{color:var(--gold-d)}
.divider{height:1px;background:var(--line);margin:6px 8px}

.main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 90px}

/* HERO */
.hero{background:#fff;border-radius:var(--r-lg);padding:20px 22px 18px;
  box-shadow:var(--sh-sm);border:1px solid var(--line);margin-bottom:14px;
  position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,#d4952a,#f5b042,#ff6b00)}
.hero h1{font-size:19px;font-weight:800;letter-spacing:-.4px;
  display:flex;align-items:center;gap:10px;margin-bottom:4px}
.hero h1 i{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#fff8ed,#fef3e2);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-d);font-size:16px}
.hero p{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:14px}

.range-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.range-btn{padding:8px 16px;border-radius:24px;border:1.5px solid var(--line);
  background:#fff;font-weight:700;font-size:11.5px;color:var(--sub);
  cursor:pointer;transition:var(--t);display:inline-flex;align-items:center;gap:6px}
.range-btn:hover{border-color:var(--gold);color:var(--gold-d)}
.range-btn.active{background:linear-gradient(135deg,#f5b042,#ff6b00);color:#fff;
  border-color:transparent;box-shadow:0 3px 14px rgba(245,176,66,.32)}

.custom-box{display:none;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.custom-box.show{display:flex}
.custom-box input{flex:1;min-width:120px;padding:9px 14px;border-radius:24px;
  border:1.5px solid var(--line);background:#fbfcfd;font-size:12px;color:var(--text);
  outline:none;transition:var(--t)}
.custom-box input:focus{border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 4px rgba(245,176,66,.10)}

.action-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;
  cursor:pointer;font-weight:700;border-radius:24px;transition:var(--t);
  white-space:nowrap;font-size:11.5px;padding:9px 16px}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-primary{background:linear-gradient(135deg,#f5b042,#ff6b00);color:#fff;
  box-shadow:0 3px 14px rgba(245,176,66,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,176,66,.32)}
.btn-green{background:#10b981;color:#fff;box-shadow:0 3px 14px rgba(16,185,129,.25)}
.btn-green:hover{background:#059669}
.btn-red{background:#ef4444;color:#fff;box-shadow:0 3px 14px rgba(239,68,68,.25)}
.btn-red:hover{background:#dc2626}
.btn-blue{background:#3b82f6;color:#fff;box-shadow:0 3px 14px rgba(59,130,246,.25)}
.btn-blue:hover{background:#2563eb}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-d)}

.range-display{font-size:11px;color:var(--muted);margin-top:10px;
  background:rgba(245,176,66,.08);padding:7px 14px;border-radius:20px;
  display:inline-block;font-weight:600}
.range-display strong{color:var(--gold-d)}

.section{background:#fff;border-radius:var(--r-md);border:1px solid var(--line);
  box-shadow:var(--sh-xs);margin-bottom:12px;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px;cursor:pointer;user-select:none;transition:background .15s}
.section-head:hover{background:#fbfcfd}
.section-head h3{font-size:11.5px;font-weight:800;
  display:flex;align-items:center;gap:9px;flex:1;min-width:0;text-transform:uppercase;
  color:var(--sub);letter-spacing:.5px}
.section-head h3 i{color:var(--gold-d);font-size:13px}
.section-head h3 .count{font-size:10.5px;font-weight:700;color:var(--gold-d);
  background:rgba(245,176,66,.14);padding:2px 9px;border-radius:12px;margin-left:4px;
  text-transform:none;letter-spacing:0}
.section-head .chev{width:26px;height:26px;border-radius:50%;
  background:#f5f6f8;display:flex;align-items:center;justify-content:center;
  color:var(--slate);font-size:11px;transition:transform .25s;flex-shrink:0}
.section.open .section-head .chev{transform:rotate(180deg);background:rgba(245,176,66,.15);
  color:var(--gold-d)}
.section-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.25,.46,.45,.94)}
.section.open .section-body{max-height:50000px}
.section-body-inner{padding:0 18px 18px}

.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:8px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 14px 12px;position:relative;overflow:hidden;transition:var(--t)}
.kpi:hover{box-shadow:var(--sh-sm)}
.kpi .icon{font-size:15px;color:var(--muted);margin-bottom:6px}
.kpi .num{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.15;
  word-break:break-word;color:var(--text)}
.kpi .lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;margin-top:3px}
.kpi.gold{border-color:rgba(245,176,66,.3);background:linear-gradient(135deg,#fffdf8,#fff8ed)}
.kpi.gold .icon{color:var(--gold-d)}
.kpi.green{border-color:rgba(16,185,129,.3);background:linear-gradient(135deg,#f7fefb,#eefdf6)}
.kpi.green .icon{color:var(--green)}
.kpi.red{border-color:rgba(239,68,68,.3);background:linear-gradient(135deg,#fff8f8,#fef1f1)}
.kpi.red .icon{color:var(--red)}
.kpi.blue{border-color:rgba(59,130,246,.3);background:linear-gradient(135deg,#f6faff,#eff6ff)}
.kpi.blue .icon{color:var(--blue)}
.kpi.purple{border-color:rgba(139,92,246,.3);background:linear-gradient(135deg,#faf8ff,#f5f3ff)}
.kpi.purple .icon{color:var(--purple)}
.kpi.yellow{border-color:rgba(245,158,11,.3);background:linear-gradient(135deg,#fffcf2,#fef8ec)}
.kpi.yellow .icon{color:var(--yellow)}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;margin-bottom:14px}
.stat-tile{background:#f9fafc;border-radius:var(--r-sm);padding:12px 14px;
  border:1px solid var(--line)}
.stat-tile .lbl{font-size:10.5px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.stat-tile .val{font-size:16px;font-weight:800;color:var(--text)}
.stat-tile .bar{height:5px;background:rgba(224,228,236,.8);border-radius:20px;
  margin-top:8px;overflow:hidden}
.stat-tile .bar > div{height:100%;border-radius:20px;
  background:linear-gradient(90deg,#f5b042,#ff6b00);transition:width .6s}
.stat-tile .sub{font-size:10px;color:#8b8fa3;margin-top:6px}

.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--line);
  background:#fff;-webkit-overflow-scrolling:touch}
table.rpt{width:100%;border-collapse:collapse;font-size:12px;min-width:480px;background:#fff}
table.rpt th{background:#fafbfd;padding:10px 12px;text-align:left;
  font-weight:700;color:var(--slate);font-size:10px;text-transform:uppercase;
  letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rpt td{padding:10px 12px;border-bottom:1px solid #f3f5f9;color:var(--text);
  vertical-align:middle}
table.rpt tr:last-child td{border-bottom:none}
table.rpt tbody tr:hover td{background:#fcfdfe}
table.rpt tbody tr.clickable{cursor:pointer}
table.rpt tbody tr.clickable:hover td{background:#fffdf7}
table.rpt td.right,table.rpt th.right{text-align:right}
table.rpt td.center,table.rpt th.center{text-align:center}
table.rpt .money{font-weight:700;color:var(--text)}
table.rpt .muted{color:var(--muted);font-size:11px}
table.rpt .rank{font-weight:800;color:var(--gold-d);width:32px;font-size:11px}
table.rpt .pill{display:inline-block;padding:3px 10px;border-radius:12px;
  font-size:10px;font-weight:700;text-transform:capitalize;letter-spacing:.2px}
.pill-approved{background:#ecfdf5;color:#065f46}
.pill-pending{background:#fef9ec;color:#92400e}
.pill-rejected{background:#fef2f2;color:#991b1b}
.pill-cancelled{background:#f1f5f9;color:#475569}
.pill-completed{background:#ecfeff;color:#155e75}
.pill-active{background:#eff6ff;color:#1e40af}
.pill-banned{background:#7f1d1d;color:#fff}
.pill-unpaid{background:#fef3c7;color:#78350f}
.pill-expired{background:#fef2f2;color:#991b1b}
.pill-confirmed{background:#eff6ff;color:#1d4ed8}
.pill-ready{background:#ecfdf5;color:#047857}
.pill-collected{background:#eef2ff;color:#3730a3}
.pill-draft{background:#f1f5f9;color:#475569}
.pill-scheduled{background:#eef2ff;color:#4338ca}
.pill-published{background:#ecfdf5;color:#047857}
.pill-free{background:#eff6ff;color:#1d4ed8}
.pill-paid{background:#fef3c7;color:#92400e}
.pill-course{background:#eff6ff;color:#1d4ed8}
.pill-subfolder{background:#f5f3ff;color:#6d28d9}
.pill-shop{background:#fce7f3;color:#9d174d}
.pill-pass{background:#ecfdf5;color:#047857}
.pill-fail{background:#fef2f2;color:#991b1b}
.pill-exam{background:#fef2f2;color:#991b1b}
.pill-test{background:#fef9ec;color:#92400e}
.pill-quiz{background:#eff6ff;color:#1e40af}
.pill-assignment{background:#f5f3ff;color:#6d28d9}

.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:12px}
.empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.3}
.empty p{margin-top:2px;font-size:11px}

.bar-list{display:flex;flex-direction:column;gap:2px;padding:2px 0}
.bar-item{display:grid;grid-template-columns:24px 1fr auto;gap:10px;
  align-items:center;padding:7px 4px;border-bottom:1px solid #f3f5f9;font-size:12px;
  cursor:pointer;border-radius:6px;transition:background .15s}
.bar-item:hover{background:#fffdf7}
.bar-item:last-child{border-bottom:none}
.bar-item .n{font-weight:800;color:var(--gold-d);font-size:11px}
.bar-item .body{min-width:0}
.bar-item .body .title{font-weight:600;color:var(--text);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.bar-item .body .meta{font-size:10px;color:var(--muted);margin-bottom:4px}
.bar-item .body .bar-track{height:4px;background:#f1f5f9;border-radius:20px;overflow:hidden}
.bar-item .body .bar-track > span{display:block;height:100%;border-radius:20px;
  background:linear-gradient(90deg,#f5b042,#ff6b00);transition:width .5s}
.bar-item .val{font-weight:800;color:var(--text);font-size:11.5px;
  white-space:nowrap;text-align:right}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.two-col{grid-template-columns:1fr}}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;margin-bottom:12px}
.filters select,.filters input{width:100%;padding:9px 14px;border-radius:24px;
  border:1.5px solid var(--line);background:#fbfcfd;font-size:12px;
  color:var(--text);outline:none;transition:var(--t);-webkit-appearance:none;
  appearance:none;font-family:inherit}
.filters select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path fill='%238b8fa3' d='M5.5 7L0 0h11z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
.filters select:focus,.filters input:focus{border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 4px rgba(245,176,66,.10)}

.summary-line{font-size:11.5px;color:var(--sub);padding:9px 14px;
  background:#f9fafc;border-left:3px solid var(--gold);border-radius:6px;
  margin-bottom:12px;line-height:1.55}
.summary-line strong{color:var(--text)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,40,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:9998;display:none;align-items:flex-end;justify-content:center;
  padding:0;animation:fadeIn .2s ease}
.modal-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#fff;width:100%;max-width:720px;max-height:88vh;
  border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;
  animation:slideUp .3s cubic-bezier(.25,.46,.45,.94);box-shadow:0 -8px 40px rgba(0,0,0,.15)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (min-width:720px){
  .modal-overlay{align-items:center;padding:20px}
  .modal-box{border-radius:24px;max-height:86vh}
}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fffdf8,#fff8ed);flex-shrink:0}
.modal-head h2{font-size:15px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-head .sub{font-size:11px;color:var(--muted);font-weight:600}
.modal-close{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;
  color:var(--slate);transition:var(--t);flex-shrink:0}
.modal-close:hover{background:#ef4444;color:#fff;border-color:transparent}
.modal-body{padding:16px 20px 24px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:8px;margin-bottom:16px}
.modal-kpi{background:#f9fafc;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;text-align:center}
.modal-kpi .lbl{font-size:9.5px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.modal-kpi .val{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.modal-section-title{font-size:11.5px;font-weight:800;color:var(--slate);
  text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;
  display:flex;align-items:center;gap:8px;padding-bottom:6px;
  border-bottom:1px solid var(--line)}
.modal-section-title i{color:var(--gold-d);font-size:12px}

@media (max-width:560px){
  .header{padding:0 12px;height:56px}
  .header-title{font-size:14.5px}
  .content{padding:12px 12px 90px}
  .hero{padding:18px 16px 14px;border-radius:var(--r-md)}
  .hero h1{font-size:17px}
  .hero h1 i{width:32px;height:32px;font-size:14px}
  .kpi-strip{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi .num{font-size:17px}
  .kpi{padding:12px}
  .section-head{padding:12px 14px}

<script type="module">
/* =================================================================
   FIREBASE
================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHiQHbATgnQIIB9X-gOM5XdmRbOsUJoBQ",
  authDomain: "utom-c4003.firebaseapp.com",
  databaseURL: "https://utom-c4003-default-rtdb.firebaseio.com",
  projectId: "utom-c4003",
  storageBucket: "utom-c4003.firebasestorage.app",
  messagingSenderId: "878225874050",
  appId: "1:878225874050:web:643626906bfd233eeae89b"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

/* =================================================================
   STATE
================================================================= */
const S = {
  courses:{}, subfolders:{}, videos:{}, docs:{}, users:{}, promos:{},
  registers:{}, assessments:{}, assessmentResponses:{},
  lecturerRegisters:{}, lecturerAssessments:{}, lecturerResponses:{},
  transactions:{}, pendingPurchases:{}, approvedPurchases:{},
  lecturerPendingPurchases:{}, lecturerApprovedPurchases:{},
  bannedUsers:{}, expressProducts:{}, expressOrders:{}, expressPayments:{},
  expressCategories:{}, expressPickupLocations:{}, lecturerData:{},
  notifications:{}
};
const STATE = {
  module:'overview',
  range:'today',
  startTs:0, endTs:Date.now(),
  filters:{
    bestSellers:{ typeFilter:'all', search:'' },
    enrollments:{ status:'all', search:'' },
    contentSales:{ paymentStatus:'approved', typeFilter:'all', sortBy:'revenue-desc', search:'' },
    lectureDash:{ status:'all', sortBy:'earnings-desc', search:'' },
    express:{ status:'all', sortBy:'date-desc', search:'' },
    assessments:{ status:'all', sortBy:'attempts-desc', search:'' },
    students:{ status:'all', sortBy:'spend-desc', search:'' },
    lecturers:{ status:'all', sortBy:'date-desc', search:'' }
  },
  open:{}
};
let currentAdmin = null;

/* =================================================================
   HELPERS
================================================================= */
const _ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const _RE = /[&<>"']/g;
const esc = s => s == null ? '' : String(s).replace(_RE, c => _ESC[c]);
const num = v => Number(v) || 0;
const money = v => 'ZMW ' + (Number(v)||0).toFixed(2);
const moneyShort = v => {
  const n = Number(v) || 0;
  if(n >= 1000000) return 'ZMW ' + (n/1000000).toFixed(1) + 'M';
  if(n >= 1000)    return 'ZMW ' + (n/1000).toFixed(1) + 'k';
  return 'ZMW ' + n.toFixed(0);
};
const fmtDate = ts => ts ? new Date(ts).toLocaleString() : '—';
const fmtDay  = ts => ts ? new Date(ts).toLocaleDateString() : '—';
const pct = (a,b) => b > 0 ? Math.round((a/b)*100) : 0;

function toast(msg, type){
  const c = document.createElement('div');
  c.style.cssText = `position:fixed;top:74px;right:16px;z-index:9999;
    background:#12141d;color:#fff;padding:11px 18px;border-radius:22px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:12px;font-weight:600;
    border-left:3px solid ${type==='error'?'#ef4444':type==='success'?'#10b981':'#F5B042'};
    max-width:320px`;
  c.textContent = msg;
  document.body.appendChild(c);
  setTimeout(()=>c.remove(), 3000);
}
function showLoading(text, sub){
  document.getElementById('loadingText').textContent = text || 'Processing…';
  document.getElementById('loadingSub').textContent = sub || 'Fetching all records';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading(){
  document.getElementById('loadingOverlay').classList.remove('show');
}

/* =================================================================
   MODAL
================================================================= */
function openModal(title, sub, bodyHtml){
  document.getElementById('detailModalTitle').textContent = title || 'Details';
  document.getElementById('detailModalSub').textContent = sub || '';
  document.getElementById('detailModalBody').innerHTML = bodyHtml || '';
  document.getElementById('detailModal').classList.add('open');
}
function closeModal(){
  document.getElementById('detailModal').classList.remove('open');
}
document.getElementById('detailModalClose').addEventListener('click', closeModal);
document.getElementById('detailModal').addEventListener('click', e => {
  if(e.target.id === 'detailModal') closeModal();
});
window.__closeModal = closeModal;

/* =================================================================
   AUTH
================================================================= */
onAuthStateChanged(auth, user => {
  if(!user){ window.location.href = 'index.html'; return; }
  if(!user.email?.startsWith('admin@')){ alert('Admin only.'); signOut(auth); return; }
  currentAdmin = user;
  attachListeners();
});

/* =================================================================
   DATA LISTENERS
================================================================= */
let readyCount = 0;
function attachListeners(){
  /* Map firebase path → state key */
  const pathMap = {
    courses:'courses', subfolders:'subfolders', videos:'videos',
    docs:'docs', users:'users', promos:'promos',
    registers:'registers', assessments:'assessments',
    assessmentResponses:'assessmentResponses',
    lecturerRegisters:'lecturerRegisters',
    lecturerAssessments:'lecturerAssessments',
    lecturerResponses:'lecturerResponses',
    transactions:'transactions',
    pendingPurchases:'pendingPurchases',
    approvedPurchases:'approvedPurchases',
    lecturerPendingPurchases:'lecturerPendingPurchases',
    lecturerApprovedPurchases:'lecturerApprovedPurchases',
    bannedUsers:'bannedUsers',
    expressProducts:'expressProducts',
    expressOrders:'expressOrders',
    expressPayments:'expressPayments',
    expressCategories:'expressCategories',
    expressPickupLocations:'expressPickupLocations',
    lecturers:'lecturerData',           /* <-- FIXED */
    notifications:'notifications'
  };
  const paths = Object.keys(pathMap);
  const total = paths.length;
  paths.forEach(p => {
    onValue(ref(db, p), snap => {
      S[pathMap[p]] = snap.val() || {};
      readyCount++;
      if(readyCount >= Math.min(total, 15)){
        document.getElementById('loader').classList.add('hidden');
        render();
      }
    }, ()=>{});
  });
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hidden');
    render();
  }, 3500);
}

/* =================================================================
   RANGE
================================================================= */
function computeRange(){
  const now = new Date();
  switch(STATE.range){
    case 'today':
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
      STATE.endTs = now.getTime(); break;
    case 'week': {
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),diff,0,0,0).getTime();
      STATE.endTs = now.getTime(); break;
    }
    case 'month':
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),1).getTime();
      STATE.endTs = now.getTime(); break;
    case 'year':
      STATE.startTs = new Date(now.getFullYear(),0,1).getTime();
      STATE.endTs = now.getTime(); break;
    case 'all':
      STATE.startTs = 0; STATE.endTs = now.getTime(); break;
  }
}
function inRange(ts){
  if(!ts) return STATE.range === 'all';
  return ts >= STATE.startTs && ts <= STATE.endTs;
}
function rangeLabel(){
  if(STATE.range === 'all') return 'All Time';
  return `${new Date(STATE.startTs).toLocaleDateString()} → ${new Date(STATE.endTs).toLocaleDateString()}`;
}

/* =================================================================
   TRANSACTIONS — Build, dedupe, and combine both sources
================================================================= */
function buildAllTx(){
  const out = [];
  Object.entries(S.transactions).forEach(([id,tx]) =>
    out.push({ id, ...tx, _src:'tx' }));

  Object.entries(S.pendingPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([tid,tx]) =>
      out.push({ id:tid, userId:uid, ...tx, _src:'pending' }));
  });

  Object.entries(S.lecturerPendingPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([tid,tx]) =>
      out.push({ id:tid, userId:uid, ...tx, _src:'lecPending' }));
  });

  Object.entries(S.approvedPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([iid,info]) => {
      out.push({
        id:'AP-'+uid+'-'+iid, userId:uid,
        itemId:iid, itemTitle:info.itemTitle||info.title||'—',
        itemType:info.itemType||'course',
        amount:num(info.amount), status:'approved',
        timestamp:info.approvedAt||info.timestamp||null,
        expiresAt:info.expiresAt||null,
        durationType:info.durationType||'lifetime',
        durationValue:info.durationValue||0,
        lecturerId:info.lecturerId||'',
        _src:'approved'
      });
    });
  });

  Object.entries(S.lecturerApprovedPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([iid,info]) => {
      out.push({
        id:'LAP-'+uid+'-'+iid, userId:uid,
        itemId:iid, itemTitle:info.itemTitle||info.title||'—',
        itemType:info.itemType||'course',
        amount:num(info.amount), status:'approved',
        timestamp:info.approvedAt||info.timestamp||null,
        expiresAt:info.expiresAt||null,
        durationType:info.durationType||'lifetime',
        durationValue:info.durationValue||0,
        lecturerId:info.lecturerId||'',
        _src:'lecApproved'
      });
    });
  });

  Object.entries(S.expressPayments).forEach(([id,p]) => {
    out.push({
      id, userId:p.userId||'', itemId:p.orderId||id,
      itemTitle:p.productName||'Express Order',
      itemType:'shop', amount:num(p.amount),
      status:p.status||'pending', timestamp:p.createdAt||null,
      userEmail:p.customerEmail||'', userName:p.customerName||'',
      userPhone:p.customerPhone||'', screenshot:p.screenshot||'',
      provider:'MTN/Airtel', quantity:p.quantity||0,
      pickupLocationId:p.pickupLocationId||'', _src:'express'
    });
  });
  return out;
}

/* Dedupe: prefer approved record for the same itemId+userId */
function dedupeTx(list){
  const m = new Map();
  list.forEach(t => {
    const key = t.id;
    if(!m.has(key)) m.set(key, t);
    else {
      const cur = m.get(key);
      if(cur.status !== 'approved' && t.status === 'approved') m.set(key, t);
    }
  });
  return [...m.values()];
}

/* Content purchases (courses + subfolders) in current range */
function contentTxInRange(){
  return dedupeTx(buildAllTx())
    .filter(t => inRange(t.timestamp))
    .filter(t => {
      const it = (t.itemType||'course').toLowerCase();
      return it === 'course' || it === 'subfolder';
    });
}

/* =================================================================
   LOOKUPS — fast item / user resolution
================================================================= */
function buildLookups(){
  const itemById = {};
  Object.entries(S.courses).forEach(([id,c]) => {
    itemById[id] = {
      id, name:c.name||'Unnamed', type:'course', parent:'',
      price:num(c.price), lecturerId:c.lecturerId||''
    };
  });
  Object.entries(S.subfolders).forEach(([id,s]) => {
    const p = S.courses[s.courseId];
    itemById[id] = {
      id, name:s.name||'Unnamed', type:'subfolder',
      parent:p?.name||'—', parentId:s.courseId||'',
      price:num(s.price), lecturerId:s.lecturerId||p?.lecturerId||''
    };
  });
  const userById = {};
  Object.entries(S.users).forEach(([id,u]) => {
    userById[id] = {
      id,
      name: `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
      email: u.email||'', phone: u.phone||''
    };
  });
  const lecturerById = {};
  Object.entries(S.lecturerData).forEach(([id,l]) => {
    lecturerById[id] = {
      id, name:l.name||'Unnamed', email:l.email||'',
      phone:l.phone||'', college:l.collegeName||'',
      status: l.banned ? 'banned' : (l.status||'pending'),
      banned: !!l.banned
    };
  });
  return { itemById, userById, lecturerById };
}

/* =================================================================
   COLLAPSIBLE SECTION
================================================================= */
function isOpen(key, def){
  if(!(key in STATE.open)) STATE.open[key] = def !== false;
  return STATE.open[key];
}
function toggleOpen(key){
  STATE.open[key] = !isOpen(key);
  render();
}
window.__toggleOpen = toggleOpen;

function section(key, icon, title, count, body, defaultOpen){
  const open = isOpen(key, defaultOpen !== false);
  const countHtml = (count !== undefined && count !== null && count !== '')
    ? `<span class="count">${count}</span>` : '';
  return `
    <div class="section ${open?'open':''}" data-key="${esc(key)}">
      <div class="section-head" onclick="window.__toggleOpen('${esc(key)}')">
        <h3><i class="fas ${esc(icon)}"></i> ${esc(title)} ${countHtml}</h3>
        <div class="chev"><i class="fas fa-chevron-down"></i></div>
      </div>
      <div class="section-body"><div class="section-body-inner">${body}</div></div>
    </div>
  `;
}

/* =================================================================
   SHARED UI HELPERS
================================================================= */
function kpi(icon, v, label, color){
  const cls = ({
    '#d4952a':'gold','#c47f1a':'gold','#ff6b00':'gold',
    '#10b981':'green','#059669':'green',
    '#ef4444':'red',
    '#3b82f6':'blue',
    '#8b5cf6':'purple','#7c3aed':'purple',
    '#f59e0b':'yellow','#f39c12':'yellow'
  })[color] || '';
  return `<div class="kpi ${cls}">
    <div class="icon"><i class="fas ${icon}"></i></div>
    <div class="num">${esc(v)}</div>
    <div class="lbl">${esc(label)}</div>
  </div>`;
}
function pill(status){
  const k = String(status||'pending').toLowerCase().replace(/\s+/g,'-');
  return `<span class="pill pill-${k}">${esc(status||'pending')}</span>`;
}
function hero(title, desc){
  return `
    <div class="hero">
      <h1><i class="fas ${MODULES[STATE.module].icon}"></i> ${esc(title)}</h1>
      <p>${esc(desc)}</p>
      ${rangeControlsHTML()}
      ${downloadControlsHTML()}
    </div>
  `;
}
function rangeControlsHTML(){
  return `
    <div class="range-btns">
      <button class="range-btn ${STATE.range==='today'?'active':''}" data-range="today"><i class="fas fa-calendar-day"></i> Today</button>
      <button class="range-btn ${STATE.range==='week'?'active':''}" data-range="week"><i class="fas fa-calendar-week"></i> Week</button>
      <button class="range-btn ${STATE.range==='month'?'active':''}" data-range="month"><i class="fas fa-calendar-alt"></i> Month</button>
      <button class="range-btn ${STATE.range==='year'?'active':''}" data-range="year"><i class="fas fa-calendar"></i> Year</button>
      <button class="range-btn ${STATE.range==='all'?'active':''}" data-range="all"><i class="fas fa-infinity"></i> All Time</button>
      <button class="range-btn ${STATE.range==='custom'?'active':''}" data-range="custom"><i class="fas fa-sliders-h"></i> Custom…</button>
    </div>
    <div class="custom-box ${STATE.range==='custom'?'show':''}" id="customBox">
      <input type="date" id="fromDate" value="${STATE.startTs ? new Date(STATE.startTs).toISOString().slice(0,10) : ''}" />
      <input type="date" id="toDate" value="${new Date(STATE.endTs).toISOString().slice(0,10)}" />
      <button class="btn btn-primary" id="applyCustomBtn"><i class="fas fa-check"></i> Load Data</button>
    </div>
    <div class="range-display"><i class="fas fa-calendar-alt"></i> Range: <strong>${esc(rangeLabel())}</strong></div>
  `;
}
function downloadControlsHTML(){
  return `
    <div class="action-btns" style="margin-top:12px">
      <button class="btn btn-red" data-dl="pdf"><i class="fas fa-file-pdf"></i> PDF</button>
      <button class="btn btn-green" data-dl="excel"><i class="fas fa-file-excel"></i> Excel</button>
      <button class="btn btn-outline" data-dl="expandAll"><i class="fas fa-angles-down"></i> Expand</button>
      <button class="btn btn-outline" data-dl="collapseAll"><i class="fas fa-angles-up"></i> Collapse</button>
      <button class="btn btn-outline" data-dl="refresh"><i class="fas fa-sync"></i> Refresh</button>
    </div>
  `;
}
function barList(items, valueKey, opts = {}){
  const max = Math.max(...items.map(x => num(x[valueKey])), 1);
  return `<div class="bar-list">${items.map((it, i) => {
    const v = num(it[valueKey]);
    const p = Math.round((v / max) * 100);
    const val = opts.money ? money(v) : v.toLocaleString();
    const sub = opts.sub ? opts.sub(it) : '';
    const action = opts.onClick ? `onclick="${opts.onClick.replace('__ID__', esc(it.id||''))}"` : '';
    return `
      <div class="bar-item" ${action}>
        <span class="n">${i+1}</span>
        <div class="body">
          <div class="title">${esc(it.name || it.title || '—')}</div>
          ${sub ? `<div class="meta">${sub}</div>` : ''}
          <div class="bar-track"><span style="width:${p}%"></span></div>
        </div>
        <span class="val">${esc(val)}</span>
      </div>
    `;
  }).join('')}</div>`;
}
function statusFilterHTML(currentId, current){
  return `
    <select id="${currentId}">
      <option value="approved" ${current==='approved'?'selected':''}>✅ Approved (paid)</option>
      <option value="pending"  ${current==='pending'?'selected':''}>⏳ Pending</option>
      <option value="rejected" ${current==='rejected'?'selected':''}>❌ Rejected</option>
      <option value="all"      ${current==='all'?'selected':''}>All statuses</option>
    </select>
  `;
}

================================================================= */

/* — Student Detail — shows every course/subfolder/assessment/shop item bought — */
window.__openStudentDetail = function(uid){
  const { itemById, userById } = buildLookups();
  const u = userById[uid] || { id:uid, name:'Unknown', email:'', phone:'' };
  const banned = !!S.bannedUsers[uid];

  /* All purchases (approved + pending) for this student */
  const approved = [
    ...Object.entries(S.approvedPurchases[uid]||{}).map(([iid,info]) => ({
      itemId:iid, status:'approved',
      title:info.itemTitle||info.title||itemById[iid]?.name||'—',
      type:info.itemType||itemById[iid]?.type||'course',
      amount:num(info.amount), date:info.approvedAt||info.timestamp||null,
      expiresAt:info.expiresAt||null
    })),
    ...Object.entries(S.lecturerApprovedPurchases[uid]||{}).map(([iid,info]) => ({
      itemId:iid, status:'approved',
      title:info.itemTitle||info.title||itemById[iid]?.name||'—',
      type:info.itemType||itemById[iid]?.type||'course',
      amount:num(info.amount), date:info.approvedAt||info.timestamp||null,
      expiresAt:info.expiresAt||null
    }))
  ];
  const pending = [
    ...Object.entries(S.pendingPurchases[uid]||{}).map(([tid,tx]) => ({
      itemId:tx.itemId, status:'pending',
      title:tx.itemTitle||itemById[tx.itemId]?.name||'—',
      type:tx.itemType||itemById[tx.itemId]?.type||'course',
      amount:num(tx.amount), date:tx.timestamp||null
    })),
    ...Object.entries(S.lecturerPendingPurchases[uid]||{}).map(([tid,tx]) => ({
      itemId:tx.itemId, status:'pending',
      title:tx.itemTitle||itemById[tx.itemId]?.name||'—',
      type:tx.itemType||itemById[tx.itemId]?.type||'course',
      amount:num(tx.amount), date:tx.timestamp||null
    }))
  ];
  const rejected = [
    ...Object.entries(S.transactions||{})
      .filter(([,tx]) => tx.userId===uid && tx.status==='rejected')
      .map(([id,tx]) => ({
        itemId:tx.itemId, status:'rejected',
        title:tx.itemTitle||itemById[tx.itemId]?.name||'—',
        type:tx.itemType||itemById[tx.itemId]?.type||'course',
        amount:num(tx.amount), date:tx.timestamp||null
      }))
  ];

      <div class="modal-kpi"><div class="lbl">Total Paid</div><div class="val" style="color:#10b981">${moneyShort(totalApproved+totalShop)}</div></div>
      <div class="modal-kpi"><div class="lbl">Pending</div><div class="val" style="color:#f59e0b">${moneyShort(totalPending)}</div></div>

    <div class="modal-section-title"><i class="fas fa-book-open"></i> Courses Purchased (${courseItems.length})</div>
    ${courseItems.length === 0
      ? `<div class="empty"><i class="fas fa-inbox"></i><p>No courses purchased</p></div>`
      : `<div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>#</th><th>Course</th><th class="right">Paid</th><th>Expires</th><th>Date</th></tr></thead>
          <tbody>${courseItems.map((p,i)=>`
            <tr>
              <td class="rank">${i+1}</td>
              <td><strong>${esc(p.title)}</strong></td>
              <td class="right money">${money(p.amount)}</td>
              <td class="muted">${p.expiresAt ? fmtDate(p.expiresAt) : 'Lifetime'}</td>
              <td class="muted">${fmtDate(p.date)}</td>
            </tr>`).join('')}</tbody>

    <div class="modal-section-title"><i class="fas fa-folder"></i> Subfolders Purchased (${subItems.length})</div>
    ${subItems.length === 0
      ? `<div class="empty"><i class="fas fa-inbox"></i><p>No subfolders purchased</p></div>`
      : `<div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>#</th><th>Subfolder</th><th class="right">Paid</th><th>Expires</th><th>Date</th></tr></thead>
          <tbody>${subItems.map((p,i)=>`

              <td class="muted">${p.expiresAt ? fmtDate(p.expiresAt) : 'Lifetime'}</td>
              <td class="muted">${fmtDate(p.date)}</td>
            </tr>`).join('')}</tbody>
        </table></div>`}

    <div class="modal-section-title"><i class="fas fa-graduation-cap"></i> Assessment Attempts (${attempts.length})</div>
    ${attempts.length === 0

/* — Item / Course Detail — shows every enrolled student — */
window.__openItemDetail = function(itemId){
  const { itemById, userById } = buildLookups();
  const item = itemById[itemId] || { id:itemId, name:'Unknown Item', type:'course', parent:'—', price:0 };

  /* Collect every purchase for this item from both admin + lecturer approved maps */
  const approved = [];
  Object.entries(S.approvedPurchases).forEach(([uid,map]) => {
    if(map[itemId]){
      const info = map[itemId];
      approved.push({
        uid, status:'approved',
        name: userById[uid]?.name || 'Unknown',
        email: userById[uid]?.email || '',
        amount: num(info.amount),
        date: info.approvedAt || info.timestamp || 0,
        expiresAt: info.expiresAt || null
      });
    }
  });
  Object.entries(S.lecturerApprovedPurchases).forEach(([uid,map]) => {
    if(map[itemId]){
      const info = map[itemId];
      approved.push({
        uid, status:'approved',
        name: userById[uid]?.name || 'Unknown',
        email: userById[uid]?.email || '',
        amount: num(info.amount),
        date: info.approvedAt || info.timestamp || 0,
        expiresAt: info.expiresAt || null
      });
    }
  });

  const pending = [];
  Object.entries(S.pendingPurchases).forEach(([uid,map]) => {
    Object.values(map||{}).forEach(tx => {
      if(tx.itemId === itemId && tx.status === 'pending'){
        pending.push({
          uid, name:userById[uid]?.name || tx.userName || 'Unknown',
          email:userById[uid]?.email || tx.userEmail || '',
          amount: num(tx.amount), date: tx.timestamp||0
        });
      }
    });
  });
  Object.entries(S.lecturerPendingPurchases).forEach(([uid,map]) => {
    Object.values(map||{}).forEach(tx => {
      if(tx.itemId === itemId && tx.status === 'pending'){
        pending.push({
          uid, name:userById[uid]?.name || tx.userName || 'Unknown',
          email:userById[uid]?.email || tx.userEmail || '',
          amount: num(tx.amount), date: tx.timestamp||0
        });
      }
    });

  const totalRevenue = approved.reduce((s,p)=>s+p.amount,0);
  const uniqueStudents = new Set(approved.map(p=>p.uid)).size;

  /* Videos/docs count */
  const vidCount = Object.values(S.videos).filter(v =>
    item.type==='course' ? v.courseId===itemId : v.subfolderId===itemId).length;
  const docCount = Object.values(S.docs).filter(d =>
    item.type==='course' ? d.courseId===itemId : d.subfolderId===itemId).length;

  const html = `
    <div class="modal-kpi-grid">
      <div class="modal-kpi"><div class="lbl">Enrolled</div><div class="val">${uniqueStudents}</div></div>
      <div class="modal-kpi"><div class="lbl">Revenue</div><div class="val" style="color:#10b981">${moneyShort(totalRevenue)}</div></div>
      <div class="modal-kpi"><div class="lbl">Price</div><div class="val">${item.price > 0 ? money(item.price) : 'FREE'}</div></div>
      <div class="modal-kpi"><div class="lbl">Videos</div><div class="val">${vidCount}</div></div>
      <div class="modal-kpi"><div class="lbl">Docs</div><div class="val">${docCount}</div></div>
      <div class="modal-kpi"><div class="lbl">Pending</div><div class="val" style="color:#f59e0b">${pending.length}</div></div>
    </div>

    <div class="modal-section-title"><i class="fas fa-user-check"></i> Enrolled Students (${approved.length})</div>
    ${approved.length === 0
      ? `<div class="empty"><i class="fas fa-inbox"></i><p>No approved enrollments yet</p></div>`
      : `<div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>#</th><th>Student</th><th>Email</th><th class="right">Paid</th><th>Enrolled</th><th>Expires</th></tr></thead>
          <tbody>${approved.sort((a,b)=>(b.date||0)-(a.date||0)).map((p,i)=>`
            <tr class="clickable" onclick="window.__closeModal(); window.__openStudentDetail('${esc(p.uid)}')">
              <td class="rank">${i+1}</td>
              <td><strong>${esc(p.name)}</strong></td>
              <td class="muted">${esc(p.email)}</td>
              <td class="right money">${money(p.amount)}</td>
              <td class="muted">${fmtDate(p.date)}</td>
              <td class="muted">${p.expiresAt ? fmtDate(p.expiresAt) : 'Lifetime'}</td>
            </tr>`).join('')}</tbody>
        </table></div>`}

    <div class="modal-section-title"><i class="fas fa-clock"></i> Pending Requests (${pending.length})</div>
    ${pending.length === 0
      ? `<div class="empty"><i class="fas fa-check-circle"></i><p>No pending requests</p></div>`
      : `<div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>#</th><th>Student</th><th>Email</th><th class="right">Amount</th><th>Requested</th></tr></thead>
          <tbody>${pending.map((p,i)=>`

              <td class="muted">${esc(p.email)}</td>

              <td class="muted">${fmtDate(p.date)}</td>
            </tr>`).join('')}</tbody>
        </table></div>`}
  `;

  openModal(
    item.name,
    `${item.type.toUpperCase()}${item.parent && item.parent !== '—' ? ' · ' + item.parent : ''}`,
    html
  );
};

/* — Lecturer Detail — */
window.__openLecturerDetail = function(lid){
  const { itemById, lecturerById } = buildLookups();
  const l = lecturerById[lid] || { id:lid, name:'Unknown', email:'', phone:'', college:'' };
  const now = Date.now();

  /* Lecturer's courses and subfolders */
  const myCourses = Object.entries(S.courses)
    .filter(([,c]) => c.lecturerId === lid)
    .map(([id,c]) => ({ id, name:c.name||'Unnamed', price:num(c.price) }));

  /* Enrollments for each of their courses */
  const courseRows = myCourses.map(c => {
    const approved = [];
    Object.entries(S.approvedPurchases).forEach(([uid,map]) => {
      if(map[c.id]) approved.push({ uid, amount:num(map[c.id].amount), date:map[c.id].approvedAt||0 });
    });
    Object.entries(S.lecturerApprovedPurchases).forEach(([uid,map]) => {
      if(map[c.id]) approved.push({ uid, amount:num(map[c.id].amount), date:map[c.id].approvedAt||0 });
    });
    return {
      ...c,
      enrolled: approved.length,
      revenue: approved.reduce((s,x)=>s+x.amount,0)
    };
  }).sort((a,b)=>b.revenue-a.revenue);

  /* Lecturer's assessments */
  const myAssessments = Object.values(S.lecturerAssessments).filter(a => a.lecturerId === lid);
  const assIds = new Set(myAssessments.map(a => a.id));
  const myResponses = Object.values(S.lecturerResponses).filter(r => assIds.has(r.assessmentId));

  /* Payments (subscription) */
  const payments = [];
  Object.values(S.lecturerData[lid]?.payments||{}).forEach(p => payments.push(p));

  const status = l.banned ? 'banned'
    : (S.lecturerData[lid]?.status === 'approved' ? 'active' : (S.lecturerData[lid]?.status||'pending'));

  const totalRevenue = courseRows.reduce((s,c)=>s+c.revenue, 0);
  const totalStudents = new Set(courseRows.flatMap(c => [])).size;

  const html = `
    <div class="modal-kpi-grid">
      <div class="modal-kpi"><div class="lbl">Status</div><div class="val">${pill(status)}</div></div>
      <div class="modal-kpi"><div class="lbl">Courses</div><div class="val">${myCourses.length}</div></div>
      <div class="modal-kpi"><div class="lbl">Revenue</div><div class="val" style="color:#10b981">${moneyShort(totalRevenue)}</div></div>
      <div class="modal-kpi"><div class="lbl">Assessments</div><div class="val">${myAssessments.length}</div></div>
      <div class="modal-kpi"><div class="lbl">Attempts</div><div class="val">${myResponses.length}</div></div>
      <div class="modal-kpi"><div class="lbl">Paid</div><div class="val">${moneyShort(num(S.lecturerData[lid]?.paidAmount))}</div></div>
    </div>

    <div class="modal-section-title"><i class="fas fa-book-open"></i> Courses &amp; Enrollments (${courseRows.length})</div>
    ${courseRows.length === 0
      ? `<div class="empty"><i class="fas fa-inbox"></i><p>No courses yet</p></div>`
      : `<div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>#</th><th>Course</th><th class="right">Price</th><th class="right">Enrolled</th><th class="right">Revenue</th></tr></thead>
          <tbody>${courseRows.map((c,i)=>`
            <tr class="clickable" onclick="window.__closeModal(); window.__openItemDetail('${esc(c.id)}')">
              <td class="rank">${i+1}</td>
              <td><strong>${esc(c.name)}</strong></td>
              <td class="right">${c.price > 0 ? money(c.price) : 'FREE'}</td>
              <td class="right"><strong>${c.enrolled}</strong></td>
              <td class="right money">${money(c.revenue)}</td>
            </tr>`).join('')}</tbody>
        </table></div>`}

    <div class="modal-section-title"><i class="fas fa-file-alt"></i> Assessments (${myAssessments.length})</div>
    ${myAssessments.length === 0
      ? `<div class="empty"><i class="fas fa-inbox"></i><p>No assessments</p></div>`
      : `<div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>#</th><th>Assessment</th><th class="center">Type</th><th class="center">Status</th></tr></thead>
          <tbody>${myAssessments.map((a,i)=>`
            <tr>
              <td class="rank">${i+1}</td>
              <td><strong>${esc(a.name||'Untitled')}</strong></td>
              <td class="center">${pill(a.type||'test')}</td>
              <td class="center">${pill(a.status||'draft')}</td>
            </tr>`).join('')}</tbody>
        </table></div>`}
  `;

  openModal(
    l.name,
    `${l.email}${l.phone ? ' · '+l.phone : ''}${l.college ? ' · '+l.college : ''}`,
    html
  );
};

MODULES.bestSellers = {
  icon:'fa-fire',
  render(){
    const f = STATE.filters.bestSellers;
    const contentTx = contentTxInRange();
    const approved = contentTx.filter(t => t.status === 'approved');

    /* Aggregate by item */
    const itemSales = {};
    approved.forEach(t => {
      const k = t.itemId || t.itemTitle;
      if(!itemSales[k]) itemSales[k] = {
        id: t.itemId, title:t.itemTitle||'—',
        type:t.itemType||'course', count:0, revenue:0,
        students: new Set()
      };
      itemSales[k].count++;
      itemSales[k].revenue += num(t.amount);
      if(t.userId) itemSales[k].students.add(t.userId);
    });

    let items = Object.values(itemSales).map(x => ({
      ...x,
      unique: x.students.size
    }));

    if(f.typeFilter !== 'all'){
      items = items.filter(x => x.type === f.typeFilter);
    }
    if(f.search){
      const q = f.search.toLowerCase();
      items = items.filter(x => x.title.toLowerCase().includes(q));
    }

    items.sort((a,b)=>b.revenue-a.revenue);

    const totalRevenue = items.reduce((s,x)=>s+x.revenue,0);
    const totalSales = items.reduce((s,x)=>s+x.count,0);

    const takeaway = items.length > 0
      ? `<strong>${items.length}</strong> best-sellers generating <strong>${money(totalRevenue)}</strong> from <strong>${totalSales}</strong> paid sale${totalSales!==1?'s':''}.`

        ${kpi('fa-shopping-cart', totalSales, 'Total Sales', '#3b82f6')}
        ${kpi('fa-coins', moneyShort(totalRevenue), 'Revenue', '#10b981')}

      </div>

      <div class="section open" data-key="bs-filters">
        <div class="section-head" onclick="window.__toggleOpen('bs-filters')">
          <h3><i class="fas fa-filter"></i> Filters</h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          <div class="filters">
            <select id="bsType">
              <option value="all" ${f.typeFilter==='all'?'selected':''}>All types</option>
              <option value="course" ${f.typeFilter==='course'?'selected':''}>Courses only</option>
              <option value="subfolder" ${f.typeFilter==='subfolder'?'selected':''}>Subfolders only</option>

            <input type="text" id="bsSearch" placeholder="Search…" value="${esc(f.search)}" />
          </div>

      </div>

      ${section('bs-top','fa-chart-line','Ranked by Revenue', items.length,
        items.length === 0
          ? `<div class="empty"><i class="fas fa-fire"></i><p>No sales yet</p></div>`
          : barList(items.slice(0,20), 'revenue', {
              money: true,
              sub: (it) => `${it.count} sale${it.count!==1?'s':''} · ${it.unique} unique student${it.unique!==1?'s':''} · ${it.type}`,
              onClick: `window.__openItemDetail('__ID__')`

      <div class="section open" data-key="bs-list">
        <div class="section-head" onclick="window.__toggleOpen('bs-list')">

   --------------------------------------------------------------- */
MODULES.contentSales = {
  icon:'fa-book-open',
  render(){
    const f = STATE.filters.contentSales;
    const contentTx = contentTxInRange();

    const approvedTx = contentTx.filter(t => t.status === 'approved');
    const pendingTx  = contentTx.filter(t => t.status === 'pending');
    const rejectedTx = contentTx.filter(t => t.status === 'rejected');
    const sum = a => a.reduce((s,t)=>s+num(t.amount),0);

    const approvedRevenue = sum(approvedTx);
    const pendingValue = sum(pendingTx);
    const rejectedValue = sum(rejectedTx);

    let listTx;
    if(f.paymentStatus === 'approved') listTx = approvedTx;
    else if(f.paymentStatus === 'pending') listTx = pendingTx;
    else if(f.paymentStatus === 'rejected') listTx = rejectedTx;
    else listTx = contentTx;

    const rows = [];
    Object.values(S.courses).forEach(c => {
      rows.push({
        id:c.id, name:c.name||'Unnamed', type:'course', parent:'',
        price:num(c.price), priceType: num(c.price)>0?'paid':'free',
        videos: Object.values(S.videos).filter(v=>v.courseId===c.id).length,
        docs: Object.values(S.docs).filter(d=>d.courseId===c.id).length,
        sales:0, revenue:0, students:new Set()
      });
    });
    Object.values(S.subfolders).forEach(sf => {
      const parent = S.courses[sf.courseId];
      rows.push({
        id:sf.id, name:sf.name||'Unnamed', type:'subfolder', parent:parent?.name||'—',
        price:num(sf.price), priceType: num(sf.price)>0?'paid':'free',
        videos: Object.values(S.videos).filter(v=>v.subfolderId===sf.id).length,
        docs: Object.values(S.docs).filter(d=>d.subfolderId===sf.id).length,
        sales:0, revenue:0, students:new Set()
      });
    });
    const byId = {}; rows.forEach(r => byId[r.id] = r);

    listTx.forEach(t => {
      const r = byId[t.itemId];
      if(!r) return;
      r.sales++;
      if(t.status === 'approved') r.revenue += num(t.amount);
      if(t.userId) r.students.add(t.userId);
    });

    let filtered = rows;
    if(f.typeFilter === 'course')         filtered = filtered.filter(r => r.type === 'course');
    else if(f.typeFilter === 'subfolder') filtered = filtered.filter(r => r.type === 'subfolder');
    else if(f.typeFilter === 'free')      filtered = filtered.filter(r => r.priceType === 'free');
    else if(f.typeFilter === 'paid')      filtered = filtered.filter(r => r.priceType === 'paid');
    else if(f.typeFilter === 'top')       filtered = filtered.filter(r => r.sales > 0);

    if(f.search){
      const q = f.search.toLowerCase();
      filtered = filtered.filter(r =>
        r.name.toLowerCase().includes(q) || r.parent.toLowerCase().includes(q));
    }

    const sorters = {
      'revenue-desc': (a,b)=>b.revenue - a.revenue,
      'revenue-asc':  (a,b)=>a.revenue - b.revenue,
      'sales-desc':   (a,b)=>b.sales - a.sales,
      'sales-asc':    (a,b)=>a.sales - b.sales,
      'name-asc':     (a,b)=>a.name.localeCompare(b.name),
      'price-desc':   (a,b)=>b.price - a.price,
      'price-asc':    (a,b)=>a.price - b.price
    };
    filtered.sort(sorters[f.sortBy] || sorters['revenue-desc']);

    const totalRevenue = filtered.reduce((s,r)=>s+r.revenue,0);
    const totalSales = filtered.reduce((s,r)=>s+r.sales,0);
    const courseCount = filtered.filter(r=>r.type==='course').length;
    const subCount = filtered.filter(r=>r.type==='subfolder').length;
    const buyerCount = new Set([...filtered.flatMap(r=>[...r.students])]).size;

    const statusLabelMap = {
      'approved':'Approved (paid)',
      'pending':'Pending',
      'rejected':'Rejected',
      'all':'All Statuses'
    };

    const takeaway = f.paymentStatus === 'approved'
      ? `<strong>${approvedTx.length}</strong> paid sales · <strong>${buyerCount}</strong> unique buyers · <strong>${money(approvedRevenue)}</strong> revenue.`
      : `<strong>${listTx.length}</strong> ${statusLabelMap[f.paymentStatus]} records · Approved: ${money(approvedRevenue)} · Pending: ${money(pendingValue)} · Rejected: ${money(rejectedValue)}.`;

    return `
      ${hero('Courses & Subfolders','Every course and subfolder with sales, revenue and buyer counts. Click any row to see who bought it.')}
      <div class="summary-line">${takeaway}</div>

      <div class="kpi-strip">
        ${kpi('fa-book-open', courseCount, 'Courses', '#d4952a')}
        ${kpi('fa-folder', subCount, 'Subfolders', '#3b82f6')}
        ${kpi('fa-check-circle', approvedTx.length, 'Approved Sales', '#10b981')}
        ${kpi('fa-coins', moneyShort(approvedRevenue), 'Approved Revenue', '#10b981')}
        ${kpi('fa-hourglass-half', pendingTx.length, 'Pending', '#f59e0b')}
        ${kpi('fa-times-circle', rejectedTx.length, 'Rejected', '#ef4444')}
      </div>

      <div class="section open" data-key="cs-filters">
        <div class="section-head" onclick="window.__toggleOpen('cs-filters')">
          <h3><i class="fas fa-filter"></i> Filters — Showing: <span style="color:var(--gold-d)">${statusLabelMap[f.paymentStatus]}</span></h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          <div class="filters">
            ${statusFilterHTML('csPaymentStatus', f.paymentStatus)}
            <select id="csType">
              <option value="all" ${f.typeFilter==='all'?'selected':''}>All types</option>
              <option value="course" ${f.typeFilter==='course'?'selected':''}>Courses only</option>
              <option value="subfolder" ${f.typeFilter==='subfolder'?'selected':''}>Subfolders only</option>
              <option value="paid" ${f.typeFilter==='paid'?'selected':''}>Paid items</option>
              <option value="free" ${f.typeFilter==='free'?'selected':''}>Free items</option>
              <option value="top" ${f.typeFilter==='top'?'selected':''}>With sales</option>
            </select>
            <select id="csSort">
              <option value="revenue-desc" ${f.sortBy==='revenue-desc'?'selected':''}>Revenue ↓</option>
              <option value="revenue-asc" ${f.sortBy==='revenue-asc'?'selected':''}>Revenue ↑</option>
              <option value="sales-desc" ${f.sortBy==='sales-desc'?'selected':''}>Sales ↓</option>
              <option value="sales-asc" ${f.sortBy==='sales-asc'?'selected':''}>Sales ↑</option>
              <option value="price-desc" ${f.sortBy==='price-desc'?'selected':''}>Price ↓</option>
              <option value="price-asc" ${f.sortBy==='price-asc'?'selected':''}>Price ↑</option>
              <option value="name-asc" ${f.sortBy==='name-asc'?'selected':''}>Name A–Z</option>
            </select>
            <input type="text" id="csSearch" placeholder="Search…" value="${esc(f.search)}" />
          </div>
        </div></div>
      </div>

      <div class="section open" data-key="cs-main">
        <div class="section-head" onclick="window.__toggleOpen('cs-main')">
          <h3><i class="fas fa-list"></i> Items <span class="count">${filtered.length}</span></h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          ${filtered.length === 0
            ? `<div class="empty"><i class="fas fa-inbox"></i><p>No items match your filters</p></div>`
            : `<div class="tbl-wrap"><table class="rpt">
                <thead><tr>
                  <th>#</th><th>Item</th><th class="center">Type</th>
                  <th class="right">Price</th>
                  <th class="right">Buyers</th>
                  <th class="right">Sales</th>
                  <th class="right">Revenue</th>
                </tr></thead>
                <tbody>${filtered.map((r,i)=>`
                  <tr class="clickable" onclick="window.__openItemDetail('${esc(r.id)}')">
                    <td class="rank">${i+1}</td>
                    <td><strong>${esc(r.name)}</strong>${r.parent && r.parent !== '—' ? `<br><span class="muted">${esc(r.parent)}</span>` : ''}</td>
                    <td class="center">${pill(r.type)}</td>
                    <td class="right">${r.price > 0 ? money(r.price) : '<span style="color:#10b981;font-weight:700">FREE</span>'}</td>
                    <td class="right"><strong>${r.students.size}</strong></td>
                    <td class="right">${r.sales}</td>
                    <td class="right money">${money(r.revenue)}</td>
                  </tr>`).join('')}</tbody>
              </table></div>`}
        </div></div>
      </div>
    `;
  }
};

/* ---------------------------------------------------------------
   LECTURE DASHBOARD
   --------------------------------------------------------------- */
MODULES.lectureDash = {
  icon:'fa-chalkboard-teacher',
  render(){
    const f = STATE.filters.lectureDash;
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const txApproved = contentTxInRange().filter(t => t.status === 'approved');

    const ownerIdx = {};
    Object.entries(S.courses).forEach(([id,c])=>{ if(c.lecturerId) ownerIdx[id]=c.lecturerId; });
    Object.entries(S.subfolders).forEach(([id,s])=>{ if(s.lecturerId) ownerIdx[id]=s.lecturerId; });

    const byL = {};
    lectArr.forEach(l => {
      byL[l.id] = {
        id:l.id, name:l.name||'Unnamed', email:l.email||'', phone:l.phone||'',
        status:l.status||'pending', banned:!!l.banned,
        accessExpiresAt:l.accessExpiresAt||null, approvedAt:l.approvedAt||0,
        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length,
        subfolders: Object.values(S.subfolders).filter(s=>s.lecturerId===l.id).length,
        videos: Object.values(S.videos).filter(v=>v.lecturerId===l.id).length,
        docs: Object.values(S.docs).filter(d=>d.lecturerId===l.id).length,
        assessments: Object.values(S.assessments).filter(a=>a.lecturerId===l.id).length,
        sales:0, revenue:0, students:new Set()
      };
    });
    txApproved.forEach(t => {
      const owner = ownerIdx[t.itemId];
      if(!owner || !byL[owner]) return;
      const L = byL[owner];
      L.sales++; L.revenue += num(t.amount);
      if(t.userId) L.students.add(t.userId);
    });

    let rows = Object.values(byL).map(r => ({...r, uniqueStudents:r.students.size}));

    if(f.status !== 'all'){
      if(f.status === 'active')   rows = rows.filter(r =>
        r.status === 'approved' && !r.banned &&
        (!r.accessExpiresAt || r.accessExpiresAt > Date.now()));
      else if(f.status === 'expired') rows = rows.filter(r =>
        r.accessExpiresAt && r.accessExpiresAt <= Date.now());
      else if(f.status === 'banned')  rows = rows.filter(r => r.banned);
      else rows = rows.filter(r => r.status === f.status);
    }
    if(f.search){
      const q = f.search.toLowerCase();
      rows = rows.filter(r =>
        r.name.toLowerCase().includes(q) || r.email.toLowerCase().includes(q));
    }

    const sorters = {

        <div class="section-body"><div class="section-body-inner">
          <div class="filters">

MODULES.assessments = {
  icon:'fa-graduation-cap',
  render(){
    const f = STATE.filters.assessments;
    const assArr = [...Object.values(S.assessments), ...Object.values(S.lecturerAssessments)];
    const respArr = [...Object.values(S.assessmentResponses), ...Object.values(S.lecturerResponses)]
      .filter(r => inRange(r.submittedAt || r.startedAt || r.endedAt));

    let rows = assArr.map(a => {
      const resps = respArr.filter(r => r.assessmentId === a.id);
      const completed = resps.filter(r => r.status === 'completed' || r.status === 'ended');
      const passed = completed.filter(r => {
        const total = num(a.totalMarks);
        const p = total > 0 ? (num(r.score)/total)*100 : 0;
        return p >= num(a.passingScore || 50);
      });
      return {
        id:a.id, name:a.name||'Untitled', type:a.type||'test',
        duration:a.duration||'—', totalMarks:num(a.totalMarks),
        status:a.status||'draft',
        attempts:resps.length, completed:completed.length,
        passed:passed.length, failed:completed.length - passed.length
      };
    });

    if(f.status !== 'all'){
      if(f.status === 'draft') rows = rows.filter(r => r.status === 'draft');
      else if(f.status === 'published') rows = rows.filter(r => r.status === 'published');
      else if(f.status === 'withAttempts') rows = rows.filter(r => r.attempts > 0);
      else if(f.status === 'noAttempts') rows = rows.filter(r => r.attempts === 0);
    }
    if(f.search){
      const q = f.search.toLowerCase();
      rows = rows.filter(r => r.name.toLowerCase().includes(q));
    }

    const sorters = {
      'attempts-desc': (a,b)=>b.attempts - a.attempts,
      'attempts-asc': (a,b)=>a.attempts - b.attempts,
      'passed-desc': (a,b)=>b.passed - a.passed,
      'name-asc': (a,b)=>a.name.localeCompare(b.name)
    };
    rows.sort(sorters[f.sortBy] || sorters['attempts-desc']);

    const totalAttempts = rows.reduce((s,r)=>s+r.attempts,0);
    const totalCompleted = rows.reduce((s,r)=>s+r.completed,0);
    const totalPassed = rows.reduce((s,r)=>s+r.passed,0);
    const totalFailed = rows.reduce((s,r)=>s+r.failed,0);
    const passRate = pct(totalPassed, totalCompleted);

    const top = [...rows].filter(r=>r.attempts>0)
      .sort((a,b)=>b.attempts-a.attempts).slice(0,8);

    const takeaway = totalAttempts > 0
      ? `<strong>${totalAttempts}</strong> attempts · <strong>${passRate}%</strong> pass rate.`
      : `No attempts in this period — ${rows.length} assessments registered.`;

    return `
      ${hero('Assessments','Attempts, completions and pass rate for every test, quiz, exam and assignment.')}
      <div class="summary-line">${takeaway}</div>

      <div class="kpi-strip">
        ${kpi('fa-file-alt', rows.length, 'Assessments', '#d4952a')}
        ${kpi('fa-play', totalAttempts, 'Attempts', '#3b82f6')}
        ${kpi('fa-flag-checkered', totalCompleted, 'Completed', '#8b5cf6')}
        ${kpi('fa-check-circle', totalPassed, 'Passed', '#10b981')}
        ${kpi('fa-times-circle', totalFailed, 'Failed', '#ef4444')}
        ${kpi('fa-percentage', passRate + '%', 'Pass Rate', '#f59e0b')}
      </div>

      ${section('as-top','fa-chart-line','Most Attempted', top.length,
        top.length === 0
          ? `<div class="empty"><i class="fas fa-chart-line"></i><p>No attempts yet</p></div>`
          : barList(top, 'attempts', {
              sub: (it) => `${it.passed} passed · ${it.failed} failed`
            }),
        true)}

      <div class="section open" data-key="as-list">
        <div class="section-head" onclick="window.__toggleOpen('as-list')">
          <h3><i class="fas fa-list"></i> All Assessments <span class="count">${rows.length}</span></h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          <div class="filters">
            <select id="asStatus">
              <option value="all" ${f.status==='all'?'selected':''}>All statuses</option>
              <option value="draft" ${f.status==='draft'?'selected':''}>Draft</option>
              <option value="published" ${f.status==='published'?'selected':''}>Published</option>
              <option value="withAttempts" ${f.status==='withAttempts'?'selected':''}>With attempts</option>
              <option value="noAttempts" ${f.status==='noAttempts'?'selected':''}>No attempts</option>
            </select>
            <select id="asSort">
              <option value="attempts-desc" ${f.sortBy==='attempts-desc'?'selected':''}>Most attempts</option>
              <option value="attempts-asc" ${f.sortBy==='attempts-asc'?'selected':''}>Fewest attempts</option>
              <option value="passed-desc" ${f.sortBy==='passed-desc'?'selected':''}>Most passes</option>
              <option value="name-asc" ${f.sortBy==='name-asc'?'selected':''}>Name A–Z</option>
            </select>
            <input type="text" id="asSearch" placeholder="Search…" value="${esc(f.search)}" />
          </div>
          ${rows.length === 0
            ? `<div class="empty"><i class="fas fa-inbox"></i><p>No assessments match your filters</p></div>`
            : `<div class="tbl-wrap"><table class="rpt">
                <thead><tr>
                  <th>#</th><th>Assessment</th><th class="center">Type</th>
                  <th class="center">Status</th>
                  <th class="right">Attempts</th>
                  <th class="right">Pass / Fail</th>
                </tr></thead>
                <tbody>${rows.map((r,i)=>`
                  <tr>
                    <td class="rank">${i+1}</td>
                    <td><strong>${esc(r.name)}</strong><br><span class="muted">${esc(r.duration)} · ${r.totalMarks} marks</span></td>
                    <td class="center">${pill(r.type)}</td>
                    <td class="center">${pill(r.status)}</td>
                    <td class="right"><strong>${r.attempts}</strong></td>
                    <td class="right">
                      <span class="pill pill-pass">${r.passed}</span>
                      <span class="pill pill-fail">${r.failed}</span>
                    </td>
                  </tr>`).join('')}</tbody>
              </table></div>`}
        </div></div>
      </div>
    `;
  }
};

MODULES.students = {
  icon:'fa-user-graduate',
  render(){
    const f = STATE.filters.students;
    const { itemById } = buildLookups();
    const usersArr = Object.entries(S.users).map(([id,d])=>({id,...d}));
    const banned = Object.entries(S.bannedUsers).filter(([,v])=>v).map(([id])=>id);

    const byStudent = {};
    usersArr.forEach(u => {
      byStudent[u.id] = {
        id:u.id,
        name: `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
        email: u.email || '', phone: u.phone || '',
        banned: banned.includes(u.id),
        purchases: 0, spend: 0,
        courses: 0, subfolders: 0, assessments: 0, shop: 0,
        approved: [],
        pending: []
      };
    });

    /* Approved from both sources */
    Object.entries(S.approvedPurchases).forEach(([uid,map]) => {
      if(!byStudent[uid]) return;
      Object.entries(map||{}).forEach(([iid,info]) => {
        const amount = num(info.amount);
        byStudent[uid].purchases++;
        byStudent[uid].spend += amount;
        const type = (info.itemType || itemById[iid]?.type || 'course').toLowerCase();
        if(type === 'course') byStudent[uid].courses++;
        else if(type === 'subfolder') byStudent[uid].subfolders++;
        else if(['exam','test','quiz','assignment'].includes(type)) byStudent[uid].assessments++;
        byStudent[uid].approved.push({
          itemId:iid, title:info.itemTitle||itemById[iid]?.name||'—',
          type, amount
        });
      });
    });
    Object.entries(S.lecturerApprovedPurchases).forEach(([uid,map]) => {
      if(!byStudent[uid]) return;
      Object.entries(map||{}).forEach(([iid,info]) => {
        const amount = num(info.amount);
        byStudent[uid].purchases++;
        byStudent[uid].spend += amount;
        const type = (info.itemType || itemById[iid]?.type || 'course').toLowerCase();
        if(type === 'course') byStudent[uid].courses++;
        else if(type === 'subfolder') byStudent[uid].subfolders++;
        else if(['exam','test','quiz','assignment'].includes(type)) byStudent[uid].assessments++;
        byStudent[uid].approved.push({
          itemId:iid, title:info.itemTitle||itemById[iid]?.name||'—',
          type, amount
        });
      });
    });
    /* Pending */
    Object.entries(S.pendingPurchases).forEach(([uid,map]) => {
      if(!byStudent[uid]) return;
      Object.values(map||{}).forEach(tx => {
        if(tx.status === 'pending'){
          byStudent[uid].pending.push({
            itemId:tx.itemId, title:tx.itemTitle||itemById[tx.itemId]?.name||'—',
            type:tx.itemType||'course', amount:num(tx.amount)
          });
        }
      });
    });
    Object.entries(S.lecturerPendingPurchases).forEach(([uid,map]) => {
      if(!byStudent[uid]) return;
      Object.values(map||{}).forEach(tx => {
        if(tx.status === 'pending'){
          byStudent[uid].pending.push({
            itemId:tx.itemId, title:tx.itemTitle||itemById[tx.itemId]?.name||'—',
            type:tx.itemType||'course', amount:num(tx.amount)
          });
        }
      });
    });

    /* Shop spend */
    Object.values(S.expressPayments).forEach(p => {
      if(p.status === 'approved' && byStudent[p.userId]){
        byStudent[p.userId].spend += num(p.amount);
        byStudent[p.userId].shop++;
      }
    });

    let rows = Object.values(byStudent);
    if(f.status === 'buyers')     rows = rows.filter(r => r.purchases > 0);
    else if(f.status === 'nonBuyers') rows = rows.filter(r => r.purchases === 0);
    else if(f.status === 'banned') rows = rows.filter(r => r.banned);
    else if(f.status === 'active') rows = rows.filter(r => !r.banned && r.purchases > 0);

    if(f.search){
      const q = f.search.toLowerCase();
      rows = rows.filter(r =>
        r.name.toLowerCase().includes(q) ||
        r.email.toLowerCase().includes(q) ||
        r.phone.toLowerCase().includes(q));
    }

    const sorters = {
      'spend-desc': (a,b)=>b.spend - a.spend,
      'spend-asc': (a,b)=>a.spend - b.spend,
      'purchase-desc': (a,b)=>b.purchases - a.purchases,
      'purchase-asc': (a,b)=>a.purchases - b.purchases,
      'name-asc': (a,b)=>a.name.localeCompare(b.name),
      'name-desc': (a,b)=>b.name.localeCompare(a.name)
    };

/* =================================================================
   EVENTS
================================================================= */
function attachEvents(){
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = btn.dataset.range;
      if(r === 'custom'){
        STATE.range = 'custom';
        document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('customBox')?.classList.add('show');
        return;
      }
      STATE.range = r;
      showLoading('Loading data…', `Range: ${r}`);
      setTimeout(() => { computeRange(); render(); hideLoading(); }, 250);
    });
  });

  document.getElementById('applyCustomBtn')?.addEventListener('click', () => {
    const f = document.getElementById('fromDate').value;
    const t = document.getElementById('toDate').value;
    if(!f || !t){ toast('Pick both dates','error'); return; }
    const sTs = new Date(f + 'T00:00:00').getTime();
    const eTs = new Date(t + 'T23:59:59').getTime();
    if(eTs < sTs){ toast('End must be after start','error'); return; }
    showLoading('Loading data…', `${f} → ${t}`);
    setTimeout(() => {
      STATE.startTs = sTs; STATE.endTs = eTs;
      render(); hideLoading();
    }, 350);
  });

  document.querySelectorAll('[data-dl]').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.dl;
      if(k === 'pdf'){
        showLoading('Generating PDF…','Preparing document');
        setTimeout(() => downloadPDF().finally(hideLoading), 150);
      } else if(k === 'excel'){
        showLoading('Generating Excel…','Building workbook');
        setTimeout(() => { try{ downloadExcel(); } finally { hideLoading(); } }, 150);
      } else if(k === 'expandAll'){
        document.querySelectorAll('.section').forEach(s => STATE.open[s.dataset.key] = true);
        render(); toast('All expanded','info');
      } else if(k === 'collapseAll'){
        document.querySelectorAll('.section').forEach(s => STATE.open[s.dataset.key] = false);
        render(); toast('All collapsed','info');
      } else if(k === 'refresh'){
        showLoading('Refreshing…','Reloading');
        setTimeout(() => { computeRange(); render(); hideLoading(); }, 200);
      }
    });
  });

  const bind = (id, key) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(el.tagName === 'INPUT'){
      let t;
      el.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          const pos = el.selectionStart;
          STATE.filters[STATE.module][key] = el.value;
          render();
          const n = document.getElementById(id);
          if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
        }, 300);
      });
    } else {
      el.addEventListener('change', () => {
        STATE.filters[STATE.module][key] = el.value;
        render();
      });
    }
  };

  /* bestSellers */
  bind('bsType','typeFilter'); bind('bsSearch','search');
  /* enrollments */
  bind('enStatus','status'); bind('enSearch','search');
  /* contentSales */
  bind('csPaymentStatus','paymentStatus');
  bind('csType','typeFilter'); bind('csSort','sortBy'); bind('csSearch','search');
  /* lectureDash */
  bind('ldStatus','status'); bind('ldSort','sortBy'); bind('ldSearch','search');
  /* express */
  bind('exStatus','status'); bind('exSort','sortBy'); bind('exSearch','search');
  /* assessments */
  bind('asStatus','status'); bind('asSort','sortBy'); bind('asSearch','search');
  /* students */
  bind('stStatus','status'); bind('stSort','sortBy'); bind('stSearch','search');
  /* lecturers */
  bind('lcStatus','status'); bind('lcSort','sortBy'); bind('lcSearch','search');
}
