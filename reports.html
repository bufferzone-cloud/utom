<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<title>UTOM · Reports Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#F5B042;--gold-d:#c47f1a;--orange:#ff6b00;
  --bg:#f2f4f8;--text:#1a1d28;--sub:#5f6377;--muted:#8b8fa3;
  --line:rgba(229,232,237,.8);--card:rgba(255,255,255,.92);
  --green:#2ecc71;--red:#e63946;--yellow:#f39c12;--blue:#3b82f6;
  --purple:#7c3aed;--pink:#ec4899;--cyan:#0891b2;
  --sh-sm:0 2px 10px rgba(16,20,40,.05);
  --sh-md:0 10px 30px rgba(16,20,40,.08);
  --sh-lg:0 24px 60px rgba(16,20,40,.14);
  --r-sm:12px;--r-md:18px;--r-lg:24px;
  --t:.22s cubic-bezier(.25,.46,.45,.94);
  --app-h:100dvh;
}
@supports not (height:100dvh){:root{--app-h:100vh}}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,sans-serif}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(245,176,66,.4);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:14px;z-index:9999;transition:opacity .5s}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{width:48px;height:48px;border:5px solid #e5e7eb;border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-weight:700;color:var(--sub);font-size:14px}

.app{display:flex;flex-direction:column;height:var(--app-h);overflow:hidden}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;height:62px;flex-shrink:0;background:var(--bg);
  border-bottom:1px solid rgba(0,0,0,.04);z-index:40}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.icon-btn{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:1px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.75);backdrop-filter:blur(8px);display:flex;align-items:center;
  justify-content:center;font-size:16px;cursor:pointer;box-shadow:var(--sh-sm);transition:var(--t);
  color:var(--text);text-decoration:none}
.icon-btn:hover{transform:scale(1.06)}
.header-title{font-size:18px;font-weight:900;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:linear-gradient(135deg,#d4952a,#f5b042,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-title small{font-size:11px;-webkit-text-fill-color:var(--sub);
  color:var(--sub);font-weight:600;background:none;margin-left:6px;letter-spacing:0}

/* SIDEBAR */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);
  z-index:800;display:none}
.overlay.open{display:block}
.sidebar{position:fixed;top:0;left:-360px;width:320px;max-width:88vw;height:var(--app-h);
  background:rgba(255,255,255,.98);backdrop-filter:blur(20px);z-index:900;
  box-shadow:10px 0 40px rgba(0,0,0,.10);transition:left .32s cubic-bezier(.25,.46,.45,.94);
  display:flex;flex-direction:column;border-radius:0 var(--r-lg) var(--r-lg) 0;overflow:hidden}
.sidebar.open{left:0}
.sb-head{padding:22px 20px 18px;border-bottom:1px solid rgba(240,232,216,.6);
  display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;
  background:rgba(255,254,249,.6);flex-shrink:0}
.sb-head .brand{font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#d4952a,#f5b042,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-.5px}
.sb-head .tag{font-size:9px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.sb-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;
  background:rgba(245,245,245,.9);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;color:#555;border:none;transition:var(--t)}
.sb-close:hover{background:#e74c3c;color:#fff;transform:rotate(90deg)}
.sb-body{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.nav{display:flex;align-items:center;gap:13px;padding:12px 16px;border-radius:var(--r-sm);
  cursor:pointer;transition:var(--t);color:var(--text);font-weight:600;font-size:13.5px;
  background:transparent;border:none;width:100%;text-align:left}
.nav:hover{background:rgba(248,244,236,.6)}
.nav i{font-size:17px;width:22px;text-align:center;color:var(--muted);transition:color .2s}
.nav.active{background:rgba(245,176,66,.12);color:#d4952a}
.nav.active i{color:#d4952a}
.nav .badge{margin-left:auto;background:#e63946;color:#fff;font-size:9px;font-weight:800;
  padding:2px 9px;border-radius:30px}
.nav .badge:empty{display:none}
.divider{height:1px;background:rgba(240,240,245,.8);margin:8px 4px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 90px}

/* CARDS */
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--sh-sm);margin-bottom:14px}
.card h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h2 i{background:linear-gradient(135deg,#d4952a,#f5b042);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.card h3{font-size:13.5px;font-weight:800;margin-bottom:12px;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.card h3 i{color:var(--gold-d)}
.card p.hint{font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.55}

/* FILTERS */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:12px}
.filters.full{grid-template-columns:1fr}
.filters select,.filters input{width:100%;padding:10px 16px;border-radius:30px;
  border:1.5px solid var(--line);background:rgba(250,251,252,.85);font-size:12px;
  color:var(--text);outline:none;transition:var(--t);-webkit-appearance:none;appearance:none}
.filters select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path fill='%238b8fa3' d='M6 8L0 0h12z'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:34px}
.filters select:focus,.filters input:focus{border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 4px rgba(245,176,66,.10)}

.range-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.range-btn{padding:8px 18px;border-radius:30px;border:1.5px solid rgba(229,232,237,.8);
  background:rgba(255,255,255,.85);font-weight:700;font-size:11.5px;color:var(--sub);
  cursor:pointer;transition:var(--t);display:inline-flex;align-items:center;gap:6px}
.range-btn:hover{border-color:var(--gold);color:var(--gold-d);transform:translateY(-2px)}
.range-btn.active{background:linear-gradient(135deg,#f5b042,#ff6b00);color:#fff;
  border-color:transparent;box-shadow:0 4px 18px rgba(245,176,66,.32)}

.custom-box{display:none;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.custom-box.show{display:flex}
.custom-box input{flex:1;min-width:120px;padding:9px 14px;border-radius:30px;
  border:1.5px solid rgba(229,232,237,.8);background:rgba(250,251,252,.85);font-size:12px;
  color:var(--text);outline:none;transition:var(--t)}
.custom-box input:focus{border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 4px rgba(245,176,66,.10)}

.action-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;
  font-weight:700;border-radius:40px;transition:var(--t);white-space:nowrap;font-size:11.5px;padding:10px 20px}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-primary{background:linear-gradient(135deg,#f5b042,#ff6b00);color:#fff;
  box-shadow:0 4px 18px rgba(245,176,66,.28)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(245,176,66,.34)}
.btn-green{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;
  box-shadow:0 4px 18px rgba(46,204,113,.28)}
.btn-green:hover{transform:translateY(-2px)}
.btn-red{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;
  box-shadow:0 4px 18px rgba(231,76,60,.28)}
.btn-red:hover{transform:translateY(-2px)}
.btn-outline{background:transparent;border:2px solid rgba(224,216,200,.55);color:var(--sub)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-d);background:rgba(255,253,247,.5)}

.range-display{font-size:11.5px;color:var(--muted);margin-top:12px;text-align:center;
  background:rgba(245,176,66,.08);padding:8px 14px;border-radius:30px;
  display:inline-block;width:100%;font-weight:600}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;margin-bottom:14px}
.kpi{background:var(--card);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.6);border-radius:var(--r-md);padding:14px;
  box-shadow:var(--sh-sm);text-align:center;position:relative;overflow:hidden;
  transition:var(--t);min-width:0}
.kpi::after{content:'';position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--orange));opacity:0;transition:var(--t)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.kpi:hover::after{opacity:1}
.kpi .icon{font-size:20px;margin-bottom:6px}
.kpi .num{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.15;
  word-break:break-word;color:var(--text)}
.kpi .lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;margin-top:4px}

/* TABLES */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);
  background:#fff;-webkit-overflow-scrolling:touch}
table.rpt{width:100%;border-collapse:collapse;font-size:12px;min-width:520px;background:#fff}
table.rpt th{background:rgba(245,176,66,.10);padding:10px 12px;text-align:left;
  font-weight:700;color:var(--gold-d);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.5px;border-bottom:1.5px solid rgba(245,176,66,.22);white-space:nowrap}
table.rpt td{padding:9px 12px;border-bottom:1px solid rgba(240,240,245,.8);color:var(--text);
  vertical-align:top}
table.rpt tr:last-child td{border-bottom:none}
table.rpt tr:hover td{background:rgba(245,176,66,.04)}
table.rpt td.right,table.rpt th.right{text-align:right}
table.rpt td.center,table.rpt th.center{text-align:center}
table.rpt .money{font-weight:800;color:var(--gold-d)}
table.rpt .muted{color:var(--muted);font-size:11px}
table.rpt .rank{font-weight:800;width:32px;color:var(--gold-d)}
table.rpt .badge{display:inline-block;padding:3px 11px;border-radius:30px;
  font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.badge.approved{background:#e8f5e9;color:#2e7d32}
.badge.pending{background:#fff3e0;color:#e65100}
.badge.rejected{background:#fde8e8;color:#c62828}
.badge.cancelled{background:#f5f5f5;color:#616161}
.badge.completed{background:#e0f7fa;color:#00695c}
.badge.active{background:#d1ecf1;color:#0c5460}
.badge.banned{background:#721c24;color:#fff}
.badge.unpaid{background:#fff3cd;color:#856404}
.badge.expired{background:#f8d7da;color:#721c24}
.badge.confirmed{background:#e3f2fd;color:#0d47a1}
.badge.ready{background:#e8f5e9;color:#2e7d32}
.badge.collected{background:#e8eaf6;color:#283593}
.badge.draft{background:#f1f5f9;color:#475569}
.badge.scheduled{background:#e0e7ff;color:#3730a3}
.badge.published{background:#dcfce7;color:#15803d}

.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:12.5px}
.empty i{font-size:34px;display:block;margin-bottom:10px;opacity:.25}

/* RESPONSIVE */
@media (max-width:560px){
  .header{padding:0 12px;height:56px}
  .header-title{font-size:15.5px}
  .header-title small{font-size:9px}
  .content{padding:12px 11px 90px}
  .card{padding:14px}
  .kpi{padding:12px}
  .kpi .num{font-size:18px}
  .kpi .lbl{font-size:9px}
  .range-btn{padding:7px 14px;font-size:11px}
  .btn{padding:9px 16px;font-size:11px}
  table.rpt{font-size:11px}
  table.rpt th,table.rpt td{padding:8px 10px}
}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p>Loading Reports Studio…</p>
</div>

<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><i class="fas fa-bars"></i></button>
      <span class="header-title" id="headerTitle">Reports <small>Analytics Studio</small></span>
    </div>
    <a href="admin.html" class="icon-btn" title="Back to admin"><i class="fas fa-home"></i></a>
  </header>

  <div class="main">
    <main class="content" id="content">
      <div id="reportRoot"></div>
    </main>
  </div>
</div>

<!-- SIDEBAR -->
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <button class="sb-close" id="sbClose"><i class="fas fa-times"></i></button>
    <div class="brand">UTOM</div>
    <div class="tag">Reports · Studio</div>
  </div>
  <nav class="sb-body" id="sbBody">
    <button class="nav active" data-module="overview">
      <i class="fas fa-chart-pie"></i><span>Overview</span></button>
    <button class="nav" data-module="courses">
      <i class="fas fa-book-open"></i><span>Courses</span></button>
    <button class="nav" data-module="subfolders">
      <i class="fas fa-folder"></i><span>Subfolders</span></button>
    <button class="nav" data-module="lectureDash">
      <i class="fas fa-chalkboard-teacher"></i><span>Lecture Dashboard</span></button>
    <button class="nav" data-module="express">
      <i class="fas fa-store"></i><span>Express Shopping</span></button>
    <button class="nav" data-module="assessments">
      <i class="fas fa-graduation-cap"></i><span>Assessments</span></button>
    <button class="nav" data-module="students">
      <i class="fas fa-user-graduate"></i><span>Students</span></button>
    <button class="nav" data-module="lecturers">
      <i class="fas fa-users"></i><span>Lecturers</span></button>
    <div class="divider"></div>
    <a class="nav" href="admin.html"><i class="fas fa-arrow-left"></i><span>Back to Admin</span></a>
  </nav>
</aside>

<script type="module">
/* =================================================================
   FIREBASE
================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHiQHbATgnQIIB9X-gOM5XdmRbOsUJoBQ",
  authDomain: "utom-c4003.firebaseapp.com",
  databaseURL: "https://utom-c4003-default-rtdb.firebaseio.com",
  projectId: "utom-c4003",
  storageBucket: "utom-c4003.firebasestorage.app",
  messagingSenderId: "878225874050",
  appId: "1:878225874050:web:643626906bfd233eeae89b"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

/* =================================================================
   STATE
================================================================= */
const S = {
  courses:{}, subfolders:{}, videos:{}, docs:{}, users:{}, promos:{},
  registers:{}, assessments:{}, assessmentResponses:{},
  lecturerRegisters:{}, lecturerAssessments:{}, lecturerResponses:{},
  transactions:{}, pendingPurchases:{}, approvedPurchases:{},
  lecturerPendingPurchases:{}, lecturerApprovedPurchases:{},
  bannedUsers:{},
  expressProducts:{}, expressOrders:{}, expressPayments:{},
  expressCategories:{}, expressPickupLocations:{},
  lecturerData:{}
};

const STATE = {
  module:'overview',
  range:'today',
  startTs:0, endTs:Date.now(),
  // module-specific filters
  courses:{ status:'all', sortBy:'revenue-desc', search:'' },
  subfolders:{ status:'all', sortBy:'revenue-desc', search:'' },
  lectureDash:{ status:'all', sortBy:'earnings-desc', search:'' },
  express:{ status:'all', sortBy:'date-desc', search:'' },
  assessments:{ status:'all', sortBy:'date-desc', search:'' },
  students:{ status:'all', sortBy:'spend-desc', search:'' },
  lecturers:{ status:'all', sortBy:'date-desc', search:'' }
};

let currentAdmin = null;

/* =================================================================
   HELPERS
================================================================= */
const _ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const _RE = /[&<>"']/g;
const esc = s => s == null ? '' : String(s).replace(_RE, c => _ESC[c]);
const num = v => Number(v) || 0;
const money = v => 'ZMW ' + (Number(v)||0).toFixed(2);
const fmtDate = ts => ts ? new Date(ts).toLocaleString() : '—';
const fmtDay  = ts => ts ? new Date(ts).toLocaleDateString() : '—';

function toast(msg, type){
  const c = document.createElement('div');
  c.style.cssText = `position:fixed;top:76px;right:16px;z-index:9999;
    background:rgba(26,29,40,.95);color:#fff;padding:11px 20px;border-radius:30px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:12px;font-weight:600;
    border-left:3px solid ${type==='error'?'#e74c3c':type==='success'?'#2ecc71':'#f5b042'};
    max-width:340px`;
  c.textContent = msg;
  document.body.appendChild(c);
  setTimeout(()=>c.remove(), 3000);
}

/* =================================================================
   AUTH
================================================================= */
onAuthStateChanged(auth, user => {
  if(!user){ window.location.href = 'index.html'; return; }
  if(!user.email?.startsWith('admin@')){ alert('Admin only.'); signOut(auth); return; }
  currentAdmin = user;
  attachListeners();
});

/* =================================================================
   REALTIME DATA
================================================================= */
let readyCount = 0;
function attachListeners(){
  const paths = [
    'courses','subfolders','videos','docs','users','promos',
    'registers','assessments','assessmentResponses',
    'lecturerRegisters','lecturerAssessments','lecturerResponses',
    'transactions','pendingPurchases','approvedPurchases',
    'lecturerPendingPurchases','lecturerApprovedPurchases',
    'bannedUsers','expressProducts','expressOrders','expressPayments',
    'expressCategories','expressPickupLocations','lecturers'
  ];
  const total = paths.length;

  paths.forEach(p => {
    onValue(ref(db, p), snap => {
      S[p] = snap.val() || {};
      readyCount++;
      if(readyCount >= total || readyCount >= 12){
        document.getElementById('loader').classList.add('hidden');
        render();
      }
    }, ()=>{});
  });
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hidden');
    render();
  }, 3000);
}

/* =================================================================
   RANGE HANDLING
================================================================= */
function computeRange(){
  const now = new Date();
  switch(STATE.range){
    case 'today':
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
      STATE.endTs = now.getTime(); break;
    case 'week': {
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),diff,0,0,0).getTime();
      STATE.endTs = now.getTime(); break;
    }
    case 'month':
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),1).getTime();
      STATE.endTs = now.getTime(); break;
    case 'year':
      STATE.startTs = new Date(now.getFullYear(),0,1).getTime();
      STATE.endTs = now.getTime(); break;
    case 'all':
      STATE.startTs = 0; STATE.endTs = now.getTime(); break;
  }
}
function inRange(ts){
  if(!ts) return STATE.range === 'all';
  return ts >= STATE.startTs && ts <= STATE.endTs;
}
function rangeLabel(){
  if(STATE.range === 'all') return 'All Time';
  return `${new Date(STATE.startTs).toLocaleDateString()} → ${new Date(STATE.endTs).toLocaleDateString()}`;
}

/* =================================================================
   BUILD ALL TRANSACTIONS
================================================================= */
function buildAllTx(){
  const out = [];
  Object.entries(S.transactions).forEach(([id,tx]) => {
    out.push({ id, ...tx, _src:'tx' });
  });
  Object.entries(S.pendingPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([tid,tx]) =>
      out.push({ id:tid, userId:uid, ...tx, _src:'pending' }));
  });
  Object.entries(S.lecturerPendingPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([tid,tx]) =>
      out.push({ id:tid, userId:uid, ...tx, _src:'lecPending' }));
  });
  Object.entries(S.approvedPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([iid,info]) => {
      out.push({
        id:'AP-'+uid+'-'+iid, userId:uid,
        itemId:iid, itemTitle:info.itemTitle||info.title||'—',
        itemType:info.itemType||'course',
        amount:num(info.amount), status:'approved',
        timestamp:info.approvedAt||info.timestamp||null,
        _src:'approved'
      });
    });
  });
  Object.entries(S.lecturerApprovedPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([iid,info]) => {
      out.push({
        id:'LAP-'+uid+'-'+iid, userId:uid,
        itemId:iid, itemTitle:info.itemTitle||info.title||'—',
        itemType:info.itemType||'course',
        amount:num(info.amount), status:'approved',
        timestamp:info.approvedAt||info.timestamp||null,
        _src:'lecApproved'
      });
    });
  });
  Object.entries(S.expressPayments).forEach(([id,p]) => {
    out.push({
      id, userId:p.userId||'', itemId:p.orderId||id,
      itemTitle:p.productName||'Express Order',
      itemType:'shop', amount:num(p.amount),
      status:p.status||'pending', timestamp:p.createdAt||null,
      userEmail:p.customerEmail||'', userName:p.customerName||'',
      userPhone:p.customerPhone||'', screenshot:p.screenshot||'',
      provider:'MTN/Airtel', quantity:p.quantity||0,
      pickupLocationId:p.pickupLocationId||'', _src:'express'
    });
  });
  return out;
}

/* Dedupe by id, prefer non-approved versions */
function dedupeTx(list){
  const m = new Map();
  list.forEach(t => {
    if(!m.has(t.id)) m.set(t.id, t);
    else {
      const cur = m.get(t.id);
      if(cur.status !== 'approved' && t.status === 'approved') m.set(t.id, t);
    }
  });
  return [...m.values()];
}

window.MODULES.lectureDash = {
  render(){
    const f = STATE.lectureDash;
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));

    // Compute earnings per lecturer from approved purchases
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved')
      .filter(t => t.itemType === 'course' || t.itemType === 'subfolder');

    // Build owner index
    const ownerIdx = {};
    Object.entries(S.courses).forEach(([id,c])=>{ if(c.lecturerId) ownerIdx[id]=c.lecturerId; });
    Object.entries(S.subfolders).forEach(([id,s])=>{ if(s.lecturerId) ownerIdx[id]=s.lecturerId; });

    const byLecturer = {};
    lectArr.forEach(l => {
      byLecturer[l.id] = {
        id:l.id,
        name:l.name||'Unnamed',
        email:l.email||'',
        phone:l.phone||'',
        status:l.status||'pending',
        banned:!!l.banned,
        accessExpiresAt:l.accessExpiresAt||null,
        approvedAt:l.approvedAt||0,
        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length,
        subfolders: Object.values(S.subfolders).filter(s=>s.lecturerId===l.id).length,
        videos: Object.values(S.videos).filter(v=>v.lecturerId===l.id).length,
        docs: Object.values(S.docs).filter(d=>d.lecturerId===l.id).length,
        assessments: Object.values(S.assessments).filter(a=>a.lecturerId===l.id).length,
        sales:0, revenue:0, students:new Set()
      };
    });

    txApproved.forEach(t => {
      const ownerId = ownerIdx[t.itemId];
      if(!ownerId || !byLecturer[ownerId]) return;
      const L = byLecturer[ownerId];
      L.sales += 1;
      L.revenue += num(t.amount);
      if(t.userId) L.students.add(t.userId);
    });

    let rows = Object.values(byLecturer);
    rows.forEach(r => r.uniqueStudents = r.students.size);

    // Apply status filter
    if(f.status === 'approved')   rows = rows.filter(r => r.status === 'approved' && !r.banned);
    else if(f.status === 'pending')  rows = rows.filter(r => r.status === 'pending');
    else if(f.status === 'rejected') rows = rows.filter(r => r.status === 'rejected');
    else if(f.status === 'banned')   rows = rows.filter(r => r.banned);
    else if(f.status === 'active')   rows = rows.filter(r => {
      return r.status === 'approved' && !r.banned &&
             (!r.accessExpiresAt || r.accessExpiresAt > Date.now());
    });
    else if(f.status === 'expired')  rows = rows.filter(r =>
      r.accessExpiresAt && r.accessExpiresAt <= Date.now());

    if(f.search){
      const q = f.search.toLowerCase();
      rows = rows.filter(r =>
        r.name.toLowerCase().includes(q) ||
        r.email.toLowerCase().includes(q) ||
        r.phone.toLowerCase().includes(q));
    }

    const sorters = {
      'earnings-desc': (a,b)=>b.revenue - a.revenue,
      'earnings-asc':  (a,b)=>a.revenue - b.revenue,
      'sales-desc':    (a,b)=>b.sales - a.sales,
      'sales-asc':     (a,b)=>a.sales - b.sales,
      'courses-desc':  (a,b)=>b.courses - a.courses,
      'students-desc': (a,b)=>b.uniqueStudents - a.uniqueStudents,
      'name-asc':      (a,b)=>a.name.localeCompare(b.name),
      'date-desc':     (a,b)=>(b.approvedAt||0)-(a.approvedAt||0)
    };
    rows.sort(sorters[f.sortBy] || sorters['earnings-desc']);

    const totalRevenue = rows.reduce((s,r)=>s+r.revenue,0);
    const totalSales = rows.reduce((s,r)=>s+r.sales,0);
    const totalPosts = rows.reduce((s,r)=>s+r.courses+r.subfolders+r.videos+r.docs+r.assessments,0);
    const activeCount = rows.filter(r => {
      return r.status==='approved' && !r.banned && (!r.accessExpiresAt || r.accessExpiresAt > Date.now());
    }).length;

    return `
      <div class="card">
        <h2><i class="fas fa-chalkboard-teacher"></i> Lecture Dashboard Report</h2>
        <p class="hint">Per-lecturer earnings, content output and access status.</p>
        ${rangeControlsHTML()}

        <div class="filters">
          <select id="ldStatus">
            <option value="all" ${f.status==='all'?'selected':''}>All lecturers</option>
            <option value="active" ${f.status==='active'?'selected':''}>Active</option>
            <option value="expired" ${f.status==='expired'?'selected':''}>Expired</option>
            <option value="approved" ${f.status==='approved'?'selected':''}>Approved</option>
            <option value="pending" ${f.status==='pending'?'selected':''}>Pending approval</option>
            <option value="rejected" ${f.status==='rejected'?'selected':''}>Rejected</option>
            <option value="banned" ${f.status==='banned'?'selected':''}>Banned</option>
          </select>
          <select id="ldSort">
            <option value="earnings-desc" ${f.sortBy==='earnings-desc'?'selected':''}>Sort: Earnings ↓</option>
            <option value="earnings-asc"  ${f.sortBy==='earnings-asc'?'selected':''}>Sort: Earnings ↑</option>
            <option value="sales-desc"    ${f.sortBy==='sales-desc'?'selected':''}>Sort: Sales ↓</option>
            <option value="sales-asc"     ${f.sortBy==='sales-asc'?'selected':''}>Sort: Sales ↑</option>
            <option value="courses-desc"  ${f.sortBy==='courses-desc'?'selected':''}>Sort: Courses ↓</option>
            <option value="students-desc" ${f.sortBy==='students-desc'?'selected':''}>Sort: Unique Students ↓</option>
            <option value="name-asc"      ${f.sortBy==='name-asc'?'selected':''}>Sort: Name A–Z</option>
            <option value="date-desc"     ${f.sortBy==='date-desc'?'selected':''}>Sort: Newest first</option>
          </select>
          <input type="text" id="ldSearch" placeholder="Search lecturer…" value="${esc(f.search)}" />
        </div>

        ${downloadControlsHTML()}
      </div>

      <div class="kpi-grid">
        ${kpi('fa-users', rows.length, 'Lecturers Shown', '#7c3aed')}
        ${kpi('fa-bolt', activeCount, 'Active Access', '#2ecc71')}
        ${kpi('fa-shopping-cart', totalSales, 'Sales Made', '#3b82f6')}
        ${kpi('fa-coins', money(totalRevenue), 'Revenue Generated', '#d4952a')}
        ${kpi('fa-folder-open', totalPosts, 'Total Posts', '#0891b2')}
      </div>

      <div class="card">
        <h3><i class="fas fa-table"></i> Lecturer Performance</h3>
        ${rows.length === 0
          ? `<div class="empty"><i class="fas fa-inbox"></i>No lecturers match your filters.</div>`
          : `<div class="tbl-wrap"><table class="rpt">
              <thead><tr>
                <th>#</th><th>Lecturer</th><th class="center">Status</th>
                <th class="right">Courses</th>
                <th class="right">Subs</th>
                <th class="right">Posts</th>
                <th class="right">Sales</th>
                <th class="right">Students</th>
                <th class="right">Earnings</th>
              </tr></thead>
              <tbody>${rows.map((r,i)=>{
                let pillCls = 'pending', pillTxt = r.status;
                if(r.banned){ pillCls='banned'; pillTxt='banned'; }
                else if(r.status==='approved' && (!r.accessExpiresAt || r.accessExpiresAt>Date.now())){
                  pillCls='active'; pillTxt='active';
                } else if(r.accessExpiresAt && r.accessExpiresAt<=Date.now()){
                  pillCls='expired'; pillTxt='expired';
                }
                return `
                <tr>
                  <td class="rank">${i+1}</td>
                  <td><strong>${esc(r.name)}</strong><br><span class="muted">${esc(r.email)}</span></td>
                  <td class="center"><span class="badge ${pillCls}">${pillTxt}</span></td>
                  <td class="right">${r.courses}</td>
                  <td class="right">${r.subfolders}</td>
                  <td class="right muted">${r.videos}/${r.docs}/${r.assessments}</td>
                  <td class="right"><strong>${r.sales}</strong></td>
                  <td class="right">${r.uniqueStudents}</td>
                  <td class="right money">${money(r.revenue)}</td>
                </tr>`;
              }).join('')}</tbody>
            </table></div>`}
      </div>
    `;
  }
};

window.MODULES.assessments = {
  render(){
    const f = STATE.assessments;
    const assArr = [...Object.values(S.assessments), ...Object.values(S.lecturerAssessments)];
    const respArr = [...Object.values(S.assessmentResponses), ...Object.values(S.lecturerResponses)]
      .filter(r => inRange(r.submittedAt || r.startedAt || r.endedAt));

    let rows = assArr.map(a => {
      const resps = respArr.filter(r => r.assessmentId === a.id);
      const completed = resps.filter(r => r.status === 'completed' || r.status === 'ended');
      const passed = completed.filter(r => {
        const total = num(a.totalMarks);
        const pct = total > 0 ? (num(r.score)/total)*100 : 0;
        return pct >= num(a.passingScore || 50);
      });
      return {
        id:a.id,
        name:a.name||'Untitled',
        type:a.type||'test',
        duration:a.duration||'—',
        totalMarks:num(a.totalMarks),
        passingScore:num(a.passingScore||50),
        price:num(a.price),
        status:a.status||'draft',
        registerIds: a.registerIds || [],
        attempts:resps.length,
        completed:completed.length,
        passed:passed.length,
        failed:completed.length - passed.length,
        avgScore: completed.length ? Math.round(completed.reduce((s,r)=>s+num(r.score),0) / completed.length) : 0
      };
    });

    if(f.status !== 'all'){
      if(f.status === 'draft') rows = rows.filter(r => r.status === 'draft');
      else if(f.status === 'published') rows = rows.filter(r => r.status === 'published');
      else if(f.status === 'scheduled') rows = rows.filter(r => r.status === 'scheduled');
      else if(f.status === 'ended') rows = rows.filter(r => r.status === 'ended');
      else if(f.status === 'withAttempts') rows = rows.filter(r => r.attempts > 0);
      else if(f.status === 'noAttempts') rows = rows.filter(r => r.attempts === 0);
    }

    if(f.search){
      const q = f.search.toLowerCase();
      rows = rows.filter(r => r.name.toLowerCase().includes(q));
    }

    const sorters = {
      'date-desc': (a,b)=>(b.attempts||0)-(a.attempts||0),
      'attempts-desc': (a,b)=>b.attempts - a.attempts,
      'attempts-asc': (a,b)=>a.attempts - b.attempts,
      'passed-desc': (a,b)=>b.passed - a.passed,
      'name-asc': (a,b)=>a.name.localeCompare(b.name),
      'avg-desc': (a,b)=>b.avgScore - a.avgScore
    };
    rows.sort(sorters[f.sortBy] || sorters['attempts-desc']);

    const totalAttempts = rows.reduce((s,r)=>s+r.attempts,0);
    const totalCompleted = rows.reduce((s,r)=>s+r.completed,0);
    const totalPassed = rows.reduce((s,r)=>s+r.passed,0);
    const totalFailed = rows.reduce((s,r)=>s+r.failed,0);
    const passRate = totalCompleted > 0 ? Math.round((totalPassed/totalCompleted)*100) : 0;

    return `
      <div class="card">
        <h2><i class="fas fa-graduation-cap"></i> Assessments Report</h2>
        <p class="hint">Complete analysis of every test, quiz, exam and assignment.</p>
        ${rangeControlsHTML()}

        <div class="filters">
          <select id="asStatus">
            <option value="all" ${f.status==='all'?'selected':''}>All statuses</option>
            <option value="draft" ${f.status==='draft'?'selected':''}>Draft</option>
            <option value="published" ${f.status==='published'?'selected':''}>Published</option>
            <option value="scheduled" ${f.status==='scheduled'?'selected':''}>Scheduled</option>
            <option value="ended" ${f.status==='ended'?'selected':''}>Ended</option>
            <option value="withAttempts" ${f.status==='withAttempts'?'selected':''}>With attempts</option>
            <option value="noAttempts" ${f.status==='noAttempts'?'selected':''}>No attempts</option>
          </select>
          <select id="asSort">
            <option value="attempts-desc" ${f.sortBy==='attempts-desc'?'selected':''}>Sort: Most attempts</option>
            <option value="attempts-asc" ${f.sortBy==='attempts-asc'?'selected':''}>Sort: Fewest attempts</option>
            <option value="passed-desc" ${f.sortBy==='passed-desc'?'selected':''}>Sort: Most passes</option>
            <option value="avg-desc" ${f.sortBy==='avg-desc'?'selected':''}>Sort: Highest avg score</option>
            <option value="name-asc" ${f.sortBy==='name-asc'?'selected':''}>Sort: Name A–Z</option>
          </select>
          <input type="text" id="asSearch" placeholder="Search assessment name…" value="${esc(f.search)}" />
        </div>

        ${downloadControlsHTML()}
      </div>

      <div class="kpi-grid">
        ${kpi('fa-file-alt', rows.length, 'Assessments', '#d4952a')}
        ${kpi('fa-play', totalAttempts, 'Attempts', '#3b82f6')}
        ${kpi('fa-flag-checkered', totalCompleted, 'Completed', '#7c3aed')}
        ${kpi('fa-check-circle', totalPassed, 'Passed', '#2ecc71')}
        ${kpi('fa-times-circle', totalFailed, 'Failed', '#e74c3c')}
        ${kpi('fa-percentage', passRate + '%', 'Pass Rate', '#f39c12')}
      </div>

      <div class="card">
        <h3><i class="fas fa-table"></i> Assessment Breakdown</h3>
        ${rows.length === 0
          ? `<div class="empty"><i class="fas fa-inbox"></i>No assessments match your filters.</div>`
          : `<div class="tbl-wrap"><table class="rpt">
              <thead><tr>

/* =================================================================

================================================================= */
function attachModuleEvents(){
  // Range buttons
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.range = btn.dataset.range;
      document.getElementById('customBox')?.classList.toggle('show', STATE.range === 'custom');
      if(STATE.range !== 'custom'){
        computeRange();
        render();
      } else {
        document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });

  // Custom range apply
  document.getElementById('applyCustomBtn')?.addEventListener('click', () => {
    const f = document.getElementById('fromDate').value;
    const t = document.getElementById('toDate').value;
    if(!f || !t){ toast('Pick both dates','error'); return; }
    const sTs = new Date(f + 'T00:00:00').getTime();
    const eTs = new Date(t + 'T23:59:59').getTime();
    if(eTs < sTs){ toast('End date must be after start date','error'); return; }
    STATE.startTs = sTs; STATE.endTs = eTs;
    render();
  });

  // Download buttons
  document.querySelectorAll('[data-dl]').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.dl;
      if(k === 'pdf') downloadPDF();
      else if(k === 'excel') downloadExcel();
      else if(k === 'refresh'){ computeRange(); render(); toast('Refreshed','info'); }
    });
  });

  // Module-specific filters
  const bind = (id, key, valKey) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', () => {
      STATE[STATE.module][key] = el.value;
      render();
    });
    if(el.tagName === 'INPUT'){
      let t;
      el.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          STATE[STATE.module][key] = el.value;
          // preserve focus
          const pos = el.selectionStart;
          render();
          const n = document.getElementById(id);
          if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
        }, 350);
      });
    }
  };

  bind('crsStatus','status'); bind('crsSort','sortBy'); bind('crsSearch','search');
  bind('sfStatus','status');  bind('sfSort','sortBy');  bind('sfSearch','search');
  bind('ldStatus','status');  bind('ldSort','sortBy');  bind('ldSearch','search');
  bind('exStatus','status');  bind('exSort','sortBy');  bind('exSearch','search');
  bind('asStatus','status');  bind('asSort','sortBy');  bind('asSearch','search');
  bind('stStatus','status');  bind('stSort','sortBy');  bind('stSearch','search');
  bind('lcStatus','status');  bind('lcSort','sortBy');  bind('lcSearch','search');
}

/* =================================================================
   PDF DOWNLOAD (per module)
================================================================= */
async function downloadPDF(){
  const root = document.getElementById('reportRoot');
  if(!root) return;

  const moduleNames = {
    overview:'Platform Overview', courses:'Courses Report', subfolders:'Subfolders Report',
    lectureDash:'Lecture Dashboard Report', express:'Express Shopping Report',
    assessments:'Assessments Report', students:'Students Report', lecturers:'Lecturers Report'
  };

  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:24px 20px;background:#fff;color:#1a1d28;font-family:Inter,Arial,sans-serif;';
  wrap.innerHTML = `
    <div style="text-align:center;padding:16px 12px 18px;border-bottom:3px solid #F5B042;margin-bottom:18px;">
      <h1 style="font-size:24px;font-weight:900;margin:0;background:linear-gradient(135deg,#d4952a,#f5b042,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">UTOM · ${moduleNames[STATE.module]}</h1>
      <div style="font-size:12px;color:#5f6377;margin-top:6px;">Range: <strong>${esc(rangeLabel())}</strong></div>
      <div style="font-size:11px;color:#8b8fa3;margin-top:2px;">Generated: ${new Date().toLocaleString()}</div>
      <div style="font-size:11px;color:#8b8fa3;margin-top:2px;">By: ${esc(currentAdmin?.email||'admin')}</div>
    </div>
  `;

  const cloned = root.cloneNode(true);
  cloned.querySelectorAll('.card, .kpi').forEach(el => {
    el.style.background = '#fff';
    el.style.boxShadow = 'none';
    el.style.border = '1px solid #e5e8ed';
  });
  cloned.querySelectorAll('.range-btns, .custom-box, .action-btns, .filters').forEach(el => el.remove());
  wrap.appendChild(cloned);
  document.body.appendChild(wrap);

  const btn = document.querySelector('[data-dl="pdf"]');
  const orig = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating…'; }

  try{
    await html2pdf().set({
      margin:[6,6,10,6],
      filename:`UTOM-${STATE.module}-${new Date().toISOString().slice(0,10)}.pdf`,
      image:{ type:'jpeg', quality:0.95 },
      html2canvas:{ scale:2, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak:{ mode:['css','legacy'] }
    }).from(wrap).save();
    toast('PDF downloaded','success');
  }catch(e){
    console.error(e);
    toast('PDF error: ' + e.message,'error');
  }finally{
    document.body.removeChild(wrap);
    if(btn){ btn.disabled = false; btn.innerHTML = orig; }
  }
}

/* =================================================================
   EXCEL DOWNLOAD (per module)
================================================================= */
function downloadExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel library not loaded','error'); return; }
  const wb = XLSX.utils.book_new();

  const addSheet = (name, rows) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const w = [];
    rows.forEach(r => (r||[]).forEach((c,i)=>{
      const len = String(c==null?'':c).length;
      w[i] = Math.max(w[i]||8, Math.min(len+2, 45));
    }));
    ws['!cols'] = w.map(x=>({wch:x}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };

  /* INFO */
  const infoRows = [
    ['UTOM REPORT'],
    ['Module', STATE.module],
    ['Range', rangeLabel()],
    ['Generated', new Date().toLocaleString()],
    ['By', currentAdmin?.email||'admin'],
    []
  ];

  if(STATE.module === 'overview'){
    const courses = Object.values(S.courses);
    const subs    = Object.values(S.subfolders);
    const vids    = Object.values(S.videos);
    const docs    = Object.values(S.docs);
    const users   = Object.values(S.users);
    const lectArr = Object.entries(S.lecturerData);

    const allTx = dedupeTx(buildAllTx()).filter(t => inRange(t.timestamp));
    const approved = allTx.filter(t => t.status==='approved');
    const pending  = allTx.filter(t => t.status==='pending');
    const rejected = allTx.filter(t => t.status==='rejected');
    const sum = a => a.reduce((s,t)=>s+num(t.amount),0);

    addSheet('Overview', [
      ...infoRows,
      ['LIBRARY TOTALS',''],
      ['Courses', courses.length],
      ['Subfolders', subs.length],
      ['Videos', vids.length],
      ['Documents', docs.length],
      ['Students', users.length],
      ['Lecturers', lectArr.length],
      [],
      ['TRANSACTIONS','Count','ZMW'],
      ['Approved', approved.length, sum(approved).toFixed(2)],
      ['Pending', pending.length, sum(pending).toFixed(2)],
      ['Rejected', rejected.length, sum(rejected).toFixed(2)],
      ['Total', allTx.length, (sum(approved)+sum(pending)+sum(rejected)).toFixed(2)],
      [],
      ['RECENT ACTIVITY (Top 50)','','','',''],
      ['User','Email','Item','Type','Amount','Status','Date'],
      ...allTx.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).slice(0,50).map(t=>[
        t.userName||'', t.userEmail||'', t.itemTitle||'',
        t.itemType||'', num(t.amount).toFixed(2),
        t.status||'', fmtDate(t.timestamp)
      ])
    ]);
  }

  else if(STATE.module === 'courses'){
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved')
      .filter(t => t.itemType === 'course' || !t.itemType);

    const byCourse = {};
    Object.values(S.courses).forEach(c => {
      byCourse[c.id] = {
        id:c.id, name:c.name||'', price:num(c.price),
        priceType: num(c.price) > 0 ? 'paid' : 'free',
        subfolders: Object.values(S.subfolders).filter(s=>s.courseId===c.id).length,
        videos: Object.values(S.videos).filter(v=>v.courseId===c.id).length,
        docs: Object.values(S.docs).filter(d=>d.courseId===c.id).length,
        enrollments:0, revenue:0, students:[]
      };
    });
    txApproved.forEach(t => {
      const c = byCourse[t.itemId];
      if(!c) return;
      c.enrollments += 1;
      c.revenue += num(t.amount);
      c.students.push({ name:t.userName||'', email:t.userEmail||'', amount:num(t.amount) });
    });
    const rows = Object.values(byCourse).sort((a,b)=>b.revenue-a.revenue);

    addSheet('Overview', [
      ...infoRows,
      ['Courses', rows.length],
      ['Total Enrollments', rows.reduce((s,r)=>s+r.enrollments,0)],
      ['Total Revenue', rows.reduce((s,r)=>s+r.revenue,0).toFixed(2)]
    ]);
    addSheet('Courses', [
      ['#','Course','Type','Price','Enrollments','Revenue','Subfolders','Videos','Docs'],
      ...rows.map((r,i)=>[
        i+1, r.name, r.priceType, r.price.toFixed(2),
        r.enrollments, r.revenue.toFixed(2),
        r.subfolders, r.videos, r.docs
      ])
    ]);
    const stRows = [['Course','Student','Email','Amount (ZMW)']];
    rows.forEach(r => r.students.forEach(s =>
      stRows.push([r.name, s.name, s.email, s.amount.toFixed(2)])));
    addSheet('Students per Course', stRows);
  }

  else if(STATE.module === 'subfolders'){
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved')
      .filter(t => t.itemType === 'subfolder');

    const bySub = {};
    Object.values(S.subfolders).forEach(sf => {
      const parent = S.courses[sf.courseId];
      bySub[sf.id] = {
        id:sf.id, name:sf.name||'',
        courseName: parent?.name||'',
        price:num(sf.price),
        priceType: num(sf.price) > 0 ? 'paid' : 'free',
        videos: Object.values(S.videos).filter(v=>v.subfolderId===sf.id).length,
        docs: Object.values(S.docs).filter(d=>d.subfolderId===sf.id).length,
        purchases:0, revenue:0, students:[]
      };
    });
    txApproved.forEach(t => {
      const s = bySub[t.itemId];
      if(!s) return;
      s.purchases += 1;
      s.revenue += num(t.amount);
      s.students.push({ name:t.userName||'', email:t.userEmail||'', amount:num(t.amount) });
    });
    const rows = Object.values(bySub).sort((a,b)=>b.revenue-a.revenue);

    addSheet('Overview', [
      ...infoRows,
      ['Subfolders', rows.length],
      ['Total Purchases', rows.reduce((s,r)=>s+r.purchases,0)],
      ['Total Revenue', rows.reduce((s,r)=>s+r.revenue,0).toFixed(2)]
    ]);
    addSheet('Subfolders', [
      ['#','Subfolder','Parent Course','Type','Price','Purchases','Revenue','Videos','Docs'],
      ...rows.map((r,i)=>[
        i+1, r.name, r.courseName, r.priceType,
        r.price.toFixed(2), r.purchases, r.revenue.toFixed(2),
        r.videos, r.docs
      ])
    ]);
    const stRows = [['Subfolder','Course','Student','Email','Amount (ZMW)']];
    rows.forEach(r => r.students.forEach(s =>
      stRows.push([r.name, r.courseName, s.name, s.email, s.amount.toFixed(2)])));
    addSheet('Students per Subfolder', stRows);
  }

  else if(STATE.module === 'lectureDash'){
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved')
      .filter(t => t.itemType === 'course' || t.itemType === 'subfolder');

    const ownerIdx = {};
    Object.entries(S.courses).forEach(([id,c])=>{ if(c.lecturerId) ownerIdx[id]=c.lecturerId; });
    Object.entries(S.subfolders).forEach(([id,s])=>{ if(s.lecturerId) ownerIdx[id]=s.lecturerId; });

    const byL = {};
    lectArr.forEach(l => {
      byL[l.id] = {
        id:l.id, name:l.name||'', email:l.email||'',
        status:l.status||'pending', banned:!!l.banned,
        accessExpiresAt:l.accessExpiresAt||null,
        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length,
        videos: Object.values(S.videos).filter(v=>v.lecturerId===l.id).length,
        docs: Object.values(S.docs).filter(d=>d.lecturerId===l.id).length,
        assessments: Object.values(S.assessments).filter(a=>a.lecturerId===l.id).length,
        sales:0, revenue:0, students:new Set()
      };
    });
    txApproved.forEach(t => {
      const owner = ownerIdx[t.itemId];
      if(!owner || !byL[owner]) return;
      byL[owner].sales += 1;
      byL[owner].revenue += num(t.amount);
      if(t.userId) byL[owner].students.add(t.userId);
    });
    const rows = Object.values(byL).map(r => ({...r, uniqueStudents:r.students.size}))
      .sort((a,b)=>b.revenue-a.revenue);

    addSheet('Overview', [
      ...infoRows,
      ['Lecturers', rows.length],
      ['Total Sales', rows.reduce((s,r)=>s+r.sales,0)],
      ['Total Revenue', rows.reduce((s,r)=>s+r.revenue,0).toFixed(2)]
    ]);
    addSheet('Lecturers', [
      ['#','Lecturer','Email','Status','Banned','Courses','Videos','Docs','Assessments','Sales','Unique Students','Revenue'],
      ...rows.map((r,i)=>[
        i+1, r.name, r.email, r.status,
        r.banned?'Yes':'No',
        r.courses, r.videos, r.docs, r.assessments,
        r.sales, r.uniqueStudents, r.revenue.toFixed(2)
      ])
    ]);
  }

  else if(STATE.module === 'express'){
    const orders = Object.values(S.expressOrders).filter(o => inRange(o.createdAt));
    const payments = Object.values(S.expressPayments).filter(p => inRange(p.createdAt));

    const prodUnits = {};
    orders.forEach(o => {
      (o.items||[]).forEach(it => {
        const key = it.productId || it.name;
        if(!prodUnits[key]) prodUnits[key] = { name: it.name||'', units:0, revenue:0 };
        prodUnits[key].units += num(it.qty) || 1;
        prodUnits[key].revenue += num(it.price)*(num(it.qty)||1);
      });
    });
    const topProducts = Object.values(prodUnits).sort((a,b)=>b.units-a.units);

    addSheet('Overview', [
      ...infoRows,
      ['Orders', orders.length],
      ['Revenue', orders.filter(o=>o.status==='completed'||o.status==='collected').reduce((s,o)=>s+num(o.total),0).toFixed(2)],
      ['Pending Payments', payments.filter(p=>p.status==='pending').length],
      ['Approved Payments', payments.filter(p=>p.status==='approved').length],
      ['Rejected Payments', payments.filter(p=>p.status==='rejected').length]
    ]);
    addSheet('Orders', [
      ['Order ID','Customer','Email','Phone','Items','Total','Status','Date'],
      ...orders.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(o=>[
        o.id, o.customerName||'', o.customerEmail||'', o.customerPhone||'',
        (o.items||[]).map(i=>`${i.name} x${i.qty}`).join(' | '),
        num(o.total).toFixed(2), o.status||'', fmtDate(o.createdAt)
      ])
    ]);
    addSheet('Payments', [
      ['Payment ID','Customer','Email','Product','Amount','Status','Date'],
      ...payments.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p=>[
        p.id, p.customerName||'', p.customerEmail||'',
        p.productName||'', num(p.amount).toFixed(2),
        p.status||'', fmtDate(p.createdAt)
      ])
    ]);
    addSheet('Top Products', [
      ['#','Product','Units Sold','Revenue'],
      ...topProducts.map((p,i)=>[i+1, p.name, p.units, p.revenue.toFixed(2)])
    ]);
  }

  else if(STATE.module === 'assessments'){
    const assArr = [...Object.values(S.assessments), ...Object.values(S.lecturerAssessments)];
    const respArr = [...Object.values(S.assessmentResponses), ...Object.values(S.lecturerResponses)]
      .filter(r => inRange(r.submittedAt || r.startedAt || r.endedAt));

    const rows = assArr.map(a => {
      const resps = respArr.filter(r => r.assessmentId === a.id);
      const completed = resps.filter(r => r.status==='completed'||r.status==='ended');
      const passed = completed.filter(r => {
        const total = num(a.totalMarks);
        const pct = total > 0 ? (num(r.score)/total)*100 : 0;
        return pct >= num(a.passingScore||50);
      });
      return {
        name:a.name||'', type:a.type||'test', status:a.status||'draft',
        duration:a.duration||'', totalMarks:num(a.totalMarks),
        attempts: resps.length, completed: completed.length,
        passed: passed.length, failed: completed.length - passed.length
      };
    }).sort((a,b)=>b.attempts-a.attempts);

    addSheet('Overview', [
      ...infoRows,
      ['Assessments', rows.length],
      ['Total Attempts', rows.reduce((s,r)=>s+r.attempts,0)],
      ['Total Completed', rows.reduce((s,r)=>s+r.completed,0)],
      ['Total Passed', rows.reduce((s,r)=>s+r.passed,0)],
      ['Total Failed', rows.reduce((s,r)=>s+r.failed,0)]
    ]);
    addSheet('Assessments', [
      ['#','Name','Type','Status','Duration','Marks','Attempts','Completed','Passed','Failed'],
      ...rows.map((r,i)=>[
        i+1, r.name, r.type, r.status, r.duration,
        r.totalMarks, r.attempts, r.completed, r.passed, r.failed
      ])
    ]);
  }

  else if(STATE.module === 'students'){
    const usersArr = Object.entries(S.users).map(([id,d])=>({id,...d}));
    const banned = Object.entries(S.bannedUsers).filter(([,v])=>v).map(([id])=>id);
    const txApproved = dedupeTx(buildAllTx())
      .filter(t => inRange(t.timestamp) && t.status === 'approved');

    const byStudent = {};
    usersArr.forEach(u => {
      byStudent[u.id] = {
        name: `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
        email: u.email||'', phone: u.phone||'',
        banned: banned.includes(u.id),
        purchases:0, spend:0, courses:0, subfolders:0, shop:0
      };
    });
    txApproved.forEach(t => {
      const s = byStudent[t.userId];
      if(!s) return;
      s.purchases += 1;
      s.spend += num(t.amount);
      const type = (t.itemType||'course').toLowerCase();
      if(type === 'course') s.courses += 1;
      else if(type === 'subfolder') s.subfolders += 1;
      else if(type === 'shop') s.shop += 1;
    });
    const rows = Object.values(byStudent).sort((a,b)=>b.spend-a.spend);

    addSheet('Overview', [
      ...infoRows,
      ['Students', rows.length],
      ['Total Purchases', rows.reduce((s,r)=>s+r.purchases,0)],
      ['Total Spend', rows.reduce((s,r)=>s+r.spend,0).toFixed(2)]
    ]);
    addSheet('Students', [
      ['#','Name','Email','Phone','Purchases','Courses','Subfolders','Shop','Spend','Banned'],
      ...rows.map((r,i)=>[
        i+1, r.name, r.email, r.phone,
        r.purchases, r.courses, r.subfolders, r.shop,
        r.spend.toFixed(2), r.banned?'Yes':'No'
      ])
    ]);
  }

  else if(STATE.module === 'lecturers'){
    const now = Date.now();
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));

    const rows = lectArr.map(l => {
      let status = l.status||'pending';
      if(l.banned) status = 'banned';
      else if(l.status === 'approved' && (!l.accessExpiresAt || l.accessExpiresAt > now)) status = 'active';
      else if(l.status === 'approved' && l.accessExpiresAt && l.accessExpiresAt <= now) status = 'expired';
      return {
        name:l.name||'', email:l.email||'', phone:l.phone||'',
        nrc:l.nrcNumber||'', college:l.collegeName||'',
        city:l.city||'', town:l.town||'', address:l.address||'',
        status, banned: !!l.banned,
        accessExpiresAt: l.accessExpiresAt||null,
        paidAmount: num(l.paidAmount),
        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length,
        videos: Object.values(S.videos).filter(v=>v.lecturerId===l.id).length,
        docs: Object.values(S.docs).filter(d=>d.lecturerId===l.id).length,
        assessments: Object.values(S.assessments).filter(a=>a.lecturerId===l.id).length
      };
    });

    addSheet('Overview', [
      ...infoRows,
      ['Lecturers', rows.length],
      ['Active', rows.filter(r=>r.status==='active').length],
      ['Pending', rows.filter(r=>r.status==='pending').length],
      ['Expired', rows.filter(r=>r.status==='expired').length],
      ['Banned', rows.filter(r=>r.status==='banned').length],
      ['Total Subscriptions', rows.reduce((s,r)=>s+r.paidAmount,0).toFixed(2)]
    ]);
    addSheet('Lecturers', [
      ['#','Name','Email','Phone','NRC','College','City','Town','Status','Banned','Expires','Paid','Courses','Videos','Docs','Assessments'],
      ...rows.map((r,i)=>[
        i+1, r.name, r.email, r.phone, r.nrc,
        r.college, r.city, r.town, r.status,
        r.banned?'Yes':'No',
        r.accessExpiresAt ? new Date(r.accessExpiresAt).toLocaleString() : 'Lifetime',
        r.paidAmount.toFixed(2),
        r.courses, r.videos, r.docs, r.assessments
      ])
    ]);
  }

  XLSX.writeFile(wb, `UTOM-${STATE.module}-${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel downloaded','success');
}

console.log('✅ UTOM Reports Studio loaded.');
</script>
</body>
</html>
