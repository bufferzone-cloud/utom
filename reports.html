<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<title>UTOM · Reports Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#F5B042;--gold-d:#c47f1a;--orange:#ff6b00;
  --bg:#f4f6fa;--text:#12141d;--sub:#5f6377;--muted:#8b8fa3;
  --line:rgba(224,228,236,.9);--card:#ffffff;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;
  --purple:#8b5cf6;--pink:#ec4899;--cyan:#06b6d4;--slate:#64748b;
  --sh-xs:0 1px 3px rgba(16,20,40,.04);
  --sh-sm:0 2px 8px rgba(16,20,40,.05);
  --sh-md:0 8px 24px rgba(16,20,40,.08);
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --t:.2s cubic-bezier(.25,.46,.45,.94);
  --app-h:100dvh;
}
@supports not (height:100dvh){:root{--app-h:100vh}}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,sans-serif}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(245,176,66,.4);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:14px;z-index:9999;transition:opacity .5s}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:4px solid #e5e7eb;border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-weight:700;color:var(--sub);font-size:13px}

.loading-overlay{position:fixed;inset:0;background:rgba(244,246,250,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:5000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.loading-overlay .spinner{width:48px;height:48px}
.loading-overlay p{font-weight:700;color:var(--sub);font-size:13px}
.loading-overlay small{font-size:11px;color:var(--muted)}

.app{display:flex;flex-direction:column;height:var(--app-h);overflow:hidden}

.header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 18px;height:60px;flex-shrink:0;background:#fff;
  border-bottom:1px solid var(--line);z-index:40}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.icon-btn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:1px solid var(--line);
  background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;
  cursor:pointer;transition:var(--t);color:var(--text);text-decoration:none}
.icon-btn:hover{background:#f8fafc;border-color:var(--gold);color:var(--gold-d)}
.header-title{font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.header-title small{font-size:11px;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0}

.overlay{position:fixed;inset:0;background:rgba(15,20,40,.4);backdrop-filter:blur(4px);
  z-index:800;display:none}
.overlay.open{display:block}
.sidebar{position:fixed;top:0;left:-340px;width:300px;max-width:86vw;height:var(--app-h);
  background:#fff;backdrop-filter:blur(20px);z-index:900;
  box-shadow:8px 0 40px rgba(0,0,0,.10);transition:left .3s cubic-bezier(.25,.46,.45,.94);
  display:flex;flex-direction:column;overflow:hidden}
.sidebar.open{left:0}
.sb-head{padding:22px 20px 16px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;flex-shrink:0}
.sb-head .brand{font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#d4952a,#f5b042,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-.5px}
.sb-head .tag{font-size:9px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.sb-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
  background:#f5f6f8;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;color:#555;border:none;transition:var(--t)}
.sb-close:hover{background:#ef4444;color:#fff;transform:rotate(90deg)}
.sb-body{flex:1;overflow-y:auto;padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;
  cursor:pointer;transition:var(--t);color:var(--text);font-weight:600;font-size:13px;
  background:transparent;border:none;width:100%;text-align:left}
.nav:hover{background:#f8fafc}
.nav i{font-size:16px;width:20px;text-align:center;color:var(--slate);transition:color .2s}
.nav.active{background:rgba(245,176,66,.13);color:var(--gold-d)}
.nav.active i{color:var(--gold-d)}
.divider{height:1px;background:var(--line);margin:6px 8px}

.main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 90px}

.hero{background:#fff;border-radius:var(--r-lg);padding:20px 22px 18px;
  box-shadow:var(--sh-sm);border:1px solid var(--line);margin-bottom:14px;
  position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,#d4952a,#f5b042,#ff6b00)}
.hero h1{font-size:19px;font-weight:800;letter-spacing:-.4px;
  display:flex;align-items:center;gap:10px;margin-bottom:4px}
.hero h1 i{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#fff8ed,#fef3e2);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-d);font-size:16px}
.hero p{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:14px}

.range-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.range-btn{padding:8px 16px;border-radius:24px;border:1.5px solid var(--line);
  background:#fff;font-weight:700;font-size:11.5px;color:var(--sub);
  cursor:pointer;transition:var(--t);display:inline-flex;align-items:center;gap:6px}
.range-btn:hover{border-color:var(--gold);color:var(--gold-d)}
.range-btn.active{background:linear-gradient(135deg,#f5b042,#ff6b00);color:#fff;
  border-color:transparent;box-shadow:0 3px 14px rgba(245,176,66,.32)}

.custom-box{display:none;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.custom-box.show{display:flex}
.custom-box input{flex:1;min-width:120px;padding:9px 14px;border-radius:24px;
  border:1.5px solid var(--line);background:#fbfcfd;font-size:12px;color:var(--text);
  outline:none;transition:var(--t)}
.custom-box input:focus{border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 4px rgba(245,176,66,.10)}

.action-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;
  cursor:pointer;font-weight:700;border-radius:24px;transition:var(--t);
  white-space:nowrap;font-size:11.5px;padding:9px 16px}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-primary{background:linear-gradient(135deg,#f5b042,#ff6b00);color:#fff;
  box-shadow:0 3px 14px rgba(245,176,66,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,176,66,.32)}
.btn-green{background:#10b981;color:#fff;box-shadow:0 3px 14px rgba(16,185,129,.25)}
.btn-green:hover{background:#059669}
.btn-red{background:#ef4444;color:#fff;box-shadow:0 3px 14px rgba(239,68,68,.25)}
.btn-red:hover{background:#dc2626}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-d)}

.range-display{font-size:11px;color:var(--muted);margin-top:10px;
  background:rgba(245,176,66,.08);padding:7px 14px;border-radius:20px;
  display:inline-block;font-weight:600}
.range-display strong{color:var(--gold-d)}

.section{background:#fff;border-radius:var(--r-md);border:1px solid var(--line);
  box-shadow:var(--sh-xs);margin-bottom:12px;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px;cursor:pointer;user-select:none;transition:background .15s}
.section-head:hover{background:#fbfcfd}
.section-head h3{font-size:11.5px;font-weight:800;
  display:flex;align-items:center;gap:9px;flex:1;min-width:0;text-transform:uppercase;
  color:var(--sub);letter-spacing:.5px}
.section-head h3 i{color:var(--gold-d);font-size:13px}
.section-head h3 .count{font-size:10.5px;font-weight:700;color:var(--gold-d);
  background:rgba(245,176,66,.14);padding:2px 9px;border-radius:12px;margin-left:4px;
  text-transform:none;letter-spacing:0}
.section-head .chev{width:26px;height:26px;border-radius:50%;
  background:#f5f6f8;display:flex;align-items:center;justify-content:center;
  color:var(--slate);font-size:11px;transition:transform .25s;flex-shrink:0}
.section.open .section-head .chev{transform:rotate(180deg);background:rgba(245,176,66,.15);
  color:var(--gold-d)}
.section-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.25,.46,.45,.94)}
.section.open .section-body{max-height:50000px}
.section-body-inner{padding:0 18px 18px}

.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:8px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 14px 12px;position:relative;overflow:hidden;transition:var(--t)}
.kpi:hover{box-shadow:var(--sh-sm)}
.kpi .icon{font-size:15px;color:var(--muted);margin-bottom:6px}
.kpi .num{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.15;
  word-break:break-word;color:var(--text)}
.kpi .lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;margin-top:3px}
.kpi.gold{border-color:rgba(245,176,66,.3);background:linear-gradient(135deg,#fffdf8,#fff8ed)}
.kpi.gold .icon{color:var(--gold-d)}
.kpi.green{border-color:rgba(16,185,129,.3);background:linear-gradient(135deg,#f7fefb,#eefdf6)}
.kpi.green .icon{color:var(--green)}
.kpi.red{border-color:rgba(239,68,68,.3);background:linear-gradient(135deg,#fff8f8,#fef1f1)}
.kpi.red .icon{color:var(--red)}
.kpi.blue{border-color:rgba(59,130,246,.3);background:linear-gradient(135deg,#f6faff,#eff6ff)}
.kpi.blue .icon{color:var(--blue)}
.kpi.purple{border-color:rgba(139,92,246,.3);background:linear-gradient(135deg,#faf8ff,#f5f3ff)}
.kpi.purple .icon{color:var(--purple)}
.kpi.yellow{border-color:rgba(245,158,11,.3);background:linear-gradient(135deg,#fffcf2,#fef8ec)}
.kpi.yellow .icon{color:var(--yellow)}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;margin-bottom:14px}
.stat-tile{background:#f9fafc;border-radius:var(--r-sm);padding:12px 14px;
  border:1px solid var(--line)}
.stat-tile .lbl{font-size:10.5px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.stat-tile .val{font-size:16px;font-weight:800;color:var(--text)}
.stat-tile .bar{height:5px;background:rgba(224,228,236,.8);border-radius:20px;
  margin-top:8px;overflow:hidden}
.stat-tile .bar > div{height:100%;border-radius:20px;
  background:linear-gradient(90deg,#f5b042,#ff6b00);transition:width .6s}
.stat-tile .sub{font-size:10px;color:#8b8fa3;margin-top:6px}

.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--line);
  background:#fff;-webkit-overflow-scrolling:touch}
table.rpt{width:100%;border-collapse:collapse;font-size:12px;min-width:480px;background:#fff}
table.rpt th{background:#fafbfd;padding:10px 12px;text-align:left;
  font-weight:700;color:var(--slate);font-size:10px;text-transform:uppercase;
  letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rpt td{padding:10px 12px;border-bottom:1px solid #f3f5f9;color:var(--text);
  vertical-align:middle}
table.rpt tr:last-child td{border-bottom:none}
table.rpt tbody tr:hover td{background:#fcfdfe}
table.rpt tbody tr.clickable{cursor:pointer}
table.rpt tbody tr.clickable:hover td{background:#fffdf7}
table.rpt td.right,table.rpt th.right{text-align:right}
table.rpt td.center,table.rpt th.center{text-align:center}
table.rpt .money{font-weight:700;color:var(--text)}
table.rpt .muted{color:var(--muted);font-size:11px}
table.rpt .rank{font-weight:800;color:var(--gold-d);width:32px;font-size:11px}
table.rpt .pill{display:inline-block;padding:3px 10px;border-radius:12px;
  font-size:10px;font-weight:700;text-transform:capitalize;letter-spacing:.2px}
.pill-approved{background:#ecfdf5;color:#065f46}
.pill-pending{background:#fef9ec;color:#92400e}
.pill-rejected{background:#fef2f2;color:#991b1b}
.pill-cancelled{background:#f1f5f9;color:#475569}
.pill-completed{background:#ecfeff;color:#155e75}
.pill-active{background:#eff6ff;color:#1e40af}
.pill-banned{background:#7f1d1d;color:#fff}
.pill-confirmed{background:#eff6ff;color:#1d4ed8}
.pill-ready{background:#ecfdf5;color:#047857}
.pill-collected{background:#eef2ff;color:#3730a3}
.pill-draft{background:#f1f5f9;color:#475569}
.pill-scheduled{background:#eef2ff;color:#4338ca}
.pill-published{background:#ecfdf5;color:#047857}
.pill-free{background:#eff6ff;color:#1d4ed8}
.pill-paid{background:#fef3c7;color:#92400e}
.pill-course{background:#eff6ff;color:#1d4ed8}
.pill-subfolder{background:#f5f3ff;color:#6d28d9}
.pill-shop{background:#fce7f3;color:#9d174d}
.pill-pass{background:#ecfdf5;color:#047857}
.pill-fail{background:#fef2f2;color:#991b1b}
.pill-exam{background:#fef2f2;color:#991b1b}
.pill-test{background:#fef9ec;color:#92400e}
.pill-quiz{background:#eff6ff;color:#1e40af}
.pill-assignment{background:#f5f3ff;color:#6d28d9}
.pill-started{background:#fef9ec;color:#92400e}
.pill-ongoing{background:#fef9ec;color:#92400e}
.pill-ended{background:#f1f5f9;color:#475569}
.pill-mastered{background:#ecfdf5;color:#047857}
.pill-borderline{background:#fef9ec;color:#92400e}

.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:12px}
.empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.3}
.empty p{margin-top:2px;font-size:11px}

.bar-list{display:flex;flex-direction:column;gap:2px;padding:2px 0}
.bar-item{display:grid;grid-template-columns:24px 1fr auto;gap:10px;
  align-items:center;padding:7px 4px;border-bottom:1px solid #f3f5f9;font-size:12px;
  cursor:pointer;border-radius:6px;transition:background .15s}
.bar-item:hover{background:#fffdf7}
.bar-item:last-child{border-bottom:none}
.bar-item .n{font-weight:800;color:var(--gold-d);font-size:11px}
.bar-item .body{min-width:0}
.bar-item .body .title{font-weight:600;color:var(--text);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.bar-item .body .meta{font-size:10px;color:var(--muted);margin-bottom:4px}
.bar-item .body .bar-track{height:4px;background:#f1f5f9;border-radius:20px;overflow:hidden}
.bar-item .body .bar-track > span{display:block;height:100%;border-radius:20px;
  background:linear-gradient(90deg,#f5b042,#ff6b00);transition:width .5s}
.bar-item .val{font-weight:800;color:var(--text);font-size:11.5px;
  white-space:nowrap;text-align:right}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.two-col{grid-template-columns:1fr}}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;margin-bottom:12px}
.filters select,.filters input{width:100%;padding:9px 14px;border-radius:24px;
  border:1.5px solid var(--line);background:#fbfcfd;font-size:12px;
  color:var(--text);outline:none;transition:var(--t);-webkit-appearance:none;
  appearance:none;font-family:inherit}
.filters select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path fill='%238b8fa3' d='M5.5 7L0 0h11z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
.filters select:focus,.filters input:focus{border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 4px rgba(245,176,66,.10)}

.summary-line{font-size:11.5px;color:var(--sub);padding:9px 14px;
  background:#f9fafc;border-left:3px solid var(--gold);border-radius:6px;
  margin-bottom:12px;line-height:1.55}
.summary-line strong{color:var(--text)}

/* PASS/FAIL SPECIFIC */
.grade-ring{width:56px;height:56px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:900;
  color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.10)}
.grade-ring.excellent{background:linear-gradient(135deg,#10b981,#059669)}
.grade-ring.good{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.grade-ring.pass{background:linear-gradient(135deg,#f5b042,#d4952a)}
.grade-ring.fail{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.grade-ring.absent{background:linear-gradient(135deg,#94a3b8,#64748b)}
.grade-ring .pct{font-size:9px;font-weight:700;opacity:.85;display:block;margin-top:-2px}

.dist-chart{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.dist-row{display:grid;grid-template-columns:60px 1fr 50px;gap:10px;align-items:center;
  font-size:11px;padding:4px 0}
.dist-row .lbl{font-weight:700;color:var(--slate);text-align:right}
.dist-row .track{height:14px;background:#f1f5f9;border-radius:10px;overflow:hidden;position:relative}
.dist-row .fill{height:100%;border-radius:10px;
  background:linear-gradient(90deg,#f5b042,#ff6b00);transition:width .5s;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:6px;color:#fff;font-size:9px;font-weight:700}
.dist-row .fill.green{background:linear-gradient(90deg,#10b981,#059669)}
.dist-row .fill.red{background:linear-gradient(90deg,#ef4444,#b91c1c)}
.dist-row .fill.blue{background:linear-gradient(90deg,#3b82f6,#2563eb)}
.dist-row .fill.yellow{background:linear-gradient(90deg,#f59e0b,#d97706)}
.dist-row .cnt{font-weight:700;color:var(--text);text-align:right}

.modal-overlay{position:fixed;inset:0;background:rgba(15,20,40,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:9998;display:none;align-items:flex-end;justify-content:center;
  padding:0;animation:fadeIn .2s ease}
.modal-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#fff;width:100%;max-width:760px;max-height:90vh;
  border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;
  animation:slideUp .3s cubic-bezier(.25,.46,.45,.94);box-shadow:0 -8px 40px rgba(0,0,0,.15)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (min-width:760px){
  .modal-overlay{align-items:center;padding:20px}
  .modal-box{border-radius:24px;max-height:88vh}
}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fffdf8,#fff8ed);flex-shrink:0}
.modal-head h2{font-size:15px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-head .sub{font-size:11px;color:var(--muted);font-weight:600}

<script type="module">
/* =================================================================
   FIREBASE
================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHiQHbATgnQIIB9X-gOM5XdmRbOsUJoBQ",
  authDomain: "utom-c4003.firebaseapp.com",
  databaseURL: "https://utom-c4003-default-rtdb.firebaseio.com",
  projectId: "utom-c4003",
  storageBucket: "utom-c4003.firebasestorage.app",
  messagingSenderId: "878225874050",

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

/* =================================================================
   STATE (mirrors the exact paths used in admin.html)
================================================================= */
const S = {
  courses:{}, subfolders:{}, videos:{}, docs:{}, users:{}, promos:{},
  registers:{}, assessments:{}, assessmentResponses:{}, assessmentFolders:{},
  lecturerRegisters:{}, lecturerAssessments:{}, lecturerResponses:{},
  transactions:{}, pendingPurchases:{}, approvedPurchases:{},
  lecturerPendingPurchases:{}, lecturerApprovedPurchases:{},
  bannedUsers:{}, expressProducts:{}, expressOrders:{}, expressPayments:{},
  expressCategories:{}, expressPickupLocations:{}, expressSettings:{},
  lecturerData:{}, notifications:{}, paperDrafts:{}
};

const STATE = {
  module:'overview',
  range:'all',           // default to all-time so pass/fail is comprehensive
  startTs:0, endTs:Date.now(),
  filters:{
    passFail:{ typeFilter:'all', outcome:'all', search:'' },
    assessmentResults:{ type:'all', sortBy:'date-desc', search:'' },
    studentPerformance:{ outcome:'all', sortBy:'average-desc', search:'' },
    registerPerformance:{ sortBy:'avg-desc', search:'' },
    bestSellers:{ typeFilter:'all', search:'' },
    enrollments:{ status:'all', search:'' },
    contentSales:{ paymentStatus:'approved', typeFilter:'all', sortBy:'revenue-desc', search:'' },
    lectureDash:{ status:'all', sortBy:'earnings-desc', search:'' },
    express:{ status:'all', sortBy:'date-desc', search:'' },
    students:{ status:'all', sortBy:'spend-desc', search:'' },
    lecturers:{ status:'all', sortBy:'date-desc', search:'' }
  },
  open:{}
};
let currentAdmin = null;

/* =================================================================
   HELPERS
================================================================= */
const _ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const _RE = /[&<>"']/g;
const esc = s => s == null ? '' : String(s).replace(_RE, c => _ESC[c]);
const num = v => Number(v) || 0;
const money = v => 'ZMW ' + (Number(v)||0).toFixed(2);
const moneyShort = v => {
  const n = Number(v) || 0;
  if(n >= 1000000) return 'ZMW ' + (n/1000000).toFixed(1) + 'M';
  if(n >= 1000)    return 'ZMW ' + (n/1000).toFixed(1) + 'k';
  return 'ZMW ' + n.toFixed(0);
};
const fmtDate = ts => ts ? new Date(ts).toLocaleString() : '—';
const pct = (a,b) => b > 0 ? Math.round((a/b)*100) : 0;

function toast(msg, type){
  const c = document.createElement('div');
  c.style.cssText = `position:fixed;top:74px;right:16px;z-index:9999;
    background:#12141d;color:#fff;padding:11px 18px;border-radius:22px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:12px;font-weight:600;
    border-left:3px solid ${type==='error'?'#ef4444':type==='success'?'#10b981':'#F5B042'};
    max-width:320px`;
  c.textContent = msg;
  document.body.appendChild(c);
  setTimeout(()=>c.remove(), 3000);
}
function showLoading(text, sub){
  document.getElementById('loadingText').textContent = text || 'Processing…';
  document.getElementById('loadingSub').textContent = sub || 'Fetching all records';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading(){
  document.getElementById('loadingOverlay').classList.remove('show');
}

/* =================================================================
   MODAL
================================================================= */
function openModal(title, sub, bodyHtml){
  document.getElementById('detailModalTitle').textContent = title || 'Details';
  document.getElementById('detailModalSub').textContent = sub || '';
  document.getElementById('detailModalBody').innerHTML = bodyHtml || '';

}
function closeModal(){
  document.getElementById('detailModal').classList.remove('open');
}
document.getElementById('detailModalClose').addEventListener('click', closeModal);
document.getElementById('detailModal').addEventListener('click', e => {
  if(e.target.id === 'detailModal') closeModal();
});
window.__closeModal = closeModal;

/* =================================================================
   AUTH
================================================================= */
onAuthStateChanged(auth, user => {
  if(!user){ window.location.href = 'index.html'; return; }
  if(!user.email?.startsWith('admin@')){ alert('Admin only.'); signOut(auth); return; }
  currentAdmin = user;
  attachListeners();
});

/* =================================================================
   DATA LISTENERS — mirror the paths from admin.html
================================================================= */
let readyCount = 0;
function attachListeners(){
  const pathMap = {
    courses:'courses', subfolders:'subfolders', videos:'videos',
    docs:'docs', users:'users', promos:'promos',
    registers:'registers', assessments:'assessments',
    assessmentResponses:'assessmentResponses',
    assessmentFolders:'assessmentFolders',
    lecturerRegisters:'lecturerRegisters',
    lecturerAssessments:'lecturerAssessments',
    lecturerResponses:'lecturerResponses',
    transactions:'transactions',
    pendingPurchases:'pendingPurchases',
    approvedPurchases:'approvedPurchases',
    lecturerPendingPurchases:'lecturerPendingPurchases',
    lecturerApprovedPurchases:'lecturerApprovedPurchases',
    bannedUsers:'bannedUsers',
    expressProducts:'expressProducts',
    expressOrders:'expressOrders',
    expressPayments:'expressPayments',
    expressCategories:'expressCategories',
    expressPickupLocations:'expressPickupLocations',
    expressSettings:'expressSettings',
    lecturers:'lecturerData',           // ← exact path from admin
    notifications:'notifications',
    paperDrafts:'paperDrafts'
  };
  const paths = Object.keys(pathMap);
  const total = paths.length;
  paths.forEach(p => {
    onValue(ref(db, p), snap => {
      S[pathMap[p]] = snap.val() || {};
      readyCount++;
      if(readyCount >= Math.min(total, 15)){
        document.getElementById('loader').classList.add('hidden');
        render();
      }
    }, ()=>{});
  });
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hidden');
    render();
  }, 3500);
}

/* =================================================================
   RANGE
================================================================= */
function computeRange(){
  const now = new Date();
  switch(STATE.range){
    case 'today':
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
      STATE.endTs = now.getTime(); break;
    case 'week': {
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),diff,0,0,0).getTime();
      STATE.endTs = now.getTime(); break;
    }
    case 'month':
      STATE.startTs = new Date(now.getFullYear(),now.getMonth(),1).getTime();
      STATE.endTs = now.getTime(); break;
    case 'year':
      STATE.startTs = new Date(now.getFullYear(),0,1).getTime();
      STATE.endTs = now.getTime(); break;
    case 'all':
      STATE.startTs = 0; STATE.endTs = now.getTime(); break;
  }
}
function inRange(ts){
  if(!ts) return STATE.range === 'all';
  return ts >= STATE.startTs && ts <= STATE.endTs;
}
function rangeLabel(){
  if(STATE.range === 'all') return 'All Time';
  return `${new Date(STATE.startTs).toLocaleDateString()} → ${new Date(STATE.endTs).toLocaleDateString()}`;
}

/* =================================================================
   DUAL-SOURCE HELPERS
================================================================= */
function allAssessmentsCombined(){
  const out = [];
  Object.entries(S.assessments).forEach(([id,a]) =>
    out.push({ id, ...a, _source:'admin' }));
  Object.entries(S.lecturerAssessments).forEach(([id,a]) =>
    out.push({ id, ...a, _source:'lecturer' }));
  return out;
}
function allResponsesCombined(){
  const out = [];
  Object.entries(S.assessmentResponses).forEach(([id,r]) =>
    out.push({ id, ...r, _source:'admin' }));
  Object.entries(S.lecturerResponses).forEach(([id,r]) =>
    out.push({ id, ...r, _source:'lecturer' }));
  return out;
}
function allRegistersCombined(){
  const out = [];
  Object.entries(S.registers).forEach(([id,r]) =>
    out.push({ id, ...r, _source:'admin' }));
  Object.entries(S.lecturerRegisters).forEach(([id,r]) =>
    out.push({ id, ...r, _source:'lecturer' }));
  return out;
}

/* =================================================================
   USER/ITEM LOOKUPS
================================================================= */
function buildLookups(){
  const itemById = {};
  Object.entries(S.courses).forEach(([id,c]) => {
    itemById[id] = {
      id, name:c.name||'Unnamed', type:'course', parent:'',
      price:num(c.price), lecturerId:c.lecturerId||''
    };
  });
  Object.entries(S.subfolders).forEach(([id,s]) => {
    const p = S.courses[s.courseId];
    itemById[id] = {
      id, name:s.name||'Unnamed', type:'subfolder',
      parent:p?.name||'—', parentId:s.courseId||'',
      price:num(s.price), lecturerId:s.lecturerId||p?.lecturerId||''
    };
  });
  const userById = {};
  Object.entries(S.users).forEach(([id,u]) => {
    userById[id] = {
      id,
      name: `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
      email: u.email||'', phone: u.phone||''
    };
  });
  const lecturerById = {};
  Object.entries(S.lecturerData).forEach(([id,l]) => {
    lecturerById[id] = {
      id, name:l.name||'Unnamed', email:l.email||'',
      phone:l.phone||'', college:l.collegeName||'',
      status: l.banned ? 'banned' : (l.status||'pending'),
      banned: !!l.banned
    };
  });
  return { itemById, userById, lecturerById };
}

/* =================================================================
   PASS/FAIL COMPUTATION ENGINE — the core of this report
================================================================= */
/**
 * Compute the outcome of a single response against an assessment.
 * Returns: { status, score, total, percent, passed, absent }
 */
function computeResult(resp, ass){
  if(!ass) return { status:'unknown', score:0, total:0, percent:0, passed:false, absent:true };

  const score = num(resp.score);
  const total = num(ass.totalMarks) || 0;
  const passingScore = num(ass.passingScore) || 50;
  const percent = total > 0 ? Math.round((score / total) * 100) : 0;
  const passed = total > 0 && percent >= passingScore;

  // A student is "absent" if they never answered anything meaningful
  const answered = resp.answers && Object.keys(resp.answers).length > 0;
  const status = resp.status || 'started';
  const finished = status === 'completed' || status === 'ended';
  const absent = !answered && !finished;

  return {
    status,
    score,
    total,
    percent,
    passed,
    absent,
    passingScore,
    finished
  };
}

/** Grade label for a percentage. */
function gradeLabel(percent){
  if(percent >= 90) return { label:'A+', cls:'excellent' };
  if(percent >= 80) return { label:'A',  cls:'excellent' };
  if(percent >= 70) return { label:'B',  cls:'good' };
  if(percent >= 60) return { label:'C',  cls:'good' };
  if(percent >= 50) return { label:'D',  cls:'pass' };
  return { label:'F', cls:'fail' };
}

/**
 * For a given assessment, produce a full results breakdown.
 */
function getAssessmentResults(ass){
  const responses = allResponsesCombined()
    .filter(r => r.assessmentId === ass.id);
  const results = responses.map(r => ({
    resp: r,
    outcome: computeResult(r, ass)
  }));
  const finished = results.filter(x => x.outcome.finished);
  const passed   = finished.filter(x => x.outcome.passed);
  const failed   = finished.filter(x => !x.outcome.passed);
  const absent   = results.filter(x => x.outcome.absent);
  const ongoing  = results.filter(x => !x.outcome.finished && !x.outcome.absent);

  // Distribution buckets
  const buckets = { 'A (90-100)':0, 'B (80-89)':0, 'C (70-79)':0, 'D (60-69)':0, 'E (50-59)':0, 'F (<50)':0 };
  finished.forEach(x => {
    const p = x.outcome.percent;
    if(p >= 90) buckets['A (90-100)']++;
    else if(p >= 80) buckets['B (80-89)']++;
    else if(p >= 70) buckets['C (70-79)']++;
    else if(p >= 60) buckets['D (60-69)']++;
    else if(p >= 50) buckets['E (50-59)']++;
    else buckets['F (<50)']++;
  });

  // Register breakdown
  const registerMap = {};
  const regIds = ass.registerIds || (ass.registerId ? [ass.registerId] : []);
  const allRegs = allRegistersCombined();
  regIds.forEach(rid => {
    const reg = allRegs.find(r => r.id === rid);
    if(!reg) return;
    const regStudents = new Set(reg.members || []);
    const regResults = finished.filter(x => regStudents.has(x.resp.userId));
    const regPassed = regResults.filter(x => x.outcome.passed);
    const avg = regResults.length > 0
      ? Math.round(regResults.reduce((s,x)=>s+x.outcome.percent,0) / regResults.length)
      : 0;
    registerMap[rid] = {
      register: reg,
      results: regResults,
      passed: regPassed.length,
      failed: regResults.length - regPassed.length,
      avg,
      passRate: pct(regPassed.length, regResults.length)
    };
  });

  return {
    assessment: ass,
    responses,
    results,
    finished,
    passed,
    failed,
    absent,
    ongoing,
    buckets,
    passRate: pct(passed.length, finished.length),
    avgScore: finished.length > 0
      ? Math.round(finished.reduce((s,x)=>s+x.outcome.percent,0) / finished.length)
      : 0,
    registerMap
  };
}

/* =================================================================
   REVENUE / TRANSACTIONS
================================================================= */
function buildAllTx(){
  const out = [];
  Object.entries(S.transactions).forEach(([id,tx]) =>
    out.push({ id, ...tx, _src:'tx' }));
  Object.entries(S.pendingPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([tid,tx]) =>
      out.push({ id:tid, userId:uid, ...tx, _src:'pending' }));
  });
  Object.entries(S.lecturerPendingPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([tid,tx]) =>
      out.push({ id:tid, userId:uid, ...tx, _src:'lecPending' }));
  });
  Object.entries(S.approvedPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([iid,info]) => {
      out.push({
        id:'AP-'+uid+'-'+iid, userId:uid,
        itemId:iid, itemTitle:info.itemTitle||info.title||'—',
        itemType:info.itemType||'course',
        amount:num(info.amount), status:'approved',
        timestamp:info.approvedAt||info.timestamp||null,
        _src:'approved'
      });
    });
  });
  Object.entries(S.lecturerApprovedPurchases).forEach(([uid,map]) => {
    Object.entries(map||{}).forEach(([iid,info]) => {
      out.push({
        id:'LAP-'+uid+'-'+iid, userId:uid,
        itemId:iid, itemTitle:info.itemTitle||info.title||'—',
        itemType:info.itemType||'course',
        amount:num(info.amount), status:'approved',
        timestamp:info.approvedAt||info.timestamp||null,
        _src:'lecApproved'
      });
    });
  });
  Object.entries(S.expressPayments).forEach(([id,p]) => {
    out.push({
      id, userId:p.userId||'', itemId:p.orderId||id,
      itemTitle:p.productName||'Express Order',
      itemType:'shop', amount:num(p.amount),
      status:p.status||'pending', timestamp:p.createdAt||null,
      userEmail:p.customerEmail||'', userName:p.customerName||'',
      userPhone:p.customerPhone||'', screenshot:p.screenshot||'',
      provider:'MTN/Airtel', quantity:p.quantity||0,
      pickupLocationId:p.pickupLocationId||'', _src:'express'
    });
  });
  return out;
}
function dedupeTx(list){
  const m = new Map();
  list.forEach(t => {
    if(!m.has(t.id)) m.set(t.id, t);
    else {
      const cur = m.get(t.id);
      if(cur.status !== 'approved' && t.status === 'approved') m.set(t.id, t);
    }
  });
  return [...m.values()];
}
function contentTxInRange(){
  return dedupeTx(buildAllTx())
    .filter(t => inRange(t.timestamp))
    .filter(t => {
      const it = (t.itemType||'course').toLowerCase();
      return it === 'course' || it === 'subfolder';
    });
}

/* =================================================================
   COLLAPSIBLE SECTION
================================================================= */
function isOpen(key, def){
  if(!(key in STATE.open)) STATE.open[key] = def !== false;
  return STATE.open[key];
}
function toggleOpen(key){
  STATE.open[key] = !isOpen(key);
  render();
}
window.__toggleOpen = toggleOpen;

function section(key, icon, title, count, body, defaultOpen){
  const open = isOpen(key, defaultOpen !== false);
  const countHtml = (count !== undefined && count !== null && count !== '')
    ? `<span class="count">${count}</span>` : '';
  return `
    <div class="section ${open?'open':''}" data-key="${esc(key)}">
      <div class="section-head" onclick="window.__toggleOpen('${esc(key)}')">
        <h3><i class="fas ${esc(icon)}"></i> ${esc(title)} ${countHtml}</h3>
        <div class="chev"><i class="fas fa-chevron-down"></i></div>
      </div>

function barList(items, valueKey, opts = {}){
  const max = Math.max(...items.map(x => num(x[valueKey])), 1);
  return `<div class="bar-list">${items.map((it, i) => {
    const v = num(it[valueKey]);
    const p = Math.round((v / max) * 100);
    const val = opts.money ? money(v) : v.toLocaleString();
    const sub = opts.sub ? opts.sub(it) : '';
    const action = opts.onClick ? `onclick="${opts.onClick.replace('__ID__', esc(it.id||''))}"` : '';
    return `
      <div class="bar-item" ${action}>
        <span class="n">${i+1}</span>
        <div class="body">
          <div class="title">${esc(it.name || it.title || '—')}</div>
          ${sub ? `<div class="meta">${sub}</div>` : ''}
          <div class="bar-track"><span style="width:${p}%"></span></div>
        </div>
        <span class="val">${esc(val)}</span>
      </div>
    `;
  }).join('')}</div>`;
}
function gradeRing(percent, passed){
  const g = gradeLabel(percent);
  return `<div class="grade-ring ${g.cls}">${g.label}<span class="pct">${percent}%</span></div>`;
}
function distributionChart(buckets){
  const total = Object.values(buckets).reduce((s,v)=>s+v,0) || 1;
  const colors = {
    'A (90-100)':'green','B (80-89)':'green','C (70-79)':'blue',
    'D (60-69)':'blue','E (50-59)':'yellow','F (<50)':'red'
  };
  return `<div class="dist-chart">${Object.entries(buckets).map(([k,v])=>`
    <div class="dist-row">
      <span class="lbl">${esc(k)}</span>
      <div class="track">
        <div class="fill ${colors[k]||''}" style="width:${Math.max((v/total)*100, v>0?4:0)}%">
          ${v>0 ? v : ''}
        </div>
      </div>
      <span class="cnt">${v}</span>
    </div>`).join('')}</div>`;
}

    const ass = assessmentMap[r.assessmentId];
    if(!ass) return null;
    const outcome = computeResult(r, ass);

      assessmentId: ass.id,

      type: ass.type,

    const overallPassRate = pct(totalPassed, totalFinished);

    // Revenue
    const allTx = dedupeTx(buildAllTx()).filter(t => inRange(t.timestamp));
    const contentTx = allTx.filter(t => {
      const it = (t.itemType||'course').toLowerCase();
      return it === 'course' || it === 'subfolder';
    });
    const approvedRevenue = contentTx.filter(t => t.status === 'approved')
      .reduce((s,t)=>s+num(t.amount),0);
    const pendingValue = contentTx.filter(t => t.status === 'pending')
      .reduce((s,t)=>s+num(t.amount),0);

    // Top 5 course sellers
    const itemSales = {};
    contentTx.filter(t => t.status === 'approved').forEach(t => {
      const k = t.itemId || t.itemTitle;
      if(!itemSales[k]) itemSales[k] = {
        id:t.itemId, title:t.itemTitle||'—', type:t.itemType||'course',
        count:0, revenue:0
      };
      itemSales[k].count++;
      itemSales[k].revenue += num(t.amount);
    });
    const topSellers = Object.values(itemSales).sort((a,b)=>b.revenue-a.revenue).slice(0,8);

    // Top 5 students
    const byStu = {};
    allTx.filter(t => t.status === 'approved').forEach(t => {
      const k = t.userId || t.userEmail || 'unknown';
      if(!byStu[k]) {
        const u = S.users[k] || {};
        byStu[k] = {
          id: k,
          name: t.userName || ((u.firstName||'')+' '+(u.lastName||'')).trim() || 'Unknown',
          email: t.userEmail || u.email || '',
          spend:0, count:0
        };
      }
      byStu[k].spend += num(t.amount);
      byStu[k].count++;
    });
    const topStu = Object.values(byStu).sort((a,b)=>b.spend-a.spend).slice(0,8);

    // Top 5 highest pass rates by assessment
    const assessmentSummary = assessments.map(ass => {
      const R = getAssessmentResults(ass);
      return {
        id: ass.id, name: ass.name, type: ass.type,
        attempts: R.finished.length,
        passed: R.passed.length,
        passRate: R.passRate,
        avg: R.avgScore
      };
    }).filter(a => a.attempts > 0)
      .sort((a,b) => b.passRate - a.passRate);

    const takeaway = `
      Overall pass rate: <strong>${overallPassRate}%</strong> across
      <strong>${totalFinished}</strong> finished script${totalFinished!==1?'s':''}.
      Approved revenue: <strong>${money(approvedRevenue)}</strong>.
      ${pendingValue > 0 ? `Pending: <strong>${money(pendingValue)}</strong>.` : ''}
    `;

    return `
      ${hero('Platform Overview','Pass/fail analytics, revenue and top performers across the entire platform.')}
      <div class="summary-line">${takeaway}</div>

      <div class="kpi-strip">
        ${kpi('fa-book-open', courses, 'Courses', '#d4952a')}
        ${kpi('fa-folder', subs, 'Subfolders', '#3b82f6')}
        ${kpi('fa-user-graduate', users, 'Students', '#10b981')}
        ${kpi('fa-file-alt', assessments.length, 'Assessments', '#8b5cf6')}
        ${kpi('fa-chalkboard-teacher', lectArr.length, 'Lecturers', '#f59e0b')}
      </div>

      <div class="kpi-strip">
        ${kpi('fa-check-circle', totalPassed, 'Scripts Passed', '#10b981')}
        ${kpi('fa-times-circle', totalFailed, 'Scripts Failed', '#ef4444')}
        ${kpi('fa-award', overallPassRate + '%', 'Overall Pass Rate', '#d4952a')}
        ${kpi('fa-file-signature', totalFinished, 'Total Finished', '#3b82f6')}
        ${kpi('fa-clock', responses.length - totalFinished, 'In Progress', '#f59e0b')}
      </div>

      <div class="section open" data-key="ov-rev">
        <div class="section-head" onclick="window.__toggleOpen('ov-rev')">
          <h3><i class="fas fa-coins"></i> Revenue Summary</h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          <div class="stats-row" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:0">
            <div class="stat-tile">
              <div class="lbl">✅ Approved Revenue</div>
              <div class="val" style="color:#10b981">${money(approvedRevenue)}</div>
            </div>
            <div class="stat-tile">
              <div class="lbl">⏳ Pending Value</div>
              <div class="val" style="color:#f59e0b">${money(pendingValue)}</div>
            </div>
            <div class="stat-tile">
              <div class="lbl">📊 Approved Sales</div>
              <div class="val">${contentTx.filter(t=>t.status==='approved').length}</div>
            </div>
          </div>
        </div></div>
      </div>

      ${section('ov-top-pass','fa-trophy','Top Performing Assessments (Highest Pass Rate)', assessmentSummary.length,
        assessmentSummary.length === 0
          ? `<div class="empty"><i class="fas fa-award"></i><p>No finished assessments yet</p></div>`
          : barList(assessmentSummary.slice(0,10), 'passRate', {
              sub: (it) => `${it.passed}/${it.attempts} passed · ${it.type}`,
              onClick: `window.__openAssessmentDetail('__ID__')`
            }),
        true)}

      <div class="two-col">
        ${section('ov-top-sell','fa-fire','Top Sellers (Revenue)', topSellers.length,
          topSellers.length === 0
            ? `<div class="empty"><i class="fas fa-fire"></i><p>No sales yet</p></div>`
            : barList(topSellers, 'revenue', {
                money: true,

                onClick: `window.__openItemDetail('__ID__')`

              }),
          true)}
      </div>
    `;
  }
};

MODULES.passFail = {
  icon:'fa-award',
  render(){
    const f = STATE.filters.passFail;
    const assessments = allAssessmentsCombined();

    // Build the full results summary for every assessment
    const summaries = assessments.map(ass => {
      const R = getAssessmentResults(ass);
      return {
        id: ass.id, name: ass.name, type: ass.type,
        status: ass.status,
        passingScore: num(ass.passingScore) || 50,
        totalMarks: num(ass.totalMarks) || 0,
        attempts: R.results.length,
        finished: R.finished.length,
        passed: R.passed.length,
        failed: R.failed.length,
        absent: R.absent.length,
        ongoing: R.ongoing.length,
        passRate: R.passRate,
        avgScore: R.avgScore,
        date: ass.createdAt || ass.startTime || ass.deadline || 0
      };
    });

    // Global totals
    const totalFinished = summaries.reduce((s,x)=>s+x.finished, 0);
    const totalPassed = summaries.reduce((s,x)=>s+x.passed, 0);
    const totalFailed = summaries.reduce((s,x)=>s+x.failed, 0);
    const totalAbsent = summaries.reduce((s,x)=>s+x.absent, 0);
    const overallPassRate = pct(totalPassed, totalFinished);
    const avgOfAvg = summaries.filter(s=>s.finished>0).length > 0
      ? Math.round(summaries.filter(s=>s.finished>0)
          .reduce((s,x)=>s+x.avgScore,0) / summaries.filter(s=>s.finished>0).length)
      : 0;

    // Apply filters
    let filtered = summaries;
    if(f.typeFilter !== 'all'){
      filtered = filtered.filter(x => x.type === f.typeFilter);

    if(f.outcome === 'passed'){
      filtered = filtered.filter(x => x.passed > 0);

      filtered = filtered.filter(x => x.failed > 0);
    } else if(f.outcome === 'excellent'){
      filtered = filtered.filter(x => x.passRate >= 80);
    } else if(f.outcome === 'struggling'){
      filtered = filtered.filter(x => x.finished > 0 && x.passRate < 50);

MODULES.assessmentResults = {
  icon:'fa-clipboard-check',
  render(){
    const f = STATE.filters.assessmentResults;
    const { userById } = buildLookups();
    const assessments = allAssessmentsCombined();

    // Build flat list of every finished script
    const allScripts = [];
    assessments.forEach(ass => {
      const responses = allResponsesCombined().filter(r => r.assessmentId === ass.id);
      responses.forEach(r => {
        const o = computeResult(r, ass);
        if(o.finished || o.absent){
          const u = userById[r.userId] || { name:'Unknown', email:'' };
          const g = gradeLabel(o.percent);
          allScripts.push({
            assessmentId: ass.id, assessmentName: ass.name, assessmentType: ass.type,
            uid: r.userId, name: u.name, email: u.email,
            score: o.score, total: o.total, percent: o.percent,
            passed: o.passed, absent: o.absent,
            grade: g.label,
            date: r.submittedAt || r.endedAt || r.startedAt
          });
        }
      });
    });

    let filtered = allScripts;
    if(f.type !== 'all') filtered = filtered.filter(s => s.assessmentType === f.type);
    if(f.search){
      const q = f.search.toLowerCase();
      filtered = filtered.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.email.toLowerCase().includes(q) ||
        s.assessmentName.toLowerCase().includes(q)
      );
    }
    const sorters = {
      'date-desc': (a,b)=>(b.date||0)-(a.date||0),
      'date-asc':  (a,b)=>(a.date||0)-(b.date||0),
      'score-desc':(a,b)=>b.percent-a.percent,
      'score-asc': (a,b)=>a.percent-b.percent,
      'name-asc':  (a,b)=>a.name.localeCompare(b.name)

      <strong style="color:#f59e0b">${absent}</strong> absent.

    return `

      <div class="kpi-strip">

        ${kpi('fa-times-circle', failed, 'Failed', '#ef4444')}
        ${kpi('fa-user-slash', absent, 'Absent / Abandoned', '#f59e0b')}
        ${kpi('fa-award', passRate + '%', 'Pass Rate', '#d4952a')}

      <div class="section open" data-key="ar-filters">
        <div class="section-head" onclick="window.__toggleOpen('ar-filters')">
          <h3><i class="fas fa-filter"></i> Filters</h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          <div class="filters">
            <select id="arType">
              <option value="all" ${f.type==='all'?'selected':''}>All types</option>
              <option value="test" ${f.type==='test'?'selected':''}>Tests</option>
              <option value="quiz" ${f.type==='quiz'?'selected':''}>Quizzes</option>
              <option value="exam" ${f.type==='exam'?'selected':''}>Exams</option>
              <option value="assignment" ${f.type==='assignment'?'selected':''}>Assignments</option>
            </select>
            <select id="arSort">
              <option value="date-desc" ${f.sortBy==='date-desc'?'selected':''}>Newest first</option>

/* ---------------------------------------------------------------
   STUDENT PERFORMANCE
   --------------------------------------------------------------- */
MODULES.studentPerformance = {
  icon:'fa-user-graduate',
  render(){
    const f = STATE.filters.studentPerformance;
    const { userById } = buildLookups();
    const users = Object.entries(S.users).map(([id,d])=>({id,...d}));
    const assessments = allAssessmentsCombined();
    const responses = allResponsesCombined();

    // Build student performance records
    const records = users.map(u => {
      const myResponses = responses.filter(r => r.userId === u.id);
      const attempts = myResponses.map(r => {
        const ass = assessments.find(a => a.id === r.assessmentId);
        if(!ass) return null;
        return computeResult(r, ass);
      }).filter(Boolean);
      const finished = attempts.filter(a => a.finished && !a.absent);
      const passed = finished.filter(a => a.passed);
      const failed = finished.filter(a => !a.passed);
      const avg = finished.length > 0
        ? Math.round(finished.reduce((s,x)=>s+x.percent,0) / finished.length)
        : 0;
      const bestPercent = finished.length > 0
        ? Math.max(...finished.map(x=>x.percent))
        : 0;
      const g = gradeLabel(avg);
      return {
        id: u.id,
        name: `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
        email: u.email||'', phone: u.phone||'',
        attempts: finished.length,
        passed: passed.length,
        failed: failed.length,
        absent: attempts.filter(a=>a.absent).length,
        avg, bestPercent, passRate: pct(passed.length, finished.length),
        grade: g.label, gradeCls: g.cls,
        banned: !!S.bannedUsers[u.id]
      };
    });

    let filtered = records;
    if(f.outcome === 'passedAll'){
      filtered = filtered.filter(r => r.failed === 0 && r.attempts > 0);
    } else if(f.outcome === 'failedAny'){
      filtered = filtered.filter(r => r.failed > 0);
    } else if(f.outcome === 'top'){
      filtered = filtered.filter(r => r.avg >= 80);
    } else if(f.outcome === 'struggling'){
      filtered = filtered.filter(r => r.attempts > 0 && r.avg < 50);
    } else if(f.outcome === 'noAttempts'){
      filtered = filtered.filter(r => r.attempts === 0);

MODULES.registerPerformance = {

        failed: failed.length,

/* -------- Register detail modal -------- */
window.__openRegisterDetail = function(regId){
  const registers = allRegistersCombined();
  const reg = registers.find(r => r.id === regId);
  if(!reg) return;
  const assessments = allAssessmentsCombined();
  const responses = allResponsesCombined();
  const { userById } = buildLookups();
  const memberUids = new Set(reg.members || []);

  // Per-assessment breakdown
  const perAssessment = {};
  assessments.forEach(ass => {
    const regResponses = responses.filter(r =>
      r.assessmentId === ass.id && memberUids.has(r.userId));
    if(regResponses.length === 0) return;
    const finished = regResponses.map(r => computeResult(r, ass)).filter(o => o.finished && !o.absent);
    if(finished.length === 0) return;
    const passed = finished.filter(o => o.passed).length;
    perAssessment[ass.id] = {
      name: ass.name, type: ass.type,
      attempts: finished.length,
      passed,
      failed: finished.length - passed,
      passRate: pct(passed, finished.length),
      avg: Math.round(finished.reduce((s,x)=>s+x.percent,0) / finished.length)
    };
  });

  const totalScripts = Object.values(perAssessment).reduce((s,x)=>s+x.attempts, 0);
  const totalPassed = Object.values(perAssessment).reduce((s,x)=>s+x.passed, 0);

  const html = `
    <div class="modal-kpi-grid">
      <div class="modal-kpi"><div class="lbl">Members</div><div class="val">${memberUids.size}</div></div>
      <div class="modal-kpi"><div class="lbl">Assessments</div><div class="val">${Object.keys(perAssessment).length}</div></div>
      <div class="modal-kpi"><div class="lbl">Scripts</div><div class="val">${totalScripts}</div></div>
      <div class="modal-kpi"><div class="lbl">Passed</div><div class="val" style="color:#10b981">${totalPassed}</div></div>
      <div class="modal-kpi"><div class="lbl">Pass Rate</div><div class="val">${pct(totalPassed, totalScripts)}%</div></div>
    </div>

    <div class="modal-section-title"><i class="fas fa-chart-bar"></i> By Assessment</div>
    ${Object.keys(perAssessment).length === 0
      ? `<div class="empty"><i class="fas fa-inbox"></i><p>No data for this register yet</p></div>`
      : `<div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>Assessment</th><th class="center">Type</th><th class="right">Attempts</th><th class="right">Passed</th><th class="right">Failed</th><th class="right">Avg %</th><th class="right">Pass Rate</th></tr></thead>
          <tbody>${Object.entries(perAssessment).map(([id,x])=>`
            <tr class="clickable" onclick="window.__closeModal(); window.__openAssessmentDetail('${esc(id)}')">
              <td><strong>${esc(x.name)}</strong></td>
              <td class="center">${pill(x.type)}</td>
              <td class="right">${x.attempts}</td>
              <td class="right" style="color:#10b981;font-weight:700">${x.passed}</td>
              <td class="right" style="color:#ef4444;font-weight:700">${x.failed}</td>
              <td class="right">${x.avg}%</td>
              <td class="right"><strong>${x.passRate}%</strong></td>
            </tr>`).join('')}</tbody>
        </table></div>`}

    <div class="modal-section-title"><i class="fas fa-users"></i> Members (${memberUids.size})</div>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>#</th><th>Student</th><th>Email</th></tr></thead>
      <tbody>${[...memberUids].map((uid,i)=>{
        const u = userById[uid] || { name:'Unknown', email:'' };
        return `<tr class="clickable" onclick="window.__closeModal(); window.__openStudentDetail('${esc(uid)}')">
          <td class="rank">${i+1}</td>
          <td><strong>${esc(u.name)}</strong></td>
          <td class="muted">${esc(u.email)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  `;
  openModal(reg.name || 'Register', reg.lecture || '', html);
};

            amount: num(tx.amount),

MODULES.contentSales = {
  icon:'fa-book-open',
  render(){
    const f = STATE.filters.contentSales;
    const contentTx = contentTxInRange();
    const approvedTx = contentTx.filter(t => t.status === 'approved');

    const rows = [];
    Object.values(S.courses).forEach(c => {
      rows.push({
        id:c.id, name:c.name||'Unnamed', type:'course', parent:'',
        price:num(c.price),
        sales:0, revenue:0, buyers:new Set()
      });
    });
    Object.values(S.subfolders).forEach(sf => {
      const p = S.courses[sf.courseId];
      rows.push({
        id:sf.id, name:sf.name||'Unnamed', type:'subfolder',
        parent:p?.name||'—', price:num(sf.price),
        sales:0, revenue:0, buyers:new Set()
      });
    });
    const byId = {}; rows.forEach(r => byId[r.id] = r);

    let listTx = contentTx;
    if(f.paymentStatus === 'approved') listTx = approvedTx;
    else if(f.paymentStatus === 'pending') listTx = contentTx.filter(t => t.status === 'pending');

    listTx.forEach(t => {
      const r = byId[t.itemId]; if(!r) return;
      r.sales++;
      if(t.status === 'approved') r.revenue += num(t.amount);
      if(t.userId) r.buyers.add(t.userId);
    });

    let filtered = rows;
    if(f.typeFilter === 'course') filtered = filtered.filter(r => r.type === 'course');
    else if(f.typeFilter === 'subfolder') filtered = filtered.filter(r => r.type === 'subfolder');
    else if(f.typeFilter === 'top') filtered = filtered.filter(r => r.sales > 0);
    if(f.search){
      const q = f.search.toLowerCase();
      filtered = filtered.filter(r =>
        r.name.toLowerCase().includes(q) || r.parent.toLowerCase().includes(q));
    }
    filtered.sort((a,b)=>b.revenue - a.revenue);

    return `
      ${hero('Courses & Subfolders','Every course and subfolder with sales, revenue and buyer counts.')}
      <div class="summary-line">
        <strong>${approvedTx.length}</strong> approved sales · <strong>${money(approvedTx.reduce((s,t)=>s+num(t.amount),0))}</strong> revenue.

        ${kpi('fa-folder', rows.filter(r=>r.type==='subfolder').length, 'Subfolders', '#3b82f6')}
        ${kpi('fa-check-circle', approvedTx.length, 'Approved Sales', '#10b981')}
        ${kpi('fa-coins', moneyShort(approvedTx.reduce((s,t)=>s+num(t.amount),0)), 'Revenue', '#10b981')}

        <div class="section-head" onclick="window.__toggleOpen('cs-filters')">
          <h3><i class="fas fa-filter"></i> Filters</h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="section-body"><div class="section-body-inner">
          <div class="filters">
            <select id="csPaymentStatus">
              <option value="approved" ${f.paymentStatus==='approved'?'selected':''}>Approved only</option>
              <option value="pending" ${f.paymentStatus==='pending'?'selected':''}>Pending only</option>
              <option value="all" ${f.paymentStatus==='all'?'selected':''}>All</option>

              <option value="all" ${f.typeFilter==='all'?'selected':''}>All types</option>
              <option value="course" ${f.typeFilter==='course'?'selected':''}>Courses</option>
              <option value="subfolder" ${f.typeFilter==='subfolder'?'selected':''}>Subfolders</option>
              <option value="top" ${f.typeFilter==='top'?'selected':''}>With sales</option>
            </select>

          </div>
        </div></div>
      </div>

      <div class="section open" data-key="cs-main">
        <div class="section-head" onclick="window.__toggleOpen('cs-main')">
          <h3><i class="fas fa-list"></i> Items <span class="count">${filtered.length}</span></h3>
          <div class="chev"><i class="fas fa-chevron-down"></i></div>
        </div>

MODULES.lectureDash = {
  icon:'fa-chalkboard-teacher',
  render(){
    const f = STATE.filters.lectureDash;
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const txApproved = contentTxInRange().filter(t => t.status === 'approved');
    const ownerIdx = {};
    Object.entries(S.courses).forEach(([id,c])=>{ if(c.lecturerId) ownerIdx[id]=c.lecturerId; });
    Object.entries(S.subfolders).forEach(([id,s])=>{ if(s.lecturerId) ownerIdx[id]=s.lecturerId; });

    const byL = {};
    lectArr.forEach(l => {
      byL[l.id] = {
        id:l.id, name:l.name||'Unnamed', email:l.email||'',
        status:l.status||'pending', banned:!!l.banned,
        sales:0, revenue:0, students:new Set()
      };
    });
    txApproved.forEach(t => {
      const owner = ownerIdx[t.itemId];
      if(!owner || !byL[owner]) return;
      byL[owner].sales++; byL[owner].revenue += num(t.amount);
      if(t.userId) byL[owner].students.add(t.userId);

    let rows = Object.values(byL).map(r => ({...r, uniqueStudents:r.students.size}));
    if(f.search){
      const q = f.search.toLowerCase();
      rows = rows.filter(r =>
        r.name.toLowerCase().includes(q) || r.email.toLowerCase().includes(q));
    }
    rows.sort((a,b)=>b.revenue-a.revenue);

    return `
      ${hero('Lecture Dashboard','Per-lecturer revenue from approved sales. Click any lecturer to drill down.')}
      <div class="summary-line">
        <strong>${rows.length}</strong> lecturers · <strong>${rows.reduce((s,r)=>s+r.sales,0)}</strong> paid sales · <strong>${money(rows.reduce((s,r)=>s+r.revenue,0))}</strong> revenue.

MODULES.lecturers = {

    let rows = lectArr.map(l => {
      let status = l.status || 'pending';
      if(l.banned) status = 'banned';
      else if(l.status === 'approved' && (!l.accessExpiresAt || l.accessExpiresAt > now)) status = 'active';
      else if(l.status === 'approved' && l.accessExpiresAt && l.accessExpiresAt <= now) status = 'expired';
      return {
        id:l.id, name:l.name||'Unnamed', email:l.email||'', phone:l.phone||'',
        college:l.collegeName||'', city:l.city||'',

        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length
      };

    if(f.status !== 'all') rows = rows.filter(r => r.status === f.status);
    if(f.search){

/* =================================================================

================================================================= */
function attachEvents(){
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = btn.dataset.range;
      if(r === 'custom'){
        STATE.range = 'custom';
        document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('customBox')?.classList.add('show');
        return;
      }
      STATE.range = r;
      showLoading('Loading data…', `Range: ${r}`);
      setTimeout(() => { computeRange(); render(); hideLoading(); }, 250);
    });
  });

  document.getElementById('applyCustomBtn')?.addEventListener('click', () => {
    const f = document.getElementById('fromDate').value;
    const t = document.getElementById('toDate').value;
    if(!f || !t){ toast('Pick both dates','error'); return; }
    const sTs = new Date(f + 'T00:00:00').getTime();
    const eTs = new Date(t + 'T23:59:59').getTime();
    if(eTs < sTs){ toast('End must be after start','error'); return; }
    STATE.startTs = sTs; STATE.endTs = eTs;
    render();
  });

  document.querySelectorAll('[data-dl]').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.dl;
      if(k === 'pdf'){
        showLoading('Generating PDF…','Preparing document');
        setTimeout(() => downloadPDF().finally(hideLoading), 150);
      } else if(k === 'excel'){
        showLoading('Generating Excel…','Building workbook');
        setTimeout(() => { try{ downloadExcel(); } finally { hideLoading(); } }, 150);
      } else if(k === 'expandAll'){
        document.querySelectorAll('.section').forEach(s => STATE.open[s.dataset.key] = true);
        render();
      } else if(k === 'collapseAll'){
        document.querySelectorAll('.section').forEach(s => STATE.open[s.dataset.key] = false);
        render();
      } else if(k === 'refresh'){
        showLoading('Refreshing…','Reloading');
        setTimeout(() => { computeRange(); render(); hideLoading(); }, 200);
      }
    });
  });

  const bind = (id, key) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(el.tagName === 'INPUT'){
      let t;
      el.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          const pos = el.selectionStart;
          STATE.filters[STATE.module][key] = el.value;
          render();
          const n = document.getElementById(id);
          if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
        }, 300);
      });
    } else {
      el.addEventListener('change', () => {
        STATE.filters[STATE.module][key] = el.value;
        render();
      });
    }
  };

  bind('pfType','typeFilter'); bind('pfOutcome','outcome'); bind('pfSearch','search');
  bind('arType','type'); bind('arSort','sortBy'); bind('arSearch','search');
  bind('spOutcome','outcome'); bind('spSort','sortBy'); bind('spSearch','search');
  bind('rpSort','sortBy'); bind('rpSearch','search');
  bind('bsType','typeFilter'); bind('bsSearch','search');
  bind('enStatus','status'); bind('enSearch','search');
  bind('csPaymentStatus','paymentStatus'); bind('csType','typeFilter'); bind('csSearch','search');
  bind('ldSearch','search');
  bind('exStatus','status'); bind('exSearch','search');
  bind('stSearch','search');
  bind('lcStatus','status'); bind('lcSearch','search');
}

document.getElementById('sbBody').addEventListener('click', e => {

});
function openSidebar(){
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sidebar').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sidebar').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('menuBtn').onclick = openSidebar;
document.getElementById('sbClose').onclick = closeSidebar;
document.getElementById('overlay').onclick = closeSidebar;

/* =================================================================
   PDF EXPORT
================================================================= */
async function downloadPDF(){
  const root = document.getElementById('reportRoot');
  if(!root) return;
  const moduleNames = {
    overview:'Platform Overview', passFail:'Pass/Fail Analytics Report',
    assessmentResults:'Assessment Results Report', studentPerformance:'Student Performance Report',
    registerPerformance:'Register Performance Report',
    bestSellers:'Best Sellers Report', enrollments:'Enrollments Report',
    contentSales:'Courses & Subfolders Report', lectureDash:'Lecture Dashboard Report',
    express:'Express Shopping Report', students:'Students Report', lecturers:'Lecturers Report'
  };
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:24px 20px;background:#fff;color:#12141d;font-family:Inter,Arial,sans-serif;';
  wrap.innerHTML = `
    <div style="text-align:center;padding:16px 12px 18px;border-bottom:3px solid #F5B042;margin-bottom:18px;">
      <h1 style="font-size:24px;font-weight:900;margin:0;background:linear-gradient(135deg,#d4952a,#f5b042,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">UTOM · ${moduleNames[STATE.module]}</h1>
      <div style="font-size:12px;color:#5f6377;margin-top:6px;">Range: <strong>${esc(rangeLabel())}</strong></div>
      <div style="font-size:11px;color:#8b8fa3;margin-top:2px;">Generated: ${new Date().toLocaleString()}</div>
      <div style="font-size:11px;color:#8b8fa3;margin-top:2px;">By: ${esc(currentAdmin?.email||'admin')}</div>
    </div>
  `;
  const cloned = root.cloneNode(true);
  cloned.querySelectorAll('.section').forEach(c => c.classList.add('open'));
  cloned.querySelectorAll('.section-body').forEach(b => { b.style.maxHeight = 'none'; });
  cloned.querySelectorAll('.hero, .section, .kpi, .stat-tile').forEach(el => {
    el.style.background = '#fff';
    el.style.boxShadow = 'none';
    el.style.border = '1px solid #e5e8ed';
  });
  cloned.querySelectorAll('.range-btns, .custom-box, .action-btns, .filters, .section-head .chev').forEach(el => el.remove());
  wrap.appendChild(cloned);
  document.body.appendChild(wrap);
  try{
    await html2pdf().set({
      margin:[6,6,10,6],
      filename:`UTOM-${STATE.module}-${new Date().toISOString().slice(0,10)}.pdf`,
      image:{ type:'jpeg', quality:0.95 },
      html2canvas:{ scale:2, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak:{ mode:['css','legacy'] }
    }).from(wrap).save();
    toast('PDF downloaded','success');
  }catch(e){
    console.error(e);
    toast('PDF error: ' + e.message,'error');
  }finally{
    document.body.removeChild(wrap);
  }
}

/* =================================================================
   EXCEL EXPORT — includes pass/fail sheets
================================================================= */
function downloadExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel library missing','error'); return; }
  const wb = XLSX.utils.book_new();
  const addSheet = (name, rows) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const w = [];
    rows.forEach(r => (r||[]).forEach((c,i)=>{
      const len = String(c==null?'':c).length;
      w[i] = Math.max(w[i]||8, Math.min(len+2, 45));
    }));
    ws['!cols'] = w.map(x=>({wch:x}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const infoRows = [
    ['UTOM REPORT'],
    ['Module', STATE.module],
    ['Range', rangeLabel()],
    ['Generated', new Date().toLocaleString()],
    ['By', currentAdmin?.email||'admin'],
    []
  ];

  const assessments = allAssessmentsCombined();
  const responses = allResponsesCombined();
  const { userById } = buildLookups();

  /* ---------- ALL MODULES: add the universal Pass/Fail sheets first ---------- */
  if(['overview','passFail','assessmentResults','studentPerformance','registerPerformance'].includes(STATE.module)){

    // Pass/Fail summary per assessment
    const summaries = assessments.map(ass => {
      const R = getAssessmentResults(ass);
      return [
        ass.name,
        ass.type,
        ass.status || 'draft',
        num(ass.passingScore) || 50,
        num(ass.totalMarks) || 0,
        R.finished.length,
        R.passed.length,
        R.failed.length,
        R.absent.length,
        R.ongoing.length,
        R.passRate + '%',
        R.avgScore + '%'
      ];
    });
    addSheet('Pass-Fail Summary', [
      ['Assessment','Type','Status','Pass Mark %','Total Marks',
       'Finished','Passed','Failed','Absent','Ongoing','Pass Rate','Avg Score'],
      ...summaries
    ]);

    // Individual scripts
    const scriptsRows = [];
    assessments.forEach(ass => {
      const resp = responses.filter(r => r.assessmentId === ass.id);
      resp.forEach(r => {
        const o = computeResult(r, ass);
        if(!(o.finished || o.absent)) return;
        const u = userById[r.userId] || { name:'Unknown', email:'' };
        const g = gradeLabel(o.percent);
        scriptsRows.push([
          ass.name, ass.type,
          u.name, u.email,
          o.score, o.total, o.percent + '%',
          g.label,
          o.absent ? 'Absent' : o.passed ? 'PASS' : 'FAIL',
          fmtDate(r.submittedAt || r.endedAt || r.startedAt)
        ]);
      });
    });
    addSheet('All Scripts', [
      ['Assessment','Type','Student','Email','Score','Total','Percent','Grade','Outcome','Date'],
      ...scriptsRows
    ]);

    // Student performance
    const usersArr = Object.entries(S.users).map(([id,d])=>({id,...d}));
    const studentRows = [];
    usersArr.forEach(u => {
      const myResponses = responses.filter(r => r.userId === u.id);
      const attempts = myResponses.map(r => {
        const ass = assessments.find(a => a.id === r.assessmentId);
        if(!ass) return null;
        return computeResult(r, ass);
      }).filter(Boolean);
      const finished = attempts.filter(a => a.finished && !a.absent);
      const passed = finished.filter(a => a.passed);
      const avg = finished.length > 0
        ? Math.round(finished.reduce((s,x)=>s+x.percent,0)/finished.length)
        : 0;
      const g = gradeLabel(avg);
      studentRows.push([
        `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
        u.email || '',
        finished.length,
        passed.length,
        finished.length - passed.length,
        avg + '%',
        g.label
      ]);
    });
    addSheet('Student Performance', [
      ['Student','Email','Attempts','Passed','Failed','Avg %','Grade'],
      ...studentRows
    ]);

    // Register performance
    const registers = allRegistersCombined();
    const regRows = registers.map(reg => {
      const members = new Set(reg.members || []);
      const finished = [];
      responses.forEach(r => {
        if(!members.has(r.userId)) return;
        const ass = assessments.find(a => a.id === r.assessmentId);
        if(!ass) return;
        const o = computeResult(r, ass);
        if(o.finished && !o.absent) finished.push(o);
      });
      const passed = finished.filter(x => x.passed).length;
      const avg = finished.length > 0
        ? Math.round(finished.reduce((s,x)=>s+x.percent,0)/finished.length)
        : 0;
      return [
        reg.name || 'Register',
        reg.lecture || '',
        (reg.members||[]).length,
        finished.length,
        passed,
        finished.length - passed,
        avg + '%',
        pct(passed, finished.length) + '%'
      ];
    });
    addSheet('Register Performance', [
      ['Register','Lecture','Members','Scripts','Passed','Failed','Avg %','Pass Rate'],
      ...regRows
    ]);
  }

  /* ---------- MODULE-SPECIFIC sheets ---------- */
  if(STATE.module === 'overview'){
    const allTx = dedupeTx(buildAllTx()).filter(t => inRange(t.timestamp));
    const contentTx = allTx.filter(t => t.itemType === 'course' || t.itemType === 'subfolder');
    const approved = contentTx.filter(t => t.status === 'approved');
    addSheet('Revenue', [
      ['Approved Revenue', approved.reduce((s,t)=>s+num(t.amount),0).toFixed(2)],
      ['Approved Sales', approved.length],
      ['Courses', Object.keys(S.courses).length],
      ['Subfolders', Object.keys(S.subfolders).length],
      ['Students', Object.keys(S.users).length],
      ['Lecturers', Object.keys(S.lecturerData).length]
    ]);
  }

  else if(STATE.module === 'bestSellers'){
    const approved = contentTxInRange().filter(t => t.status === 'approved');
    const itemSales = {};
    approved.forEach(t => {
      const k = t.itemId || t.itemTitle;
      if(!itemSales[k]) itemSales[k] = {
        title:t.itemTitle||'—', type:t.itemType||'course',
        count:0, revenue:0, students:new Set()
      };
      itemSales[k].count++;
      itemSales[k].revenue += num(t.amount);
      if(t.userId) itemSales[k].students.add(t.userId);
    });
    const rows = Object.values(itemSales).sort((a,b)=>b.revenue-a.revenue);
    addSheet('Best Sellers', [
      ['#','Item','Type','Buyers','Sales','Revenue'],
      ...rows.map((r,i)=>[i+1, r.title, r.type, r.students.size, r.count, r.revenue.toFixed(2)])
    ]);
  }

  else if(STATE.module === 'contentSales'){
    const rows = [];
    Object.values(S.courses).forEach(c => {
      rows.push([c.name||'Course','course','',num(c.price)]);
    });
    Object.values(S.subfolders).forEach(sf => {
      const p = S.courses[sf.courseId];
      rows.push([sf.name||'Subfolder','subfolder',p?.name||'',num(sf.price)]);
    });
    addSheet('Courses & Subfolders', [
      ['Name','Type','Parent','Price'],
      ...rows
    ]);
  }

  else if(STATE.module === 'lectureDash'){
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const ownerIdx = {};
    Object.entries(S.courses).forEach(([id,c])=>{ if(c.lecturerId) ownerIdx[id]=c.lecturerId; });
    Object.entries(S.subfolders).forEach(([id,s])=>{ if(s.lecturerId) ownerIdx[id]=s.lecturerId; });
    const byL = {};
    lectArr.forEach(l => {
      byL[l.id] = { name:l.name||'', email:l.email||'', status:l.status||'pending',
        sales:0, revenue:0, students:new Set() };
    });
    contentTxInRange().filter(t => t.status === 'approved').forEach(t => {
      const owner = ownerIdx[t.itemId];
      if(!owner || !byL[owner]) return;
      byL[owner].sales++; byL[owner].revenue += num(t.amount);
      if(t.userId) byL[owner].students.add(t.userId);
    });
    addSheet('Lecturers', [
      ['Name','Email','Status','Sales','Students','Revenue'],
      ...Object.values(byL).map(r=>[
        r.name, r.email, r.status, r.sales, r.students.size, r.revenue.toFixed(2)
      ])
    ]);
  }

  else if(STATE.module === 'express'){
    const orders = Object.values(S.expressOrders).filter(o => inRange(o.createdAt));
    addSheet('Orders', [
      ['Order ID','Customer','Email','Items','Total','Status','Date'],
      ...orders.map(o=>[
        o.id, o.customerName||'', o.customerEmail||'',
        (o.items||[]).map(i=>`${i.name} x${i.qty}`).join(' | '),
        num(o.total).toFixed(2), o.status||'', fmtDate(o.createdAt)
      ])
    ]);
  }

  else if(STATE.module === 'students'){
    const users = Object.entries(S.users).map(([id,d])=>({id,...d}));
    addSheet('Students', [
      ['Name','Email','Phone'],
      ...users.map(u=>[
        `${u.firstName||''} ${u.lastName||''}`.trim(),
        u.email||'', u.phone||''
      ])
    ]);
  }

  else if(STATE.module === 'lecturers'){
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    addSheet('Lecturers', [
      ['Name','Email','Phone','College','City','Status','Paid'],
      ...lectArr.map(l=>[
        l.name||'', l.email||'', l.phone||'',
        l.collegeName||'', l.city||'', l.status||'pending',
        num(l.paidAmount).toFixed(2)
      ])
    ]);
  }

  XLSX.writeFile(wb, `UTOM-${STATE.module}-${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel downloaded','success');
}
