================================================================= */
async function downloadPDF(){
  const root = document.getElementById('reportRoot');
  if(!root) return;
  const moduleNames = {
    overview:'Platform Overview', bestSellers:'Best Sellers Report',
    enrollments:'Enrollments Report', contentSales:'Courses & Subfolders Report',
    lectureDash:'Lecture Dashboard Report', express:'Express Shopping Report',
    assessments:'Assessments Report', students:'Students Report', lecturers:'Lecturers Report'
  };
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:24px 20px;background:#fff;color:#12141d;font-family:Inter,Arial,sans-serif;';
  wrap.innerHTML = `
    <div style="text-align:center;padding:16px 12px 18px;border-bottom:3px solid #F5B042;margin-bottom:18px;">
      <h1 style="font-size:24px;font-weight:900;margin:0;background:linear-gradient(135deg,#d4952a,#f5b042,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">UTOM · ${moduleNames[STATE.module]}</h1>
      <div style="font-size:12px;color:#5f6377;margin-top:6px;">Range: <strong>${esc(rangeLabel())}</strong></div>
      <div style="font-size:11px;color:#8b8fa3;margin-top:2px;">Generated: ${new Date().toLocaleString()}</div>
      <div style="font-size:11px;color:#8b8fa3;margin-top:2px;">By: ${esc(currentAdmin?.email||'admin')}</div>
    </div>
  `;
  const cloned = root.cloneNode(true);
  cloned.querySelectorAll('.section').forEach(c => c.classList.add('open'));
  cloned.querySelectorAll('.section-body').forEach(b => { b.style.maxHeight = 'none'; });
  cloned.querySelectorAll('.hero, .section, .kpi, .stat-tile').forEach(el => {
    el.style.background = '#fff';
    el.style.boxShadow = 'none';
    el.style.border = '1px solid #e5e8ed';
  });
  cloned.querySelectorAll('.range-btns, .custom-box, .action-btns, .filters, .section-head .chev').forEach(el => el.remove());
  wrap.appendChild(cloned);
  document.body.appendChild(wrap);
  try{
    await html2pdf().set({
      margin:[6,6,10,6],
      filename:`UTOM-${STATE.module}-${new Date().toISOString().slice(0,10)}.pdf`,
      image:{ type:'jpeg', quality:0.95 },
      html2canvas:{ scale:2, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak:{ mode:['css','legacy'] }
    }).from(wrap).save();
    toast('PDF downloaded','success');
  }catch(e){
    console.error(e);
    toast('PDF error: ' + e.message,'error');
  }finally{
    document.body.removeChild(wrap);
  }
}

/* =================================================================
   EXCEL EXPORT — includes per-student enrollment sheets
================================================================= */
function downloadExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel library missing','error'); return; }
  const wb = XLSX.utils.book_new();
  const addSheet = (name, rows) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const w = [];
    rows.forEach(r => (r||[]).forEach((c,i)=>{
      const len = String(c==null?'':c).length;
      w[i] = Math.max(w[i]||8, Math.min(len+2, 45));
    }));
    ws['!cols'] = w.map(x=>({wch:x}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const infoRows = [
    ['UTOM REPORT'],
    ['Module', STATE.module],
    ['Range', rangeLabel()],
    ['Generated', new Date().toLocaleString()],
    ['By', currentAdmin?.email||'admin'],
    []
  ];

  /* ---------- OVERVIEW ---------- */
  if(STATE.module === 'overview'){
    const allTx = dedupeTx(buildAllTx()).filter(t => inRange(t.timestamp));
    const approved = allTx.filter(t => t.status==='approved');
    const pending  = allTx.filter(t => t.status==='pending');
    const rejected = allTx.filter(t => t.status==='rejected');
    const contentTx = allTx.filter(t => t.itemType === 'course' || t.itemType === 'subfolder');
    const contentApproved = contentTx.filter(t => t.status === 'approved');
    const contentPending = contentTx.filter(t => t.status === 'pending');
    const contentRejected = contentTx.filter(t => t.status === 'rejected');
    const sum = a => a.reduce((s,t)=>s+num(t.amount),0);

    const itemSales = {};
    contentApproved.forEach(t => {
      const k = t.itemId || t.itemTitle;
      if(!itemSales[k]) itemSales[k] = { title:t.itemTitle||'—', type:t.itemType||'course', count:0, revenue:0 };
      itemSales[k].count++; itemSales[k].revenue += num(t.amount);
    });
    const topSellers = Object.values(itemSales).sort((a,b)=>b.revenue-a.revenue);

    const byStu = {};
    approved.forEach(t => {
      const k = t.userId || t.userEmail || 'unknown';
      if(!byStu[k]) byStu[k] = { name: t.userName||'—', email: t.userEmail||'', spend:0, count:0 };
      byStu[k].spend += num(t.amount); byStu[k].count++;
    });
    const topStu = Object.values(byStu).sort((a,b)=>b.spend-a.spend);

    addSheet('Overview', [
      ...infoRows,
      ['LIBRARY TOTALS',''],
      ['Courses', Object.keys(S.courses).length],
      ['Subfolders', Object.keys(S.subfolders).length],
      ['Students', Object.keys(S.users).length],
      ['Lecturers', Object.keys(S.lecturerData).length],
      ['Assessments', Object.keys(S.assessments).length + Object.keys(S.lecturerAssessments).length],
      [],
      ['REVENUE — COURSES & SUBFOLDERS','','ZMW'],
      ['Approved', contentApproved.length, sum(contentApproved).toFixed(2)],
      ['Pending',  contentPending.length,  sum(contentPending).toFixed(2)],
      ['Rejected', contentRejected.length, sum(contentRejected).toFixed(2)]
    ]);
    addSheet('Top Sellers', [
      ['Item','Type','Sales','Revenue (ZMW)'],
      ...topSellers.map(s=>[s.title, s.type, s.count, s.revenue.toFixed(2)])
    ]);
    addSheet('Top Students', [
      ['Name','Email','Purchases','Spend (ZMW)'],
      ...topStu.map(s=>[s.name, s.email, s.count, s.spend.toFixed(2)])
    ]);
  }

  /* ---------- BEST SELLERS ---------- */
  else if(STATE.module === 'bestSellers'){
    const approved = contentTxInRange().filter(t => t.status === 'approved');
    const itemSales = {};
    approved.forEach(t => {
      const k = t.itemId || t.itemTitle;
      if(!itemSales[k]) itemSales[k] = {
        id:t.itemId, title:t.itemTitle||'—', type:t.itemType||'course',
        count:0, revenue:0, students:new Set()
      };
      itemSales[k].count++;
      itemSales[k].revenue += num(t.amount);
      if(t.userId) itemSales[k].students.add(t.userId);
    });
    const rows = Object.values(itemSales).map(x => ({
      ...x, unique:x.students.size
    })).sort((a,b)=>b.revenue-a.revenue);

    addSheet('Best Sellers', [
      ...infoRows,
      ['#','Item','Type','Buyers','Sales','Revenue (ZMW)'],
      ...rows.map((r,i)=>[i+1, r.title, r.type, r.unique, r.count, r.revenue.toFixed(2)])
    ]);
  }

  /* ---------- ENROLLMENTS ---------- */
  else if(STATE.module === 'enrollments'){
    const { itemById, userById } = buildLookups();
    const enrollments = [];
    const collect = (map, status) => {
      Object.entries(map).forEach(([uid, items]) => {
        Object.entries(items||{}).forEach(([iid, info]) => {
          enrollments.push({
            uid,
            student: userById[uid]?.name || info.userName || 'Unknown',
            email: userById[uid]?.email || info.userEmail || '',
            item: info.itemTitle || itemById[iid]?.name || '—',
            itemType: info.itemType || itemById[iid]?.type || 'course',
            amount: num(info.amount),
            status: info.status || status,
            date: info.approvedAt || info.timestamp || info.createdAt || 0
          });
        });
      });
    };
    collect(S.approvedPurchases, 'approved');
    collect(S.lecturerApprovedPurchases, 'approved');
    collect(S.pendingPurchases, 'pending');
    collect(S.lecturerPendingPurchases, 'pending');

    addSheet('Enrollments', [
      ['Student','Email','Item','Type','Amount (ZMW)','Status','Date'],
      ...enrollments.map(e=>[
        e.student, e.email, e.item, e.itemType,
        e.amount.toFixed(2), e.status, fmtDate(e.date)
      ])
    ]);
  }

  /* ---------- COURSES & SUBFOLDERS ---------- */
  else if(STATE.module === 'contentSales'){
    const contentTx = contentTxInRange();
    const approvedTx = contentTx.filter(t => t.status === 'approved');

    const rows = [];
    Object.values(S.courses).forEach(c => {
      rows.push({ id:c.id, name:c.name||'', type:'course', parent:'', price:num(c.price),
        videos: Object.values(S.videos).filter(v=>v.courseId===c.id).length,
        docs: Object.values(S.docs).filter(d=>d.courseId===c.id).length,
        sales:0, revenue:0, buyers:new Set() });
    });
    Object.values(S.subfolders).forEach(sf => {
      const parent = S.courses[sf.courseId];
      rows.push({ id:sf.id, name:sf.name||'', type:'subfolder', parent:parent?.name||'',
        price:num(sf.price),
        videos: Object.values(S.videos).filter(v=>v.subfolderId===sf.id).length,
        docs: Object.values(S.docs).filter(d=>d.subfolderId===sf.id).length,
        sales:0, revenue:0, buyers:new Set() });
    });
    const byId = {}; rows.forEach(r => byId[r.id]=r);
    contentTx.forEach(t => {
      const r = byId[t.itemId]; if(!r) return;
      r.sales++;
      if(t.status === 'approved') r.revenue += num(t.amount);
      if(t.userId) r.buyers.add(t.userId);
    });

    addSheet('Courses & Subfolders', [
      ['Type','Name','Parent','Price','Sales','Buyers','Revenue (ZMW)','Videos','Docs'],
      ...rows.map(r=>[
        r.type, r.name, r.parent, r.price.toFixed(2),
        r.sales, r.buyers.size, r.revenue.toFixed(2), r.videos, r.docs
      ])
    ]);

    /* Per-item buyers sheet */
    const { userById } = buildLookups();
    const buyersSheet = [['Item','Type','Student','Email','Amount (ZMW)','Date']];
    const approvedByItem = {};
    approvedTx.forEach(t => {
      if(!approvedByItem[t.itemId]) approvedByItem[t.itemId] = [];
      approvedByItem[t.itemId].push(t);
    });
    Object.entries(approvedByItem).forEach(([iid, list]) => {
      const item = byId[iid];
      list.forEach(t => {
        buyersSheet.push([
          item?.name || t.itemTitle || '—',
          item?.type || t.itemType || 'course',
          userById[t.userId]?.name || t.userName || 'Unknown',
          userById[t.userId]?.email || t.userEmail || '',
          num(t.amount).toFixed(2),
          fmtDate(t.timestamp)
        ]);
      });
    });
    addSheet('Buyers Per Item', buyersSheet);
  }

  /* ---------- LECTURE DASHBOARD ---------- */
  else if(STATE.module === 'lectureDash'){
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const txApproved = contentTxInRange().filter(t => t.status === 'approved');
    const ownerIdx = {};
    Object.entries(S.courses).forEach(([id,c])=>{ if(c.lecturerId) ownerIdx[id]=c.lecturerId; });
    Object.entries(S.subfolders).forEach(([id,s])=>{ if(s.lecturerId) ownerIdx[id]=s.lecturerId; });
    const byL = {};
    lectArr.forEach(l => {
      byL[l.id] = {
        name:l.name||'', email:l.email||'', status:l.status||'pending',
        banned:!!l.banned, courses:0, sales:0, revenue:0, students:new Set()
      };
    });
    Object.values(S.courses).forEach(c => {
      if(c.lecturerId && byL[c.lecturerId]) byL[c.lecturerId].courses++;
    });
    txApproved.forEach(t => {
      const owner = ownerIdx[t.itemId]; if(!owner || !byL[owner]) return;
      byL[owner].sales++; byL[owner].revenue += num(t.amount);
      if(t.userId) byL[owner].students.add(t.userId);
    });
    const rows = Object.values(byL).sort((a,b)=>b.revenue-a.revenue);
    addSheet('Lecturer Performance', [
      ['Lecturer','Email','Status','Banned','Courses','Sales','Students','Revenue (ZMW)'],
      ...rows.map(r=>[
        r.name, r.email, r.status, r.banned?'Yes':'No',
        r.courses, r.sales, r.students.size, r.revenue.toFixed(2)
      ])
    ]);
  }

  /* ---------- EXPRESS ---------- */
  else if(STATE.module === 'express'){
    const orders = Object.values(S.expressOrders).filter(o => inRange(o.createdAt));
    const payments = Object.values(S.expressPayments).filter(p => inRange(p.createdAt));
    addSheet('Overview', [
      ...infoRows,
      ['Orders', orders.length],
      ['Approved Revenue', payments.filter(p=>p.status==='approved').reduce((s,p)=>s+num(p.amount),0).toFixed(2)]
    ]);
    addSheet('Orders', [
      ['Order ID','Customer','Email','Items','Total','Status','Date'],
      ...orders.map(o=>[
        o.id, o.customerName||'', o.customerEmail||'',
        (o.items||[]).map(i=>`${i.name} x${i.qty}`).join(' | '),
        num(o.total).toFixed(2), o.status||'', fmtDate(o.createdAt)
      ])
    ]);
    addSheet('Payments', [
      ['Customer','Product','Amount','Status','Date'],
      ...payments.map(p=>[
        p.customerName||'', p.productName||'',
        num(p.amount).toFixed(2), p.status||'', fmtDate(p.createdAt)
      ])
    ]);
  }

  /* ---------- ASSESSMENTS ---------- */
  else if(STATE.module === 'assessments'){
    const assArr = [...Object.values(S.assessments), ...Object.values(S.lecturerAssessments)];
    const respArr = [...Object.values(S.assessmentResponses), ...Object.values(S.lecturerResponses)]
      .filter(r => inRange(r.submittedAt || r.startedAt || r.endedAt));
    const rows = assArr.map(a => {
      const resps = respArr.filter(r => r.assessmentId === a.id);
      const completed = resps.filter(r => r.status==='completed'||r.status==='ended');
      const passed = completed.filter(r => {
        const total = num(a.totalMarks);
        const p = total > 0 ? (num(r.score)/total)*100 : 0;
        return p >= num(a.passingScore||50);
      });
      return {
        name:a.name||'', type:a.type||'test', status:a.status||'draft',
        attempts: resps.length, completed: completed.length,
        passed: passed.length, failed: completed.length - passed.length
      };
    });
    addSheet('Assessments', [
      ...infoRows,
      ['Name','Type','Status','Attempts','Completed','Passed','Failed'],
      ...rows.map(r=>[r.name, r.type, r.status, r.attempts, r.completed, r.passed, r.failed])
    ]);
  }

  /* ---------- STUDENTS ---------- */
  else if(STATE.module === 'students'){
    const { itemById } = buildLookups();
    const usersArr = Object.entries(S.users).map(([id,d])=>({id,...d}));
    const banned = Object.entries(S.bannedUsers).filter(([,v])=>v).map(([id])=>id);
    const byStudent = {};
    usersArr.forEach(u => {
      byStudent[u.id] = {
        name: `${u.firstName||''} ${u.lastName||''}`.trim() || u.email || 'Unknown',
        email: u.email||'', phone: u.phone||'',
        banned: banned.includes(u.id),
        purchases:0, spend:0, courses:0, subfolders:0, purchasesList:[]
      };
    });
    const collect = (map) => {
      Object.entries(map).forEach(([uid, items]) => {
        if(!byStudent[uid]) return;
        Object.entries(items||{}).forEach(([iid, info]) => {
          const amount = num(info.amount);
          byStudent[uid].purchases++;
          byStudent[uid].spend += amount;
          const type = (info.itemType || itemById[iid]?.type || 'course').toLowerCase();
          if(type === 'course') byStudent[uid].courses++;
          else if(type === 'subfolder') byStudent[uid].subfolders++;
          byStudent[uid].purchasesList.push({
            item: info.itemTitle || itemById[iid]?.name || '—',
            type, amount,
            date: info.approvedAt || info.timestamp || 0
          });
        });
      });
    };
    collect(S.approvedPurchases);
    collect(S.lecturerApprovedPurchases);
    const rows = Object.values(byStudent).sort((a,b)=>b.spend-a.spend);
    addSheet('Students Summary', [
      ...infoRows,
      ['Name','Email','Phone','Purchases','Courses','Subfolders','Spend (ZMW)','Banned'],
      ...rows.map(r=>[
        r.name, r.email, r.phone, r.purchases,
        r.courses, r.subfolders, r.spend.toFixed(2), r.banned?'Yes':'No'
      ])
    ]);
    /* Per-student enrollment sheet */
    const enrollRows = [['Student','Email','Item Purchased','Type','Amount (ZMW)','Date']];
    rows.forEach(r => r.purchasesList.forEach(p => {
      enrollRows.push([
        r.name, r.email, p.item, p.type,
        p.amount.toFixed(2), fmtDate(p.date)
      ]);
    }));
    addSheet('Enrollments (Detail)', enrollRows);
  }

  /* ---------- LECTURERS ---------- */
  else if(STATE.module === 'lecturers'){
    const now = Date.now();
    const lectArr = Object.entries(S.lecturerData).map(([id,d])=>({id,...d}));
    const rows = lectArr.map(l => {
      let status = l.status||'pending';
      if(l.banned) status = 'banned';
      else if(l.status === 'approved' && (!l.accessExpiresAt || l.accessExpiresAt > now)) status = 'active';
      else if(l.status === 'approved' && l.accessExpiresAt && l.accessExpiresAt <= now) status = 'expired';
      return {
        name:l.name||'', email:l.email||'', phone:l.phone||'',
        college:l.collegeName||'', status,
        paidAmount:num(l.paidAmount),
        courses: Object.values(S.courses).filter(c=>c.lecturerId===l.id).length
      };
    });
    addSheet('Lecturers', [
      ...infoRows,
      ['Name','Email','Phone','College','Status','Paid (ZMW)','Courses'],
      ...rows.map(r=>[
        r.name, r.email, r.phone, r.college, r.status,
        r.paidAmount.toFixed(2), r.courses
      ])
    ]);
  }

  XLSX.writeFile(wb, `UTOM-${STATE.module}-${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel downloaded','success');
}

console.log('✅ UTOM Reports Studio — complete with Best Sellers, Enrollments & drill-downs.');
</script>
</body>
</html>
